<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת הניחושים - ריאל מדריד 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }

        body {
            background-color: #ffffff;
            color: #111827;
            padding: 20px 10px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header בכחול לבן נקי */
        header {
            background-color: #00529f;
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
        p.subtitle { font-size: 0.95rem; opacity: 0.9; }

        .add-player-form {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .add-player-form input {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .add-player-form button {
            background-color: #002f6c;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        /* סרגל ניקוד השחקנים */
        .scoreboard {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .player-card {
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-card .score {
            background-color: #00529f;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 4px;
        }

        /* טבלה */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }

        th {
            background-color: #00529f;
            color: #ffffff;
            padding: 10px;
            font-weight: 700;
            border: 1px solid #004080;
        }

        th.player-th {
            background-color: #003366;
            min-width: 70px;
        }

        td {
            padding: 8px 6px;
            border: 1px solid #e5e7eb;
        }

        tr:nth-child(even) { background-color: #f9fafb; }
        tr:hover { background-color: #f0f7ff; }

        td.match-name { text-align: right; font-weight: 700; white-space: nowrap; padding-right: 12px; }
        td.match-date { color: #6b7280; font-size: 0.8rem; white-space: nowrap; }

        tr.clasico { background-color: #fef2f2 !important; }
        tr.clasico td.match-name { color: #dc2626; }

        /* שדות קלט למספרים */
        input.score-in {
            width: 45px;
            text-align: center;
            padding: 4px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-weight: 700;
            direction: ltr;
        }

        input.actual-in {
            border-color: #00529f;
            background-color: #eef6ff;
            color: #00529f;
        }

        /* צ'קבוקסים של מי צדק */
        .winners-box {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .winner-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            color: #4b5563;
        }

        .winner-btn.active {
            background-color: #00529f;
            color: #ffffff;
            border-color: #00529f;
            font-weight: 700;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .reset-btn {
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1>ליגת הניחושים - ריאל מדריד 2026/27</h1>
        <p class="subtitle">סנכרון בזמן אמת בשרת ענן (Firebase)</p>
        <div class="add-player-form">
            <input type="text" id="newPlayerName" placeholder="שם שחקן...">
            <button onclick="addNewPlayer()">הוסף</button>
        </div>
    </header>

    <div class="scoreboard" id="playersBar"></div>

    <div class="top-bar">
        <span>🌐 מחובר ומסונכרן</span>
        <button class="reset-btn" onclick="resetAllData()">איפוס נתונים</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr id="tableHeaderRow"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // === FIREBASE CONFIGURATION ===
    const firebaseConfig = {
        apiKey: "AIzaSyCNkYBoD6fBQ-uxmn8tj78yS96a9ipc-5w",
        authDomain: "hablnacos.firebaseapp.com",
        databaseURL: "https://hablnacos-default-rtdb.firebaseio.com",
        projectId: "hablnacos",
        storageBucket: "hablnacos.appspot.com",
        messagingSenderId: "1098555243394",
        appId: "1:1098555243394:web:e00bf2adcf538bd1b97087"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const DEFAULT_PLAYERS = ["ניר", "ליאור", "אבירם", "שון", "חן", "מאור"];
    let currentPlayers = [];
    let currentData = {};

    const matches = [
        { match: "אספניול - ריאל מדריד", date: "22/08/2026", defaultActual: "1-2" },
        { match: "ריאל מדריד - ריאל סוסיאדד", date: "26/08/2026" },
        { match: "ריאל מדריד - מלאגה", date: "30/08/2026" },
        { match: "ריאל בטיס - ריאל מדריד", date: "04/09/2026" },
        { match: "ריאל מדריד - ראיו ואייקאנו", date: "13/09/2026" },
        { match: "אלצ'ה - ריאל מדריד", date: "16/09/2026" },
        { match: "אתלטיקו מדריד - ריאל מדריד", date: "20/09/2026" },
        { match: "ריאל מדריד - ויאריאל", date: "11/10/2026" },
        { match: "ריאל מדריד - סביליה", date: "18/10/2026" },
        { match: "ברצלונה - ריאל מדריד", date: "25/10/2026", isClasico: true },
        { match: "ראסינג סנטנדר - ריאל מדריד", date: "01/11/2026" },
        { match: "ולנסיה - ריאל מדריד", date: "08/11/2026" },
        { match: "ריאל מדריד - סלטה ויגו", date: "22/11/2026" },
        { match: "ריאל מדריד - דפורטיבו אלאבס", date: "29/11/2026" },
        { match: "אתלטיק בילבאו - ריאל מדריד", date: "06/12/2026" },
        { match: "ריאל מדריד - אוססונה", date: "13/12/2026" },
        { match: "דפורטיבו לה קורוניה - ריאל מדריד", date: "20/12/2026" },
        { match: "ריאל מדריד - חטאפה", date: "03/01/2027" },
        { match: "ריאל מדריד - לבאנטה", date: "10/01/2027" },
        { match: "מלאגה - ריאל מדריד", date: "17/01/2027" },
        { match: "ריאל מדריד - ריאל בטיס", date: "24/01/2027" },
        { match: "ראיו ואייקאנו - ריאל מדריד", date: "31/01/2027" },
        { match: "ריאל סוסיאדד - ריאל מדריד", date: "07/02/2027" },
        { match: "ריאל מדריד - אתלטיק בילבאו", date: "14/02/2027" },
        { match: "סביליה - ריאל מדריד", date: "21/02/2027" },
        { match: "ריאל מדריד - ולנסיה", date: "28/02/2027" },
        { match: "ויאריאל - ריאל מדריד", date: "06/03/2027" },
        { match: "ריאל מדריד - אספניול", date: "13/03/2027" },
        { match: "סלטה ויגו - ריאל מדריד", date: "20/03/2027" },
        { match: "ריאל מדריד - אתלטיקו מדריד", date: "03/04/2027" },
        { match: "אוססונה - ריאל מדריד", date: "10/04/2027" },
        { match: "חטאפה - ריאל מדריד", date: "17/04/2027" },
        { match: "ריאל מדריד - אלצ'ה", date: "20/04/2027" },
        { match: "לבאנטה - ריאל מדריד", date: "01/05/2027" },
        { match: "ריאל מדריד - ברצלונה", date: "08/05/2027", isClasico: true },
        { match: "ריאל מדריד - ראסינג סנטנדר", date: "15/05/2027" },
        { match: "דפורטיבו אלאבס - ריאל מדריד", date: "22/05/2027" },
        { match: "ריאל מדריד - דפורטיבו לה קורוניה", date: "29/05/2027" }
    ];

    db.ref('league_data').on('value', snapshot => {
        const data = snapshot.val() || {};
        currentPlayers = data.players || DEFAULT_PLAYERS;
        currentData = data.predictions || {};
        renderUI();
    });

    function saveToCloud() {
        db.ref('league_data').set({
            players: currentPlayers,
            predictions: currentData
        });
    }

    function addNewPlayer() {
        const input = document.getElementById("newPlayerName");
        const name = input.value.trim();
        if (!name) return;
        if (currentPlayers.includes(name)) { alert("השחקן כבר קיים"); return; }
        currentPlayers.push(name);
        input.value = "";
        saveToCloud();
    }

    function removePlayer(name) {
        if (confirm(`להסיר את ${name}?`)) {
            currentPlayers = currentPlayers.filter(p => p !== name);
            saveToCloud();
        }
    }

    function onInputSave(key, value) {
        currentData[key] = value;
        db.ref(`league_data/predictions/${key}`).set(value);
    }

    function onWinnerToggle(idx, player) {
        const key = `winners_${idx}`;
        let winners = currentData[key] || [];

        if (winners.includes(player)) {
            winners = winners.filter(p => p !== player);
        } else {
            winners.push(player);
        }

        currentData[key] = winners;
        db.ref(`league_data/predictions/${key}`).set(winners);
    }

    function updateScores() {
        const scores = {};
        currentPlayers.forEach(p => scores[p] = 0);

        matches.forEach((_, idx) => {
            const winners = currentData[`winners_${idx}`] || [];
            winners.forEach(player => {
                if (scores[player] !== undefined) scores[player]++;
            });
        });

        currentPlayers.forEach(player => {
            const el = document.getElementById(`score_${player}`);
            if (el) el.innerText = `${scores[player]} נק'`;
        });
    }

    function renderUI() {
        document.getElementById("playersBar").innerHTML = currentPlayers.map(player => `
            <div class="player-card">
                <button class="remove-btn" onclick="removePlayer('${player}')">×</button>
                <span>${player}</span>
                <span class="score" id="score_${player}">0 נק'</span>
            </div>
        `).join("");

        document.getElementById("tableHeaderRow").innerHTML = `
            <th style="text-align: right; padding-right: 12px;">משחק</th>
            <th>תאריך</th>
            <th>תוצאה</th>
            <th>מי צדק?</th>
            ${currentPlayers.map(p => `<th class="player-th">${p}</th>`).join("")}
        `;

        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        matches.forEach((m, idx) => {
            const tr = document.createElement("tr");
            if (m.isClasico) tr.classList.add("clasico");

            const savedActual = currentData[`actual_${idx}`] !== undefined ? currentData[`actual_${idx}`] : (m.defaultActual || "");
            const savedWinners = currentData[`winners_${idx}`] || [];

            const winnersHTML = currentPlayers.map(player => {
                const isChecked = savedWinners.includes(player);
                return `
                    <button class="winner-btn ${isChecked ? 'active' : ''}" onclick="onWinnerToggle('${idx}', '${player}')">
                        ${player}
                    </button>
                `;
            }).join("");

            const predictionsHTML = currentPlayers.map(player => {
                const savedPred = currentData[`pred_${idx}_${player}`] || "";
                return `
                    <td>
                        <input type="text" class="score-in" value="${savedPred}" placeholder="-" onchange="onInputSave('pred_${idx}_${player}', this.value)">
                    </td>
                `;
            }).join("");

            tr.innerHTML = `
                <td class="match-name">${m.isClasico ? '🔥 ' : ''}${m.match}</td>
                <td class="match-date">${m.date}</td>
                <td><input type="text" class="score-in actual-in" value="${savedActual}" placeholder="0-0" onchange="onInputSave('actual_${idx}', this.value)"></td>
                <td><div class="winners-box">${winnersHTML}</div></td>
                ${predictionsHTML}
            `;
            tbody.appendChild(tr);
        });

        updateScores();
    }

    function resetAllData() {
        if (confirm("למחוק את כל הנתונים בענן?")) {
            db.ref('league_data').remove();
        }
    }
</script>
</body>
</html>
