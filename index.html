<style>/* Match centre: stadium floodlights and broadcast typography */

.live-match-card {background:radial-gradient(ellipse at 0 100%,#285942 0,transparent 60%),linear-gradient(120deg,#14382d,#0a241c 68%,#293c2c);border:1px solid #42624a;box-shadow:0 12px 28px #0005;border-radius:18px}
.live-match-card::before {background:repeating-linear-gradient(135deg,transparent 0 29px,#fff1 30px,transparent 31px);opacity:.25}
.live-match-card::after {display:none}
.lmv-demo-ribbon {position:relative;inset:auto;padding:8px 16px;background:#12192d}
.lmv-top-bar {padding:14px 18px;border-bottom:1px solid #ffffff1a}
.lmv-comp,.lmv-minute-pill {color:#e0efdf}
.lmv-crest-ring {border:0;background:transparent;box-shadow:none;width:clamp(48px,13vw,84px);height:auto}
.lmv-body {padding:24px 12px}
.lmv-scoreboard {background:none;border:0;box-shadow:none;padding:0;gap:4px}
.lmv-score-num {color:#fff;font:900 clamp(2.4rem,9vw,4.6rem)/1 system-ui;text-shadow:none;min-width:0;font-variant-numeric:tabular-nums}
.lmv-progress span {background:#a3ce98}
.lmv-footer {background:#091d16aa}
.xa-live .xa-card {background:#112d23;border-color:#345543}
.xa-live .xa-chips {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr))}
.xa-live .xa-chip {justify-content:space-between;border-radius:8px}
.xa-live .xa-chip i {color:#fff}
.pred-box-mini.pts-3, td.c-pred.pts-3 {background:#153f32 !important}
.pred-box-mini.pts-1, td.c-pred.pts-1 {background:#653811 !important}
.pred-box-mini.pts-0, td.c-pred.pts-0 {background:#552631 !important}
#xaLive {box-sizing:border-box;max-width:760px;width:100%;margin:12px auto}
#xaLive .xa-h {align-items:baseline;gap:12px}
#xaLive .xa-score {flex:none}
#lineupBody .lineup-score {background:linear-gradient(115deg,#163529,#2c533c);border-color:#58755c;color:#e6f3df;padding:14px}
.lineup-score b {font:900 2rem/1 system-ui;color:white}
#lineupBody .xa-chips,.match-events {margin:12px 14px}
.match-events summary {cursor:pointer;font-weight:700;padding:8px}
#matchAlert:not([hidden]) {position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline:0;margin:auto;width:min(92vw,440px);z-index:10000;background:#152f24;color:white;border:1px solid #dcc38d;border-radius:14px;padding:14px 42px 14px 16px;box-shadow:0 8px 32px #0007}
#matchAlert strong,#matchAlert span {display:block}
#matchAlert button {color:inherit;background:transparent;border:0;cursor:pointer;padding:5px}
#matchAlert button:first-child {position:absolute;inset-inline-start:8px;top:7px;font-size:1.3rem}
#matchAlert [data-action] {text-decoration:underline}
.p-photo {object-fit:contain;object-position:center bottom}

/* Ratings: match picker, two compact team sheets and a shared source line. */
#ratingsArchive {max-width:860px;margin:18px auto;color:#eff9f1;background:linear-gradient(145deg,#163c31,#09231d 68%);border:1px solid #36594b;border-radius:18px;text-align:start;overflow:hidden}
#ratingsArchive>summary {display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;list-style:none}
#ratingsArchive summary::-webkit-details-marker {display:none}
#ratingsArchive>summary:focus-visible,#ratingsArchive button:focus-visible,#ratingsArchive section summary:focus-visible {outline:2px solid #f6cf80;outline-offset:-3px}
.ra-title {font:900 1.12rem var(--font-display)}
.ra-emblem {width:31px;height:31px;display:grid;place-items:center;background:#f1c979;color:#193526;border-radius:9px}
.ra-season {font-size:.72rem;color:#b7cebf}
.ra-chevron {margin-inline-start:auto;color:#e7bd76;font-size:1.3rem}
#ratingsArchive[open] .ra-chevron {transform:rotate(180deg)}
.ra-content {padding:0 16px 12px}
.ra-picker {position:relative;display:flex;align-items:center;gap:12px;padding:12px 15px;background:radial-gradient(ellipse at 80% 120%,#315a47,#163b2e 70%);border:1px solid #4d725e;border-radius:12px}
.ra-picker:focus-within {outline:2px solid #efd099}
.ra-picker:hover {border-color:#a19274}
#ratingFixture {position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:1rem}
.ra-match {display:grid;gap:2px;min-width:0}
.ra-match label {color:#debf88;font-size:.67rem;font-weight:800}
#ratingMatch {font:800 1.12rem/1.3 var(--font-display);overflow-wrap:anywhere}
#ratingDate {font-size:.73rem;color:#c2dbca}
.ra-change {margin-inline-start:auto;padding:4px 9px;border:1px solid #668572;border-radius:7px;font-size:.76rem;color:#f1faf3;white-space:nowrap}
#ratingCrests {display:flex;align-items:center;direction:ltr}
.ra-crest,.ra-face {position:relative;flex:none;display:inline-grid;place-items:center;overflow:hidden;width:32px;height:32px;border-radius:50%;background:#365846;color:#dff2e4;font:700 11px/1 system-ui}
.ra-loaded {color:transparent}
.ra-crest img,.ra-face img {position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ra-crest {background:#e6eee8;color:#365846}
.ra-crest.ra-loaded {color:transparent}
.ra-crest img {padding:4px}
#ratingCrests .ra-crest {width:37px;height:37px;border:2px solid #20462f}
#ratingCrests .ra-crest+ .ra-crest {margin-left:-9px}
#ratingTeams {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px;direction:ltr}
#ratingTeams section {direction:rtl;border:1px solid #355a49;background:#102e24;border-radius:12px;padding:10px;text-align:start}
#ratingTeams h3 {display:flex;align-items:center;gap:7px;margin:0 2px 8px;color:#e1f3e7;font:800 .9rem var(--font-display)}
#ratingTeams h3 .ra-crest {width:23px;height:23px}
#ratingTeams ol {list-style:none;margin:0;padding:0}
#ratingTeams li {display:flex;align-items:center;gap:9px;padding:5px 6px;border-bottom:1px solid #284939;min-width:0}
#ratingTeams li:last-child {border-bottom:none}
#ratingTeams .ra-leader {border:1px solid #577f54;border-radius:8px;background:linear-gradient(102deg,#1b3927,#304a32);padding:7px;margin-bottom:2px}
.ra-leader .ra-face {width:43px;height:43px;background:#3c5a3e}
.ra-player {display:grid;min-width:0;gap:2px}
.ra-player small {font-size:.64rem;color:#f5dca6}
.ra-player bdi {font-weight:700;font-size:.88rem;overflow-wrap:anywhere}
.ra-score {margin-inline-start:auto;flex:none;min-width:2.5em;text-align:center;padding:3px 5px;border-radius:6px;background:#2b4a38;color:#e7f3e9;font:800 .83rem var(--font-mono);font-variant-numeric:tabular-nums}
.ra-score.ra-gold {background:#f4d395;color:#332719}
.ra-score.ra-green {background:#244c44;color:#bdffe6}
.ra-score.ra-none {background:transparent;color:#a7c4b2;font:600 .73rem var(--font-body)}
#ratingTeams details summary {display:flex;justify-content:center;align-items:center;gap:7px;color:#c5e3cf;cursor:pointer;font-size:.77rem;font-weight:700;padding:7px;list-style:none}
#ratingTeams details summary::after {content:"⌄"} #ratingTeams details[open] summary::after {content:"⌃"}
#ratingTabs {display:none}
.ra-footer {display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin-top:9px}
.ra-footer p {margin:0;color:#afcebc;font-size:.72rem}
.ra-footer>div {display:flex;align-items:center;gap:12px}
#ratingSource,#ratingRetry,.ratings-link {font:700 .76rem var(--font-body);color:#e5c48b}
#ratingRetry,.ratings-link {background:transparent;border:1px solid #466652;border-radius:6px;cursor:pointer;padding:4px 8px}
#ratingRetry:disabled {opacity:.65}
@media(max-width:620px){
  .ra-content {padding:0 10px 10px}
  #ratingsArchive>summary {padding:12px}
  .ra-picker {gap:7px;padding:10px}
  #ratingCrests .ra-crest {width:27px;height:27px}
  .ra-change {font-size:.68rem;padding:4px}
  #ratingMatch {font-size:.98rem}
  #ratingTabs {display:flex;direction:ltr;gap:4px;margin-top:9px;padding:3px;background:#0a2118;border-radius:9px}
  #ratingTabs:empty {display:none}
  #ratingTabs button {direction:rtl;flex:1;min-width:0;padding:6px;background:none;color:#bcd8c6;border:0;border-radius:6px;font:700 .8rem var(--font-body);cursor:pointer}
  #ratingTabs button[aria-pressed=true] {background:#315340;color:white}
  #ratingTeams {grid-template-columns:1fr;margin-top:6px}
  #ratingTeams section:not(.ra-active) {display:none}
}

/* Both halves keep their physical sides in an RTL page, including on phones. */
.live-field {background:linear-gradient(145deg,#11372b,#0a241d);border:1px solid #365c46;border-radius:16px;overflow:hidden;color:#e5f3e8;text-align:start;padding:12px;direction:rtl;container-type:inline-size}
.lf-heading {display:flex;align-items:center;gap:9px;margin-bottom:9px}
.lf-heading h3 {font:900 1.07rem var(--font-display);color:#faf6df;margin:0}
.lf-kicker,.lf-source {font-size:.7rem;color:#b4d3bf}
.lf-kicker {border-inline-end:2px solid #d0ac61;padding-inline-end:9px}
.lf-labels {display:flex;justify-content:space-between;align-items:center;direction:ltr;margin:0 2px 6px}
.lf-labels button {display:inline-flex;align-items:baseline;gap:5px;font-size:.84rem;background:#113526;color:#edf8ea;border:1px solid #486854;border-radius:6px;padding:3px 6px;cursor:pointer}
.lf-labels button[aria-pressed=true] {border-color:#e0c37f}
.lf-labels i {font-style:normal;color:#dace9c}
.lf-grass[data-half="0"] .lf-half:last-child,.lf-grass[data-half="1"] .lf-half:nth-child(2) {display:none}
.lf-grass:not([data-half="all"]) .lf-half {width:100%}
.lf-grass:not([data-half="all"])::after,.lf-grass:not([data-half="all"]) .lf-mark {display:none}
.lf-grass:not([data-half="all"]) .lf-head {width:32px;height:32px}
.lf-grass:not([data-half="all"]) .lf-name {font-size:.7rem}
.lf-unplaced .lf-rank {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center}
.lf-labels small {color:#bcdbbf;font:600 .65rem var(--font-mono)}
.lf-grass {position:relative;isolation:isolate;display:flex;direction:ltr;min-height:286px;border-radius:7px;overflow:hidden;border:1px solid #83a87c;background:repeating-linear-gradient(90deg,#205b3e 0%,#205b3e 10%,#236444 10%,#236444 20%)}
.lf-grass:before,.lf-grass:after,.lf-mark,.lf-mark:after,.lf-half:before {position:absolute;content:"";pointer-events:none;z-index:-1}
.lf-grass:before {inset:5px;border:1px solid #c8e1b279}
.lf-grass:after {top:5px;bottom:5px;left:50%;border-left:1px solid #c8e1b29c}
.lf-mark {width:17%;aspect-ratio:1;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid #c8e1b279;border-radius:50%}
.lf-mark:after {top:50%;left:50%;width:4px;height:4px;border-radius:100%;background:#bfdfa6}
.lf-half {position:relative;display:flex;align-items:stretch;width:50%;padding:8px 2px;gap:1px}
.lf-half:last-child {flex-direction:row-reverse}
.lf-half:before {top:27%;bottom:27%;left:5px;width:19%;border:1px solid #c8e1b279}
.lf-half:last-child:before {left:auto;right:5px}
.lf-rank {flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:3px}
.lf-half:last-child .lf-rank {flex-direction:column-reverse}
.lf-player {display:flex;flex-direction:column;align-items:center;width:100%;border:0;padding:0 1px;background:none;color:#fff;cursor:pointer;font:700 .68rem/1.15 var(--font-body);min-width:0}
.lf-head {display:grid;place-items:center;position:relative;width:clamp(20px,5.9cqw,36px);height:clamp(20px,5.9cqw,36px);border:1px solid #e2eddb;border-radius:50%;background:#314d41;color:#fff}
.lf-head img {position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:contain;object-position:bottom;background:#314d41}
.lf-player[aria-pressed=true] .lf-head,.lf-player:focus-visible .lf-head {outline:2px solid #ffdd81;outline-offset:1px}
.lf-head i {position:absolute;bottom:-1px;left:-3px;background:#a6f5ba;color:#103a22;font:900 10px/1 system-ui;border-radius:50%;padding:1px}
.lf-name {display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #0b2116}
.lf-player>b {color:#fff0c1;background:#183527;border-radius:4px;padding:1px 3px;font:800 .63rem var(--font-mono)}
.lf-message,.lf-detail,.lf-sub,.lf-source {display:block;margin:7px 0 0;font-size:.78rem}
.lf-sub {border-top:1px solid #43604e;padding-top:7px}
.lf-sub strong {color:#f1d08c}
.lf-missing {align-items:center;justify-content:center;font-size:.75rem}
@container (max-width:420px) {
 .lf-grass {min-height:242px}
 .lf-player {font-size:.57rem}
 .lf-player>b {font-size:.56rem}
 .lf-labels button {font-size:.72rem}
}
</style>
</head>

    <script>// FotMob IDs are scoped to the fixture and team; never match ratings by name.
globalThis.MatchRatings = (() => {
  const id = value => /^[1-9]\d*$/.test(String(value)) ? String(value) : '';
  const rating = raw => {
    if (typeof raw !== 'number' && typeof raw !== 'string') return null;
    const n = Number(raw);
    return Number.isFinite(n) && n > 0 && n <= 10 ? n.toFixed(1) : null;
  };
  function extract(match, fixture) {
    const g=match.general, content=match.content;
    if (!id(fixture.id) || id(g?.matchId)!==id(fixture.id) || !content ||
        ![g.homeTeam?.id,g.awayTeam?.id].some(i=>id(i)==='8633')) throw Error('Unexpected match');
    const teams=['home','away'].map(side=>{
      const team=g[side+'Team'], teamId=id(team?.id);
      if (!teamId || (fixture[side]?.id && id(fixture[side].id)!==teamId)) throw Error('Unexpected team');
      const rows=new Map(), lineup=content.lineup?.[side+'Team'];
      if (content.lineup?.lineupType==='standard' && id(lineup?.id)===teamId) {
        for (const p of [...(lineup.starters||[]),...(lineup.subs||[])]) {
          if (id(p.id)) rows.set(id(p.id),{id:id(p.id),name:p.name,score:rating(p.performance?.rating ?? p.rating?.num ?? p.rating)});
        }
      }
      for (const p of Object.values(content.playerStats||{})) {
        if (!id(p.id) || id(p.teamId)!==teamId) continue;
        const row=rows.get(id(p.id)) || {id:id(p.id),name:p.name,score:null};
        for (const group of p.stats||[]) {
          const stat=Object.values(group.stats||{}).find(s=>s?.key==='rating_title');
          row.score ??= rating(stat?.stat?.value);
        }
        rows.set(row.id,row);
      }
      return {id:teamId,name:team.name,players:[...rows.values()]};
    });
    return {id:id(fixture.id),teams,checked:Date.now()};
  }
  // Store starters separately from substitutes; ratings alone cannot reconstruct an XI.
  function officialTeams(match,fixture) {
    const lineup=match.content?.lineup;
    if (!id(fixture.id) || id(match.general?.matchId)!==id(fixture.id) || lineup?.lineupType!=='standard') return null;
    const result={available:true,confirmed:true,matchId:fixture.id,kickoff:fixture.kickoff};
    for(const side of ['home','away']) {
      const team=lineup[side+'Team'], expected=id(match.general[side+'Team']?.id);
      if (fixture[side]?.id && expected!==id(fixture[side].id)) return null;
      if (!team?.starters?.length) {result[side]=null;continue;}
      if (!expected || id(team.id)!==expected) return null;
      const player=p=>({fotmobId:id(p.id),name:p.name,number:p.shirtNumber});
      result[side]={name:team.name,formation:team.formation,
        logo:'https://images.fotmob.com/image_resources/logo/teamlogo/'+expected+'.png',
        startXI:team.starters.map(player),subs:(team.subs||[]).map(player)};
    }
    return result.home || result.away ? result : null;
  }
  const requests=new Map(), snapshots=new Map();
  function current(key) {
    return snapshots.get(id(key)) || globalThis.ratingsHistory?.find(s=>s.id===id(key));
  }
  async function details(fixture) {
    const key=id(fixture?.id);
    if (!key) throw Error('Missing fixture ID');
    if (!requests.has(key)) {
      const request=(async()=>{
        const r=await fetch('./api/match-details?matchId='+key,{cache:'no-store',signal:AbortSignal.timeout(10000)});
        if(!r.ok) throw Error('Match unavailable');
        return r.json();
      })().finally(()=>requests.delete(key));
      requests.set(key,request);
    }
    const match=await requests.get(key);
    const snapshot=extract(match,fixture);
    snapshots.set(key,snapshot);
    return match;
  }
  function playerScore(snapshot,playerId) {
    if (!id(playerId)) return null;
    for (const t of snapshot?.teams||[]) {
      const p=t.players.find(p=>p.id===id(playerId));
      if(p) return p.score;
    }
    return null;
  }
  return {extract,officialTeams,details,current,playerScore};
})();

    <script>(() => {
  const panel=document.getElementById('ratingsArchive'), select=document.getElementById('ratingFixture');
  const status=document.getElementById('ratingStatus'), teams=document.getElementById('ratingTeams');
  const source=document.getElementById('ratingSource'), retry=document.getElementById('ratingRetry');
  const fixtures=new Map(ratingsHistory.map(s=>[s.id,{
    id:s.id,home:s.teams[0],away:s.teams[1],kickoff:s.kickoff,league:s.competition,finished:true
  }]));
  const loading=new Set(), errors=new Set();
  let touched=false, optionSignature="";
  const el=(tag,text)=>Object.assign(document.createElement(tag),{textContent:text});
  let painted="", activeTeam="", lastFixture="";
  const tabs=document.getElementById('ratingTabs');
  const HebrewDate=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jerusalem'});
  function teamName(t){
    if(String(t.id)==='8633')return 'ריאל מדריד';
    if(String(t.id)==='8640')return 'פ.ס.וו. איינדהובן';
    try {return TEAM_ALIASES[canonicalTeam(t.name)]?.[0] || t.name;}catch{return t.name;}
  }
  function avatar(person,club=false) {
    const frame=el('span',(person.name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join(''));
    frame.className=club?'ra-crest':'ra-face';frame.setAttribute('aria-hidden','true');
    if(/^\d+$/.test(person.id)){
      const img=new Image();img.alt='';img.loading=club?'eager':'lazy';img.decoding='async';
      img.onload=()=>frame.classList.add('ra-loaded');img.onerror=()=>img.remove();
      img.src='https://images.fotmob.com/image_resources/'+(club?'logo/teamlogo/':'playerimages/')+person.id+'.png';
      frame.append(img);
    }
    return frame;
  }
  function activate(id){
    activeTeam=id;
    for(const btn of tabs.children)btn.setAttribute('aria-pressed',String(btn.dataset.team===id));
    for(const card of teams.children)card.classList.toggle('ra-active',card.dataset.team===id);
  }
  function roster(s,key) {
    const signature=JSON.stringify([key,s?.teams]);
    if(signature===painted)return;
    const expanded=new Set(lastFixture===key?[...teams.querySelectorAll('details[open]')].map(d=>d.parentNode.dataset.team):[]);
    const focused=teams.contains(document.activeElement)?document.activeElement.closest('section')?.dataset.team:null;
    painted=signature;
    if(lastFixture!==key)activeTeam='';
    lastFixture=key;teams.replaceChildren();tabs.replaceChildren();
    for(const t of [...(s?.teams||[])].sort((a,b)=>Number(b.id==='8633')-Number(a.id==='8633'))){
      const btn=el('button',teamName(t));btn.type='button';btn.dataset.team=t.id;
      btn.onclick=()=>activate(t.id);tabs.append(btn);
      const section=el('section','');section.dataset.team=t.id;
      const header=el('h3','');header.append(avatar(t,true),el('span',teamName(t)));section.append(header);
      const sorted=[...t.players].sort((a,b)=>(b.score??-1)-(a.score??-1));
      const list=el('ol',''),moreList=el('ol','');
      sorted.forEach((p,i)=>{
        const item=el('li',''),name=el('bdi',p.name),score=el('span',p.score ?? 'ללא ציון');
        const identity=el('span','');identity.className='ra-player';
        if(!i && p.score!==null){item.className='ra-leader';identity.append(el('small','הציון המוביל בקבוצה'));}
        identity.append(name);score.className='ra-score '+(p.score===null?'ra-none':Number(p.score)>=8?'ra-gold':Number(p.score)>=7?'ra-green':'');
        item.append(avatar(p),identity,score);
        (i<4?list:moreList).append(item);
      });
      section.append(list);
      if(!sorted.length)section.append(el('p','אין נתוני שחקנים למשחק הזה'));
      if(sorted.length>4){
        const details=el('details',''),summary=el('summary','');summary.append(el('span','יתר השחקנים ('+(sorted.length-4)+')'));
        details.append(summary,moreList);details.open=expanded.has(t.id);section.append(details);
      }
      teams.append(section);
    }
    activate([...teams.children].some(e=>e.dataset.team===activeTeam)?activeTeam:teams.firstChild?.dataset.team||'');
    if(focused)[...teams.children].find(e=>e.dataset.team===focused)?.querySelector('summary')?.focus({preventScroll:true});
  }
  function options(){
    const old=select.value, list=[...fixtures.values()].sort((a,b)=>Number(a.finished)-Number(b.finished)||Date.parse(b.kickoff)-Date.parse(a.kickoff));
    const signature=JSON.stringify(list.map(f=>[f.id,f.finished,f.kickoff,f.home.name,f.away.name]));
    if(signature===optionSignature) return;
    optionSignature=signature;
    const grouped=new Map();
    for(const f of list){
      const date=new Date(f.kickoff);
      const month=f.finished?date.toLocaleDateString('he-IL',{month:'long',year:'numeric',timeZone:'Asia/Jerusalem'}):'בשידור חי';
      if(!grouped.has(month))grouped.set(month,Object.assign(document.createElement('optgroup'),{label:month}));
      grouped.get(month).append(new Option(date.toLocaleDateString('he-IL',{day:'numeric',month:'numeric',timeZone:'Asia/Jerusalem'})+' · '+teamName(f.home)+' – '+teamName(f.away),f.id));
    }
    select.replaceChildren(...grouped.values());
    select.value=(touched && fixtures.has(old)) ? old : String(list[0]?.id||'');
  }
  function render(){
    const f=fixtures.get(select.value), s=f && MatchRatings.current(f.id);
    roster(s,select.value);
    source.hidden=!f; retry.disabled=!f || loading.has(select.value);
    if(!f){status.textContent='לא נמצאו משחקים';return;}
    source.href='https://www.fotmob.com/match/'+f.id;
    const parts=[f.finished?'סיום':'חי · בדיקה כל 15 שניות'];
    if(s) parts.push('נבדק מול FotMob: '+new Date(s.checked).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem'})+' (ישראל)');
    if(errors.has(select.value)) parts.push(s?'הבדיקה נכשלה · מוצגים הנתונים האחרונים':'לא ניתן לטעון כעת');
    else if(loading.has(select.value)) parts.push('בודק עדכון…');
    if(s && !s.teams.some(t=>t.players.some(p=>p.score!==null))) parts.push('הספק לא פרסם ציונים למשחק הזה');
    status.textContent=parts.join(' · ');
    const ordered=[f.home,f.away].sort((a,b)=>Number(String(b.id)==='8633')-Number(String(a.id)==='8633'));
    const crests=document.getElementById('ratingCrests');
    if(crests.dataset.fixture!==String(f.id)){
      crests.replaceChildren(...ordered.map(t=>avatar(t,true)));crests.dataset.fixture=String(f.id);
    }
    document.getElementById('ratingMatch').textContent=ordered.map(teamName).join(' · ');
    document.getElementById('ratingDate').textContent=[HebrewDate.format(new Date(f.kickoff)),({'Champions League':'ליגת האלופות','LaLiga':'לה ליגה','Club Friendlies':'משחק הכנה'})[f.league] || f.league].filter(Boolean).join('  /  ');
  }
  async function check(){
    const key=select.value,f=fixtures.get(key);
    if(!f || loading.has(key) || !panel.open || document.hidden)return;
    loading.add(key);errors.delete(key);render();
    try {await MatchRatings.details(f);}
    catch {errors.add(key);}
    finally {loading.delete(key);if(select.value===key)render();}
  }
  options();
  window.addEventListener('ratings:fixtures',({detail})=>{
    const old=select.value, wasLive=fixtures.get(old)?.finished===false;
    for(const f of detail) if(f.kickoff>='2026-07-01' && f.kickoff<'2027-07-01' && (f.finished||f.started) && /^\d+$/.test(f.id) && f.home && f.away) fixtures.set(String(f.id),{...f,finished:!!f.finished});
    options();
    if(panel.open && (old!==select.value || (wasLive && fixtures.get(select.value)?.finished)))check();
  });
  window.openMatchRatings=id=>{
    if(!fixtures.has(String(id)))return;
    select.value=String(id);touched=true;
    if(panel.open)check();else panel.open=true;
    panel.scrollIntoView({block:'start'});
  };
  panel.addEventListener('toggle',()=>{if(panel.open){render();check();}});
  select.onchange=()=>{touched=true;render();check();};
  retry.onclick=check;
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
  setInterval(()=>{if(!fixtures.get(select.value)?.finished)check();},15000);
})();
</script>

    function findFotmobFixture(m) {
        if (!fotmobFixtures.length) return null;
        const teams = splitMatchTeams(m);
        if (!teams) return null;
        const want = teams.map(canonicalTeam);
        const date = matchDateStr(m);
        const pairMatches = fotmobFixtures.filter(f => {
            const h = canonicalTeam(f.home && f.home.name), a = canonicalTeam(f.away && f.away.name);
            return (h === want[0] && a === want[1]) || (h === want[1] && a === want[0]);
        });
        if (pairMatches.length) {
            if (!date) return pairMatches[0];
            // only one meeting in the feed — it must be this match, unless the stored
            // date is far away (then it is a different round of the same fixture)
            if (pairMatches.length === 1) {
                const only = pairMatches[0];
                if (!only.date) return only;
                const gap = Math.abs(Date.parse(only.date + "T00:00:00Z") - Date.parse(date + "T00:00:00Z"));
                return gap <= 7 * 86400000 ? only : null;
            }
            // the fixture closest to this match's date, and only within one day —
            // otherwise the previous meeting's crests/result would be borrowed
            let best = null, bestDiff = Infinity;
            pairMatches.forEach(f => {
                if (!f.date) return;
                const diff = Math.abs(Date.parse(f.date + "T00:00:00Z") - Date.parse(date + "T00:00:00Z"));
                if (diff < bestDiff) { bestDiff = diff; best = f; }
            });
            // a stored match date can drift a few days from the real fixture;
            // two meetings of the same pair are months apart, so 4 days is safe
            return bestDiff <= 4 * 86400000 ? best : null;
        }
        // only an opponent the data doesn't know may fall back to a ±1 day match
        if (!date) return null;
        const known = new Set();
        fotmobFixtures.forEach(f => { known.add(canonicalTeam(f.home && f.home.name)); known.add(canonicalTeam(f.away && f.away.name)); });
        const unknown = want.filter(t => !known.has(t) && !TEAM_ALIASES[t]);
        if (unknown.length !== 1) return null;
        const near = fotmobFixtures.filter(f => f.date && Math.abs(Date.parse(f.date + "T00:00:00Z") - Date.parse(date + "T00:00:00Z")) <= 86400000);

            if (feeds.every(result => result.status === "rejected")) throw new Error("שני מקורות התוצאות לא זמינים");
            feeds.forEach((result,i) => { if (result.status === "fulfilled") tsdbCache.set(urls[i],result.value); });

            if (!goalAudioCtx) goalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = goalAudioCtx;
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'triangle';
                const t = now + i * 0.14;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            });
        } catch (e) {}
    }

    /* ---- Remove duplicate matches (same teams + same date, any order) ---- */
    function matchTeamPair(m) {
        const parts = String(m.match || "").split("-").map(t => canonicalTeam(t));
        if (parts.length < 2 || !parts[0] || !parts[1]) return null;
        return [parts[0], parts[1]].sort().join("|");
    }
    function matchEffDate(m) {
        return currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
    }
    function countPreds(m) {
        return activePlayersList.filter(p => normalizeScoreStr(currentData[`pred_${m.id}_${p}`])).length;
    }
    function dedupeDuplicateMatches() {
        const groups = new Map();
        currentMatches.forEach(m => {
            if (!m) return;
            const pair = matchTeamPair(m), date = matchEffDate(m);
            if (!pair || !date) return;
            const key = pair + "@" + date;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(m);
        });
        const toRemove = [];
        groups.forEach(arr => {
            if (arr.length < 2) return;
            arr.sort((a, b) => countPreds(b) - countPreds(a));
            arr.slice(1).forEach(m => toRemove.push(m.id));
        });
        if (!toRemove.length) return false;
        currentMatches = currentMatches.filter(m => !toRemove.includes(m.id));
        toRemove.forEach(id => Object.keys(currentData).forEach(k => { if (k.includes(id)) delete currentData[k]; }));
        saveToCloud();
        return true;
    }
    /* ---- Apply API scores automatically ----
       Writes the result only for the match that is actually being played right now,
       or for a finished match that has no result yet (always Real Madrid - opponent).
       A result that is already stored for a match that is no longer playing is never
       rewritten, so past results can't change while another match is being played. */
    function applyAutoScores() {
        if (!autoScoreEnabled) return;
        // התאריך והשעה תמיד מגיעים מהפיד — גם למשחק שהסתיים, כדי שהתאריך בטבלה יהיה הנכון
        let changed = syncAutoDateTimes();
        const now = Date.now();
        currentMatches.forEach(m => {
            if (!m) return;
            const info = apiScoreForMatch(m);
            if (!info) return;
            const evLive = isEventLive(info.event);
            const evFinished = isEventFinished(info.event);
            const st = getMatchStatus(m);
            const ko = matchKickoff(m);
            const playingNow = ko ? (now >= ko - 5 * 60000 && now <= ko + 240 * 60000) : st.isLive;
            if (!evLive && !evFinished) return;
            // the fixture feed owns the score of a match being played — a second
            // feed must never overwrite a live score (e.g. with a stale 0-0)
            const fx = findFotmobFixture(m);
            if (fixtureScoreAvailable(fx) && (evLive || fx.finished)) return;
            const stored = normalizeScoreStr(currentData[`actual_${m.id}`]);
            const flipped = stored !== "" && stored === reverseScore(info.score);
            if (evLive) notifyScoreChange(m, info.score);
            if (currentData[`manualActual_${m.id}`] && playingNow && evLive) clearManualActual(m.id); // בזמן משחק הפיד קובע
            if (currentData[`manualActual_${m.id}`]) return; // manual override — don't overwrite
            const hasStored = stored !== "";
            if (hasStored && !playingNow && !flipped) return; // settled and correct — leave it alone
            if (currentData[`actual_${m.id}`] !== info.score) {
                currentData[`actual_${m.id}`] = info.score;
                db.ref(`league_data/predictions/actual_${m.id}`).set(info.score);
                changed = true;
            }
        });
        if (changed) { sortMatches(); syncAutoWinners(); renderUI(); }
        if (dedupeDuplicateMatches()) { sortMatches(); syncAutoWinners(); renderUI(); }
        checkMatchEndedNotifications();
    }

    /* ============================================================

    function isPredictionLocked(match) {
        if (currentData[`unlocked_${match.id}`]) return false;
        const timeStr = currentData[`time_${match.id}`] !== undefined ? currentData[`time_${match.id}`] : (match.time || "22:00");
        const dateStr = currentData[`date_${match.id}`] !== undefined ? currentData[`date_${match.id}`] : match.date;
        if (!dateStr || !timeStr) return false;

    /* ============================================================
       MATCH STATUS / COUNTDOWN
       ============================================================ */
    function getMatchStatus(match) {
        const fx = findFotmobFixture(match), ev = findApiEvent(match);
        if (fx?.finished || (ev && isEventFinished(ev))) return {text:"✓ הסתיים", isLive:false, isEnded:true};
        if (fx?.started || (ev && isEventLive(ev))) return {text:"⚽ המשחק משוחק כעת!", isLive:true, isEnded:false};
        const timeStr = currentData[`time_${match.id}`] !== undefined ? currentData[`time_${match.id}`] : (match.time || "22:00");
        const dateStr = currentData[`date_${match.id}`] !== undefined ? currentData[`date_${match.id}`] : match.date;
        if (!dateStr || !timeStr) return { text: "שעה לא קיימת", isLive: false, isEnded: false };
        const matchTime = matchKickoff(match);
        const now = new Date().getTime();

        if (diff <= -7200000) return { text: "✓ הסתיים", isLive: false, isEnded: true };
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        if (days > 0) return { text: `⏳ עוד ${days} ימים , ${hours} שעות`, isLive: false, isEnded: false };
        return { text: `⏳ ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`, isLive: false, isEnded: false };

    /* ============================================================
       HEADER NEXT-MATCH WIDGET
       ============================================================ */
    function updateHeaderCountdownWidget() {
        const now = new Date().getTime();
        let nextMatch = null;
        for (let m of currentMatches) {
            if (!m) continue;
            const dateStr = currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
            const timeStr = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "22:00");
            if (!dateStr) continue;
            const matchTime = matchKickoff(m);
            const running = matchTime <= now && now - matchTime < 3 * 3600000 && !getMatchStatus(m).isEnded;
            if (matchTime > now || running) { nextMatch = { ...m, calculatedTime: matchTime, timeStr }; break; }
        }
        const containerEl = document.getElementById("hnmTeamsContainer");
        const infoEl = document.getElementById("hnmInfo");
        const timerEl = document.getElementById("hnmTimer");
        if (!nextMatch) {
            if (containerEl) containerEl.innerHTML = "<span>אין משחקים קרובים כרגע</span>";
            if (infoEl) infoEl.innerText = "--/-- | --:--";
            if (timerEl) timerEl.innerHTML = "";
            targetNextMatchId = ""; return;
        }
        targetNextMatchId = nextMatch.id;
        const nb = predBadgesHTML(nextMatch), parts = String(nextMatch.match).split(" - ");
        if (containerEl) containerEl.innerHTML = `<div class="nmx-team">${nb.real}<b>${parts[0] || ""}</b></div><span class="nmx-vs">VS</span><div class="nmx-team">${nb.opp}<b>${parts[1] || ""}</b></div>`;
        const compEl = document.getElementById("hnmComp"); if (compEl) compEl.innerHTML = getCompBadge(nextMatch.comp);
        const dStr = currentData[`date_${nextMatch.id}`] !== undefined ? currentData[`date_${nextMatch.id}`] : nextMatch.date;
        let wd = ""; try { wd = new Date(`${dStr}T12:00`).toLocaleDateString("he-IL", { weekday: "long" }); } catch (e) {}
        if (infoEl) infoEl.innerText = `${wd} · ${formatDateDisplay(dStr)} · ${nextMatch.timeStr}`;
        const diff = nextMatch.calculatedTime - now;
        if (diff <= 0) {
            const stNow = getMatchStatus(nextMatch), act = liveActualFor(nextMatch);
            if (timerEl) timerEl.innerHTML = stNow.isLive
                ? `<div class="nmx-started">⚽ משחק חי${act ? ` · <b class="sc-nb">${act}</b>` : ""}</div>`
                : `<div class="nmx-started">בהמתנה לשריקת הפתיחה</div>`;
            return;
        }
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        const seg = (v, l) => `<div class="nmx-seg"><b>${String(v).padStart(2, '0')}</b><small>${l}</small></div>`;
        if (timerEl) timerEl.innerHTML = seg(days, "ימים") + seg(hours, "שעות") + seg(minutes, "דקות") + seg(seconds, "שניות");
    }
    function scrollToHeaderTargetMatch() { if (targetNextMatchId) scrollToMatch(targetNextMatchId); }

        if (!matchId) return;

            const rows = document.querySelectorAll("#tableBody tr");
            const filtered = getFilteredMatches();

    function scrollToNextMatch() {

    /* ============================================================
       SAVE / ADD / DELETE
       ============================================================ */
    /* Writes only the two lists it owns. Predictions/results are written key by key,
       so one tab (or the second site) can never overwrite another's newer results. */
    function saveToCloud() {
        db.ref('league_data/activePlayers').set(activePlayersList);
        db.ref('league_data/matches').set(currentMatches);
    }
    const MONTH_NAMES = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
    const PICKER_YEARS = [2025, 2026, 2027, 2028];
    function fillStaticDateSelects() {
        const dSel = document.getElementById("dsd_new"), mSel = document.getElementById("dsm_new"), ySel = document.getElementById("dsy_new");
        if (!dSel || dSel.options.length > 1) return;
        for (let i = 1; i <= 31; i++) dSel.innerHTML += `<option value="${String(i).padStart(2, '0')}">${i}</option>`;
        MONTH_NAMES.forEach((n, i) => mSel.innerHTML += `<option value="${String(i + 1).padStart(2, '0')}">${n}</option>`);
        PICKER_YEARS.forEach(y => ySel.innerHTML += `<option value="${y}">${y}</option>`);
    }
    fillStaticDateSelects();
    function dateSelectsHTML(prefix, value) {
        const parts = String(value || "").split("-");
        const y = parts[0] || "", m = parts[1] || "", d = parts[2] || "";
        let days = `<option value="" disabled ${d ? "" : "selected"} hidden>יום</option>`;
        for (let i = 1; i <= 31; i++) { const v = String(i).padStart(2, '0'); days += `<option value="${v}" ${d === v ? "selected" : ""}>${i}</option>`; }
        let months = `<option value="" disabled ${m ? "" : "selected"} hidden>חודש</option>`;
        MONTH_NAMES.forEach((n, i) => { const v = String(i + 1).padStart(2, '0'); months += `<option value="${v}" ${m === v ? "selected" : ""}>${n}</option>`; });
        let years = `<option value="" disabled ${y ? "" : "selected"} hidden>שנה</option>`;
        PICKER_YEARS.forEach(v => years += `<option value="${v}" ${y === String(v) ? "selected" : ""}>${v}</option>`);
        return `<div class="date-selects">
            <select id="dsd_${prefix}" onchange="onDatePartChange('${prefix}')">${days}</select>
            <select id="dsm_${prefix}" onchange="onDatePartChange('${prefix}')">${months}</select>
            <select id="dsy_${prefix}" onchange="onDatePartChange('${prefix}')">${years}</select>
        </div>`;
    }
    function onDatePartChange(prefix) {
        const d = document.getElementById("dsd_" + prefix).value;
        const m = document.getElementById("dsm_" + prefix).value;
        const y = document.getElementById("dsy_" + prefix).value;
        if (!d || !m || !y) return;
        if (prefix !== "date_new") markManualDate(prefix);
        onInputSave(prefix, `${y}-${m}-${d}`);
    }
    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }
    function getCompBadge(compName) {
        switch(compName) {
            case "ליגת האלופות": return `<span class="comp-badge comp-ucl">צ'מפיונס</span>`;
            case "גביע המלך": return `<span class="comp-badge comp-copa">גביע המלך</span>`;
            case "סופר קופה ספרדי": return `<span class="comp-badge comp-supercopa">סופר קופה</span>`;
            case "סופר קופה אירופי": return `<span class="comp-badge comp-supercup_eu">סופר קופה אירופי</span>`;
            default: return `<span class="comp-badge comp-la_liga">לה ליגה</span>`;
        }
    }
    /* ניקוד מדורג: 3 נק׳ על תוצאה מדויקת (או סימון ידני ב״מי צדק״), 1 נק׳ על כיוון נכון (ניצחון/תיקו/הפסד) */
    function scoreSign(s) { const p = s.split("-").map(Number); return Math.sign(p[0] - p[1]); }
    function predictionPoints(actual, guess) { return actual === guess ? 3 : scoreSign(actual) === scoreSign(guess) ? 1 : 0; }
    function pointsFor(m, player) {
        const actual = liveActualFor(m);
        if (!getMatchStatus(m).isLive && (currentData[`winners_${m.id}`] || []).includes(player)) return 3;
        if (!actual) return 0;
        const g = normalizeScoreStr(currentData[`pred_${m.id}_${player}`]);
        if (!g) return 0;
        if (g === actual) return 3;
        return scoreSign(g) === scoreSign(actual) ? 1 : 0;
    }
    function ptsClass(m, p) {
        const status = getMatchStatus(m);
        const liveActual = status.isLive ? liveActualFor(m) : normalizeScoreStr(currentData[`actual_${m.id}`]);
        const done = liveActual && (status.isEnded || status.isLive);
        if (!done || !normalizeScoreStr(currentData[`pred_${m.id}_${p}`])) return ["", ""];
        const v = status.isLive ? predictionPoints(liveActual, normalizeScoreStr(currentData[`pred_${m.id}_${p}`])) : pointsFor(m,p);
        return [v === 3 ? "pts-3" : v === 1 ? "pts-1" : "pts-0", v ? `<b class="pts-chip">+${v}</b>` : ""];
    }
    function mcWeekday(d) { try { const x = new Date(`${d}T12:00`); return isNaN(x) ? "" : x.toLocaleDateString("he-IL", { weekday: "long" }); } catch (e) { return ""; } }
    function computeScores() {
        const scores = {};
        activePlayersList.forEach(p => scores[p] = 0);
        currentMatches.forEach(m => {
            if (!m || getMatchStatus(m).isLive || !normalizeScoreStr(currentData[`actual_${m.id}`]) && !(currentData[`winners_${m.id}`] || []).length) return;
            activePlayersList.forEach(p => scores[p] += pointsFor(m, p));
        });
        return scores;
    }
    /* ---- סטטיסטיקות עונה + תגים ---- */
    function seasonStats() {
        const done = currentMatches.filter(m => m && normalizeScoreStr(currentData[`actual_${m.id}`]) && getMatchStatus(m).isEnded);
        return activePlayersList.map(p => {
            let exact = 0, dir = 0, played = 0, streak = 0, best = 0, dirRun = 0, bestDir = 0, clasico = false;
            const form = [];
            done.forEach(m => {
                const pts = pointsFor(m, p), g = normalizeScoreStr(currentData[`pred_${m.id}_${p}`]);
                if (g) played++;
                if (pts === 3) { exact++; streak++; if (m.isClasico) clasico = true; } else streak = 0;
                if (pts >= 1) { if (pts === 1) dir++; dirRun++; } else dirRun = 0;
                best = Math.max(best, streak); bestDir = Math.max(bestDir, dirRun);
                form.push(pts);
            });
            const badges = [];
            if (best >= 2) badges.push(["🎯", "צלף — " + best + " מדויקים ברצף"]);
            if (bestDir >= 5) badges.push(["📈", "עקבי — " + bestDir + " משחקים ברצף עם נקודות"]);
            if (clasico) badges.push(["🔥", "מלך הקלאסיקו — צדק בקלאסיקו"]);
            if (played && played === done.length && done.length >= 3) badges.push(["🧱", "לא מפספס — ניחש בכל המשחקים"]);
            if (exact >= 5) badges.push(["💎", "נביא — " + exact + " תוצאות מדויקות"]);
            const total = exact * 3 + dir;
            return { p, exact, dir, played, total, acc: done.length ? Math.round(((exact + dir) / done.length) * 100) : 0, games: done.length, streak, form: form.slice(-5), badges };
        }).sort((a, b) => b.total - a.total || b.exact - a.exact);
    }
    let statsOpen = false;
    function toggleStats() { statsOpen = !statsOpen; renderUI(); }
    function statsHTML() {
        const rows = seasonStats();
        if (!rows.length) return "";
        const leader = rows[0] && rows[0].total > 0 ? rows[0].p : "";
        const formDots = f => f.map(v => `<i class="st-dot ${v === 3 ? 'st-3' : v === 1 ? 'st-1' : 'st-0'}" title="${v} נק׳"></i>`).join("");
        return `<div class="stats-card">
            <button class="stats-toggle" onclick="toggleStats()">📊 טבלת עונה וסטטיסטיקות ${statsOpen ? "▲" : "▼"}</button>
            ${statsOpen ? `<div class="stats-scroll"><table class="stats-table"><thead><tr><th>#</th><th>מנחש</th><th>נק׳</th><th>🎯 מדויק</th><th>↗ כיוון</th><th>% הצלחה</th><th>כושר</th></tr></thead><tbody>
            ${rows.map((r, i) => `<tr><td class="st-rank">${i + 1}</td><td class="st-name">${r.p}${r.p === leader ? " 👑" : ""}<div class="st-badges">${r.badges.map(b => `<span title="${b[1]}">${b[0]}</span>`).join("")}</div></td><td class="st-pts">${r.total}</td><td>${r.exact}</td><td>${r.dir}</td><td><div class="st-bar"><span style="width:${r.acc}%"></span></div>${r.acc}%<div class="st-sub">${r.exact + r.dir}/${r.games} · ניחש ${r.played}</div></td><td class="st-form">${formDots(r.form)}</td></tr>`).join("")}
            </tbody></table></div>
            <div class="stats-legend">ניקוד: 3 נק׳ על תוצאה מדויקת · 1 נק׳ על כיוון נכון (ניצחון / תיקו / הפסד). % הצלחה = משחקים שבהם קיבל נקודות מתוך כל המשחקים שהסתיימו (משחק בלי ניחוש נחשב פספוס). כושר = 5 המשחקים האחרונים. תגים: 🎯 צלף · 📈 עקבי · 🔥 מלך הקלאסיקו · 🧱 לא מפספס · 💎 נביא</div>` : ""}
        </div>`;
    }

    /* ---- גיבוי וייצוא ---- */
    function downloadFile(name, text, mime) {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    }
    function exportStamp() { return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }); }

    function exportResultsCSV() {
        const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
        /* תוצאות בפורמט ="2-1" כדי שאקסל לא יהפוך אותן לתאריך */
        const sc = v => { const n = normalizeScoreStr(v); return n ? `"=""${n}"""` : q(""); };
        const header = ["תאריך", "שעה", "מסגרת", "משחק (ריאל משמאל)", "תוצאה (ריאל-יריבה)", ...activePlayersList.map(p => "ניחוש " + p), "מי צדק"].map(q).join(",");

            const time = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "");
            const actual = currentData[`actual_${m.id}`] !== undefined ? currentData[`actual_${m.id}`] : (m.defaultActual || "");
            const t = splitMatchTeams(m);
            const winners = (currentData[`winners_${m.id}`] || []).join(" / ");
            return [q(date), q(time), q(m.comp || ""), q(t ? `${t[0]} - ${t[1]}` : m.match), sc(actual),
                ...activePlayersList.map(p => sc(currentData[`pred_${m.id}_${p}`])), q(winners)].join(",");
        });
        downloadFile(`blancos-results-${exportStamp()}.csv`, "\uFEFF" + [header, ...rows].join("\r\n"), "text/csv;charset=utf-8");

    function resetAllData() {
        if (confirm("איפוס כל הנתונים?")) db.ref('league_data').remove();
    }

    /* ============================================================
       LINEUPS — server function (API key stays server-side)
       ============================================================ */
    const LINEUP_WINDOW_MS = 90 * 60 * 1000;
    const lineupCache = {};
    const pitchUpdates = new Map();
    let lineupOpenMatchId = "";
    let lineupPollTimer = null;
    let lastLineupAutoCheck = 0;

    /* ---- תמונות שחקנים ---- */
    const portrait = id => /^[1-9]\d*$/.test(String(id)) ? "https://images.fotmob.com/image_resources/playerimages/"+id+".png" : "";
    function htmlText(v) { return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    const FOTMOB_DAY_URL = "https://www.fotmob.com/api/data/matches?date=";
    const shiftDay = (day, diff) => {
        const t = Date.parse(`${day}T00:00:00Z`);
        return isNaN(t) ? "" : new Date(t + diff * 86400000).toISOString().slice(0, 10);
    };
    // מזהה המשחק אצל ספק ההרכבים — לפי המזהה הידוע, ואם אין כזה, לפי התאריך
    async function fotmobMatchId(matchId, dateStr) {
        if (matchId) return matchId;
        const day = String(dateStr || "").slice(0, 10);
        if (day.length !== 10) return null;
        for (const d of [day, shiftDay(day, -1), shiftDay(day, 1)]) {
            if (!d) continue;
            try {
                const res = await fetch(FOTMOB_DAY_URL + d.replace(/-/g, ""), { cache: "no-store" });
                if (!res.ok) continue;
                const json = await res.json();
                for (const league of json.leagues || []) {
                    for (const mm of league.matches || []) {
                        if (mm?.home?.id === 8633 || mm?.away?.id === 8633) return mm.id;
                    }
                }
            } catch (e) { /* ממשיכים ליום הבא */ }
        }
        return null;
    }
    function matchKickoff(m) {
        const official = !currentData[`manualDate_${m.id}`] && findFotmobFixture(m)?.kickoff;
        if (official && Number.isFinite(Date.parse(official))) return Date.parse(official);
        const dateStr = currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
        const timeStr = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "22:00");
        if (!dateStr) return null;
        const wall = Date.parse(`${dateStr}T${timeStr}Z`);
        if (!Number.isFinite(wall)) return null;
        const offset = new Intl.DateTimeFormat("en", {timeZone:"Asia/Jerusalem",timeZoneName:"shortOffset"}).formatToParts(wall).find(p=>p.type==="timeZoneName");
        const t = wall - Number(offset.value.replace("GMT",""))*3600000;
        return isNaN(t) ? null : t;
    }
    function matchDateStr(m) {
        return currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
    }
    function lineupLockText(m) {
        const ko = matchKickoff(m);
        if (!ko) return "";
        const mins = Math.max(1, Math.ceil((ko - LINEUP_WINDOW_MS - Date.now()) / 60000));
        if (mins >= 60) return `עוד ${Math.floor(mins / 60)} ש׳ ${mins % 60} דק׳`;
        return `עוד ${mins} דק׳`;
    }
    async function readFootballJSON(url) {
        const response = await fetch(url,{cache:"no-store", signal:AbortSignal.timeout(10000)});
        if (!response.ok) throw Error("אין חיבור לספק");
        return response.json();
    }
    function archivedLineupMatch(m,f) {
        const pair=splitMatchTeams(m)?.map(canonicalTeam).sort().join("|");
        const day=Date.parse(matchDateStr(m));
        const matches=ratingsHistory.filter(h=>h.teams.map(t=>canonicalTeam(t.name)).sort().join("|")===pair &&
            (f?.id ? String(f.id)===h.id : Math.abs(Date.parse(h.kickoff.slice(0,10))-day)<=86400000));
        return matches.length===1 ? matches[0] : null;
    }
    async function officialLineup(m, f) {
        const archived=archivedLineupMatch(m,f);
        if (archived?.lineup && (!f || f.finished)) return archived.lineup;
        if (f?.id) {
            try {
                const match=await MatchRatings.details(f);
                const teams=MatchRatings.officialTeams(match,f);
                if (teams) return teams;
                if (match.content?.lineup?.lineupType && match.content.lineup.lineupType!=="standard" && !f.finished) return {available:false};
            } catch { /* Try the secondary provider with the same identity checks. */ }
        }
        const data=await callFootballAPI({date:matchDateStr(m),matchId:f?.id || archived?.id});
        if (!data.available || data.predicted || data.confirmed===false) return {available:false};
        const sides=[data.home,data.away].filter(Boolean);
        const expectedId=f?.id || archived?.id;
        const requested=splitMatchTeams(m)?.map(canonicalTeam).sort().join("|");
        const actual=sides.map(t=>canonicalTeam(t.name)).sort().join("|");
        const sameDay=Number.isFinite(Date.parse(data.kickoff)) &&
            new Date(data.kickoff).toLocaleDateString('en-CA',{timeZone:'Asia/Jerusalem'})===matchDateStr(m);
        if (expectedId ? String(expectedId)!==String(data.matchId) : !sameDay || !requested || actual!==requested)
            return {available:false,reason:"no_fixture"};
        if(expectedId && sides.length===2 && actual!==requested) return {available:false,reason:"no_fixture"};
        const status={strStatus:String(data.status || '')};
        if(data.confirmed!==true && data.lineupType!=="standard" && !isEventFinished(status) && !isEventLive(status))
            return {available:false};
        return sides.some(t=>t.startXI?.length || t.lines?.some(l=>l.players?.length)) ? data : {available:false};
    }
    async function loadLineups(m) {
        if (!matchKickoff(m) || matchKickoff(m)-Date.now()>LINEUP_WINDOW_MS || lineupCache[m.id]?.loading) return;
        lineupCache[m.id] = { ...(lineupCache[m.id] || {}), loading: true };
        if (lineupOpenMatchId === m.id) renderLineupBody(m);
        try {
            // the fixture id is already known on this side — the server doesn't have
            // to guess the game from a date, which is what kept it too slow
            const f = findFotmobFixture(m);
            const data = await officialLineup(m,f);
            const before=lineupCache[m.id]?.data;
            const signature=t=>(t?.startXI || (t?.lines || []).flatMap(l=>l.players || [])).map(p=>p.fotmobId || p.name).join("|");
            if (data.available && before?.available && [ "home","away" ].some(side=>signature(before[side])!==signature(data[side]))) {
                matchAlert("lineup", "ההרכב הרשמי עודכן", m.match, ()=>openLineup(m.id));
            }
            lineupCache[m.id] = { fetchedAt: Date.now(), data:data.available ? data : before?.available ? before : data, loading:false };

        } catch (e) {
            lineupCache[m.id] = { ...lineupCache[m.id], error: (e && e.message) || "שגיאה", loading: false };
        }
        if (lineupOpenMatchId === m.id) renderLineupBody(m);
    }
    function shortName(name) {
        const str = String(name || "").trim();
        const parts = str.split(/\s+/);
        if (parts.length < 2 || str.length <= 12) return str;
        return `${parts[0][0]}. ${parts[parts.length - 1]}`;
    }

    function lineupTeamHTML(t) {
        if (!t) return "";
        const lines = (t.lines || []).map(l => `<div class="pitch-line">${(l.players || []).map(playerChipHTML).join("")}</div>`).join("");
        const subs = (t.subs || []).map(p => `<div class="lineup-player"><span class="lineup-num">${p.number || "-"}</span><span>${p.name}${p.entered ? " ↗" : ""}</span>${p.rating ? `<span class="sub-rating">⭐ ${p.rating}</span>` : ""}</div>`).join("");
        return `<div class="lineup-team-card">
            <div class="lineup-team-head">
                ${t.logo ? `<img class="lineup-team-logo" src="${t.logo}" alt="" onerror="this.style.display='none'">` : ""}

                ${t.formation ? `<span class="lineup-formation">${t.formation}</span>` : ""}
            </div>
            <div class="pitch">${lines}</div>
            <details class="subs-acc"><summary class="lineup-label sub-toggle">מחליפים (${(t.subs || []).length})</summary>
            ${subs || '<div class="lineup-player">—</div>'}</details>
        </div>`;
    }
    /* התשובה עשויה להגיע בשני מבנים: lines (השרת הנוכחי) או startXI (גרסה קודמת) —
       כך ההרכב מוצג תמיד, גם לפני פרסום מחדש של השרת. */
    function normalizeLineupTeam(t, m) {
        const matchId=lineupCache[m.id]?.data?.matchId;
        return onFieldTeam(t,matchId,pitchUpdates.get(m.id));
    }
    function onFieldTeam(t,matchId,changes) {
        if (!t) return null;
        let lines = (t.lines || []).filter(l => l && (l.players || []).length);
        if (!lines.length && Array.isArray(t.startXI) && t.startXI.length) {
            const players = t.startXI;
            const sizes = String(t.formation || "").split("-").map(Number).filter(n => n > 0);
            if (sizes.length && sizes.reduce((a, b) => a + b, 0) === players.length - 1) {
                lines = [{ role: "GK", players: [players[0]] }];
                let idx = 1;
                sizes.forEach(n => { lines.push({ role: "MID", players: players.slice(idx, idx + n) }); idx += n; });
            } else {
                lines = [{ role: "XI", players }];
            }
        }
        const snapshot=MatchRatings.current(matchId);
        const updates=String(changes?.matchId)===String(matchId) ? changes : null;
        function currentPlayer(starter) {
            if (!updates) return {...starter,rating:MatchRatings.playerScore(snapshot,starter.fotmobId)};
            let p = starter, incoming = false;
            for (const [on,off,minute] of updates.swaps) {

        const expanded = [...body.querySelectorAll(".subs-acc")].map(el => el.open);

    function openLineup(matchId) {

<script>

  var timelineFailures = new Set(), goalHistory = new Map();

  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---- 1. סרגל "הניחושים נסגרים בעוד…" ---- */
  function nextDeadline() {

      "<div class='xa-sub'>" + (miss.length ? "עוד לא ניחשו: " + miss.map(esc).join(", ") : "✅ כולם כבר ניחשו") + "</div></div>";

  }

  /* ---- 2. התראה "ההרכב יצא" ---- */

      if (!m) return;
      var ko = matchKickoff(m); if (!ko) return;
      if (ko - now > LINEUP_WINDOW_MS || now - ko > 3 * 3600000) return;
      var c = lineupCache[m.id], key = "lineup_" + m.id;
      if (!(c && c.data && c.data.available) || notifiedPhases.has(key)) return;
      notifiedPhases.add(key); saveNotifiedPhases();
      BlancosNotify.show({ kind: "lineup", tag: key, title: "📋 ההרכב יצא!", body: realFirstLabel(m) + " — לחץ על ״הרכבים״ כדי לראות מי פותח" });
    });
  }

  /* ---- 3. פס משחק חי: ניחושי כולם (ירוק = צודק כרגע) + ציר זמן ---- */
  function liveMatches() { return currentMatches.filter(function (m) { return m && getMatchStatus(m).isLive; }); }
  function eventIcon(e) {
    var t = String(e.type || "").toLowerCase(), c = String(e.card || e.cardType || "").toLowerCase();
    if (t.includes("var")) return "📺";
    if (t === "goal") return "⚽";
    if (t.indexOf("card") >= 0) return c.indexOf("red") >= 0 ? "🟥" : "🟨";
    if (t.indexOf("sub") >= 0) return "🔄";
    if (t.indexOf("var") >= 0) return "📺";
    return "";
  }
  function chanceHTML(m,actual) {
    if (!actual) return "";
    const [a,b]=actual.split("-").map(Number);
    return "<details><summary>מה חסר לכל ניחוש?</summary>"+activePlayersList.map(p=>{
      const g=guess(m,p); if (!g) return "";
      const [x,y]=g.split("-").map(Number), goals=x-a, opp=y-b;
      const text=goals<0 || opp<0 ? "פגיעה מדויקת כבר לא אפשרית" : goals+opp===0 ? "מדויק כרגע" :
        [goals ? goals+" לריאל" : "",opp ? opp+" ליריבה" : ""].filter(Boolean).join(" ו־")+" עד לפגיעה מדויקת";
      return "<p>"+esc(p)+" · "+esc(text)+"</p>";
    }).join("")+"</details>";
  }
  function chipsHTML(m,actual) {
    return "<div class='xa-chips'>" + activePlayersList.map(p => {
      const g = guess(m,p), pts = g && actual ? predictionPoints(actual,g) : null;
      const cls = pts === 3 ? "xa-ok" : pts === 1 ? "xa-direction" : pts === 0 ? "xa-miss" : "";
      return "<span class='xa-chip "+cls+"'>"+esc(p)+" <i>"+esc(g || "—")+"</i>"+(pts === null ? "" : " · "+pts)+"</span>";
    }).join("") + "</div>";
  }
  const lastDecisiveGoal=new Map();
  window.matchFinalPanel=m=>{
    const last=lastDecisiveGoal.get(m.id),final=liveActualFor(m);
    if (!last || last.after!==final) return "";
    const gained=activePlayersList.filter(p=>guess(m,p) && predictionPoints(last.before,guess(m,p))<predictionPoints(final,guess(m,p)));
    return "<p class='xa-note'>השער האחרון · "+esc(last.minute)+"′ · "+esc(last.scorer)+" · "+esc(final)+(gained.length?" · הרוויחו נקודות: "+gained.map(esc).join(", "):"")+"</p>";
  };
  window.matchLivePanel = m => chipsHTML(m,liveActualFor(m)) + '<details class="match-events"><summary>ציר הזמן של המשחק</summary>' + eventsHTML(m.id) + "</details>";
  function eventsHTML(id) {
    var list = evCache[id];
    if (!list && timelineFailures.has(id)) return "ציר הזמן אינו זמין — מנסה שוב";
    if (list === undefined) return "<div class='xa-ev'><div>⏳ טוען ציר זמן…</div></div>";
    if (!list.length) return "<div class='xa-ev'><div>עדיין אין אירועים (גולים, כרטיסים, חילופים) — מתעדכן אוטומטית</div></div>";
    return "<div class='xa-ev'>" + list.map(function (e) { return "<div><span class='xa-min'>" + esc(e.min) + "</span><span>" + e.icon + " " + esc(e.text) + "</span></div>"; }).join("") + "</div>";
  }

  document.addEventListener("visibilitychange",()=>{
    if (!ready()) return;
    if (document.hidden) {
      for (const m of liveMatches()) if (evCache[m.id]) returning.set(m.id,new Set(evCache[m.id].map(e=>e.id)));
    } else {
      for (const m of currentMatches) if (returning.has(m.id)) loadEvents(m);
    }
  });
  function loadEvents(m) {
    if (evBusy[m.id]) return; evBusy[m.id] = true;
    var f = null; try { f = findFotmobFixture(m); } catch (e) {}
    Promise.resolve(fotmobMatchId(f && f.id ? f.id : null, matchDateStr(m))).then(function (fid) {
      if (!fid) throw new Error("no id");
      return MatchRatings.details(f || {id:fid});
    }).then(function (j) {
      const pitch=acceptLiveField(j,f || {id:j.general.matchId},m);
      var ev = j && j.content && j.content.matchFacts && j.content.matchFacts.events && j.content.matchFacts.events.events;
      if (!Array.isArray(ev) || (f?.id && String(j.general?.matchId)!==String(f.id))) throw new Error("missing events");
      timelineFailures.delete(m.id);
      pitchUpdates.set(m.id,pitch.changes);
      const previousGoals = goalHistory.get(m.id);
      const goals = new Set();
      for (const e of ev) {
        if (e.type !== "Goal" || !Array.isArray(e.newScore) || e.isPenaltyShootoutEvent) continue;
        const key = e.eventId ?? e.reactKey;
        goals.add(key);
        const [h,a] = e.newScore;
        const score=Number(j.general?.homeTeam?.id)===8633 ? h+"-"+a : a+"-"+h;
        const alert=document.getElementById("matchAlert");
        const awaitingDetails=!previousGoals && !alert.hidden && alert.dataset.goal==="goal_"+m.id+"_"+score;
        if ((awaitingDetails || previousGoals && !previousGoals.has(key)) && !returning.has(m.id) && getMatchStatus(m).isLive)
          sendGoalNotice(m,score,"דקה "+(e.timeStr ?? e.time)+(e.overloadTime?"+"+e.overloadTime:"")+" · "+(e.nameStr || e.player?.name || "שער"));
      }
      goalHistory.set(m.id,goals);
      const last=ev.filter(e=>e.type==="Goal" && Array.isArray(e.newScore) && !e.isPenaltyShootoutEvent).sort((a,b)=>a.time-b.time || (a.overloadTime||0)-(b.overloadTime||0)).pop();
      lastDecisiveGoal.delete(m.id);
      if(last && last.homeScore!=null && last.awayScore!=null) {
        const orient=(a,b)=>Number(j.general?.homeTeam?.id)===8633?a+"-"+b:b+"-"+a;
        lastDecisiveGoal.set(m.id,{before:orient(last.homeScore,last.awayScore),after:orient(...last.newScore),minute:last.timeStr ?? last.time,scorer:last.nameStr || last.player?.name || ""});
      }
      evCache[m.id] = (Array.isArray(ev) ? ev : []).map(function (e) {
        var icon = eventIcon(e); if (!icon) return null;
        var name = e.nameStr || (e.player && e.player.name) || e.fullName || "";
        var min = (e.timeStr != null ? e.timeStr : e.time);
        if (e.overloadTime) min = min + "+" + e.overloadTime;
        var text = name;
        if (icon === "🔄" && e.swap && e.swap[0] && e.swap[1]) text = (e.swap[0].name || "") + " ⟵ " + (e.swap[1].name || "");
        if (icon === "⚽" && e.homeScore != null && e.awayScore != null) {
          var [_a,_b] = Array.isArray(e.newScore) ? e.newScore : [e.homeScore,e.awayScore];
          if (Number(j.general?.awayTeam?.id) === 8633 || (!j.general?.awayTeam && f?.away?.id === 8633)) { var _t = _a; _a = _b; _b = _t; }
          text += " (" + _a + "-" + _b + ")";
        }
        const team=(e.isHome===true ? j.general?.homeTeam : e.isHome===false ? j.general?.awayTeam : null)?.name;
        if (icon==="⚽" && e.assistStr) text+=" · בישול: "+e.assistStr;
        return {id:e.eventId ?? e.reactKey ?? [e.type,min,e.isHome,name].join("/"), min: min + "′", icon: icon, text: (team ? team+" · " : "")+text };
      }).filter(Boolean).reverse();
      if (!document.hidden && returning.has(m.id)) {
        const added=evCache[m.id].filter(e=>!returning.get(m.id).has(e.id));
        returning.delete(m.id);
        if (added.length) matchAlert("recap","מאז שיצאת · "+added.length+" אירועים",added.slice(0,3).reverse().map(e=>e.min+" "+e.icon+" "+e.text).join(" · "));
      }
    }).catch(function () { timelineFailures.add(m.id); }).then(function () { evBusy[m.id] = false; renderLive(true); if (lineupOpenMatchId === m.id) renderLineupBody(m); });
  }
  /* תצוגה מקדימה של הפס שמתחת לכרטיס הלייב (ניחושי כולם) — באותו מבנה כמו במשחק אמיתי, עם ניחושים לדוגמה */
  function renderLive(force) {
    var el = slot("xaLive", document.getElementById("liveMatchWidget"), document.getElementById("playersBar")); if (!el) return;
    el.className = "xa-live";
    var ms = liveMatches();
    var html = ms.map(function (m) {
      if (evCache[m.id] === undefined && !timelineFailures.has(m.id)) loadEvents(m);
      var actual = liveActualFor(m);
      var chips = chipsHTML(m,actual);
      var right = actual ? activePlayersList.filter(function (p) { return guess(m, p) === actual; }) : [];
      var note = actual ? (right.length ? "צודקים כרגע: " + right.map(esc).join(", ") : "אף אחד לא צודק כרגע") : "";
      const parts=actual && actual.split("-").map(Number);
      const scenario=(score)=>esc(score)+" · "+esc(exactNow(m,score));
      const next=parts ? "<details><summary>מה יקרה בשער הבא?</summary><p>שער לריאל: "+scenario((parts[0]+1)+"-"+parts[1])+"</p><p>שער ליריבה: "+scenario(parts[0]+"-"+(parts[1]+1))+"</p></details>" : "";
      var open = !!openEvents[m.id];
      return "<div class='xa-card'><div class='xa-h'><span>📊 מה כולם ניחשו — " + esc(m.match) + "</span><span class='xa-score'>" + (actual || "") + "</span></div>" +
        chips + next + chanceHTML(m,actual) + "<div class='xa-note'>ניקוד זמני · " + note + " · ריאל משמאל, יריבה מימין</div>" +
        "<button class='xa-btn' data-ev='" + esc(m.id) + "'>" + (open ? "🔽 הסתר ציר זמן" : "📜 ציר זמן של המשחק") + "</button>" + (open ? eventsHTML(m.id) : "") + "</div>";
    }).join("");
    if (!force && html === lastLive) return;
    const expanded=[...el.querySelectorAll("details[open]")].map(d=>d.dataset.key);
    lastLive = html; el.innerHTML = html;
    el.querySelectorAll(".xa-card").forEach((card,i)=>card.querySelectorAll("details").forEach((d,k)=>{
      d.dataset.key=ms[i].id+"/"+k; d.open=expanded.includes(d.dataset.key);
    }));
    Array.prototype.forEach.call(el.querySelectorAll("[data-ev]"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-ev"); openEvents[id] = !openEvents[id];
        if (openEvents[id]) { var m = currentMatches.filter(function (x) { return x && String(x.id) === id; })[0]; if (m) loadEvents(m); }
        renderLive(true);
      });
    });
  }
  window.xaLoadEvents = function (m) { loadEvents(m); };
  function refreshOpenEvents() {
    if (document.hidden) return; var seen = {};
    liveMatches().forEach(function (m) { seen[m.id] = 1; loadEvents(m); });
    if (typeof lineupOpenMatchId !== "undefined" && lineupOpenMatchId && !seen[lineupOpenMatchId]) {
      var mm = currentMatches.filter(function (x) { return x && x.id === lineupOpenMatchId; })[0];
      if (mm && getMatchStatus(mm).isEnded && (!evCache[mm.id] || timelineFailures.has(mm.id))) loadEvents(mm);
    }
  }

  function tick() { try { if (!ready()) return; ensureStyle(); renderBar(); renderLive(false); } catch (e) { /* לא מפילים את האתר */ } }

  window.xaRefresh = function () { tick(); };
  setInterval(slow, 30000);
  setInterval(function () { try { if (ready()) refreshOpenEvents(); } catch (e) {} }, 15000);
  setTimeout(slow, 4000);
})();
</script>
<script>
/* זרימת המשחק: הרכבים פורסמו -> הפופאפ נפתח במצב "המתנה לשריקה" -> מעבר אוטומטי לעדכונים חיים */
(function () {
  function k(m, ph) { return "flow_" + ph + "_" + m.id; }
  function seen(key) { try { return localStorage.getItem(key) === "1"; } catch (e) { return false; } }
  function mark(key) { try { localStorage.setItem(key, "1"); } catch (e) {} }
  var evLoadedFor = "";
  function activeMatch() {
    var now = Date.now(), best = null;
    currentMatches.forEach(function (m) {
      if (!m) return; var ko = matchKickoff(m); if (!ko) return;
      if (now < ko - LINEUP_WINDOW_MS || now > ko + 3 * 3600000 || getMatchStatus(m).isEnded) return;
      if (!best || ko < best.ko) best = { m: m, ko: ko };
    });
    return best && best.m;
  }
  function tick() {
    try {
      if (typeof currentMatches === "undefined" || !currentMatches.length || typeof lineupCache === "undefined") return;
      var btn = document.getElementById("hnmLineupBtn"), m = activeMatch();
      if (!m) { if (btn) btn.style.display = "none"; return; }
      var c = lineupCache[m.id], has = !!(c && c.data && c.data.available);
      if (btn) btn.style.display = has ? "" : "none";
      if (!has || document.hidden) return;
      var st = getMatchStatus(m), key = k(m, st.isLive ? "live" : "lineup");
      if (!seen(key)) { mark(key); if (!lineupOpenMatchId && !st.isLive) matchAlert("lineup","ההרכב הרשמי פורסם",m.match,()=>openLineup(m.id)); }
      if (lineupOpenMatchId === m.id) {
        renderLineupBody(m);
        if ((st.isLive || st.isEnded) && evLoadedFor !== m.id && window.xaLoadEvents) { evLoadedFor = m.id; window.xaLoadEvents(m); }
      } else evLoadedFor = "";
    } catch (e) {}
  }
  setInterval(tick, 3000);
})();
</script>
<script type="application/json" id="deployment-sources">{"api/match-details.js":"export default async function handler(req, res) {\n  const {matchId, fixtures} = req.query;\n  if (req.method !== 'GET') return res.status(405).end();\n  if (fixtures !== '1' && !/^\\d{1,12}$/.test(String(matchId))) return res.status(400).end();\n  const path = fixtures === '1' ? 'teams?id=8633' : 'matchDetails?matchId='+matchId;\n  try {\n    const response = await fetch('https://www.fotmob.com/api/data/'+path, {signal: AbortSignal.timeout(8500)});\n    if (!response.ok) throw Error('upstream');\n    const json = await response.json();\n    res.setHeader('Cache-Control','public, s-maxage=8');\n    if (fixtures !== '1') return res.json(json);\n    return res.json({fixtures: json.fixtures.allFixtures.fixtures.filter(f => !f.status.cancelled).map(f => {\n      const {started,finished,utcTime: kickoff,liveTime} = f.status;\n      const [real,opp] = f.home.id === 8633 ? [f.home,f.away] : [f.away,f.home];\n      return {id:f.id,home:f.home,away:f.away,kickoff,date:kickoff?.slice(0,10),started,finished,\n        minute:liveTime?.short || (started && !finished ? f.status.reason?.short : undefined),league:f.tournament?.name,realGoals:real.score,oppGoals:opp.score};\n    })});\n  } catch {return res.status(502).json({error:'Football feed unavailable'});}\n}\n","api/push-tick.js":"// Invoke from a trusted scheduler even when no subscriber has the page open.\nexport default async function handler(req,res) {\n  res.setHeader('Cache-Control','no-store');\n  if (!process.env.CRON_SECRET || req.headers.authorization !== 'Bearer '+process.env.CRON_SECRET)\n    return res.status(401).end();\n  try {\n    const r = await fetch('https://workflows.zite.com/public/8wsdtq9hgp/api/pushTick', {\n      method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(9000),\n      body:JSON.stringify({mode:'live',inputs:{reason:'scheduled'}})\n    });\n    if (!r.ok) throw Error();\n    const json = await r.json();\n    if ((json.output || json.result || json).ok === false) throw Error();\n    return res.status(204).end();\n  } catch { return res.status(502).end(); }\n}\n","sw.js":"self.addEventListener('push', event => {\n  let message = {};\n  try { message = event.data.json() || {}; } catch { message.body = event.data?.text(); }\n  const n = message.notification || message;\n  event.waitUntil(self.registration.showNotification(n.title || 'ניחושי הבלאנקוס', {\n    body: n.body || '', tag: n.tag || message.tag, icon:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAAACXBIWXMAAAAAAAAAAQCEeRdzAAAAAXNSR0IB2cksfwAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABGdBTUEAALGPC/xhBQAAEABJREFUeJztvQeYZNd1HnherlzVoTrnnpwHM8BwkANJgBEiKYoCKX1rWZJt7cqk1+JK3vVakv3Rshxkm7LkXYmiRFlcUqQpZhIMCEQOg5nBREzomemcqror18vv7Tn3vuoADMDugRikej/QwHTNqxfuPf/J9z4BQoRoYsg/6RsIEeIniZAAIZoaIQFCNDVCAoRoaoQECNHUCAkQoqkREiBEUyMkQIimRkiAEE2NkAAhmhohAUI0NUIChGhqhAQI0dQICRCiqRESIERTIyRAiKZGSIAQTY2QACGaGiEBQjQ1QgKEaGqEBAjR1AgJEKKpERIgRFMjJECIpkZIgBBNjZAAIZoaIQFCNDVCAoRoaoQECNHUCAkQoqkREiBEUyMkQIimRkiAEE2NkAAhmhohAUI0NUIChGhqhAQI0dQICRCiqRESIERTIyRAiKZGSIAQTY2QACGaGiEBQjQ1QgKEaGqEBAjR1AgJEKKpERIgRFMjJECIpkZIgBBNjZAAIZoaIQFCNDVCAoRoaoQECNHUCAkQoqkREiBEUyMkQIimRkiAEE2NkAAhmhohAUI0NUIChGhqhAQI0dQICRCiqRESIERTIyRAiKbGDRBAxB/vb/1GQoT4SWBTBMikRxJvv+19H7ONknVx6vy3xibPn7fM4o/q3kKE2BDi0S65v2t0+1Bvz866VVp85qVHn3Q9d0Pf3RQBRvoH7rzvUOsnUi1JWMi1/87E1O2PXJu3vnJm7MQjk3PHZ2yzdkMPECLEZiGICowMHeq9efuBjwx2J97T0xk5mEnJ8YqRHh+fufaWyZnLCxs5z6YIIHiSJipFuOu9t0NluRCfuTz14OS0/eCdB++em5q/4wfjM4Xvn5t4/qnxqfExy1q+sScLEeJ1oUJrW19y1/DtR3cNDb5nuF94sH/Q6R8e7YQtO4dAX74K3/pqPgGCqm30jJsigKzIriiIICi90LfrbujdXoS9lQlYuna5e+7a+ENLhcRD4zPvKswtxR47d+XsZy6Mn35qcupCyXPtzT9riBABVCUBWwZ2Dx/Ye/cvbOlL/2x3travu9uEkW2DMLrvDoi1bAUS5Qnj22B6ZQpQ/Y2ee1MEUGRFickSKL4HlgXgQAqExC7o37cbenfboNfmYM/cxZaJy1c+sGf71vfnl/ZcGJ+rffnx55/488vXXrhq29Zmnz1Es0JQoLN1IHNgx9G3bx8d/tm+DvHu4UEvu2NXBrpHj0BL9xYQ1U48UAHP90EUAERZBE0FkOiXDWJTB
