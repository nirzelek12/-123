<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניחושי הבלאנקוס לשנת 26/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #051613; 
            --bg-card: rgba(8, 34, 30, 0.92);
            --bg-header: linear-gradient(160deg, rgba(8, 34, 30, 0.95) 0%, rgba(5, 22, 19, 0.95) 100%);
            --bg-sub-card: rgba(11, 45, 39, 0.9); 
            --text-main: #f0ede6; 
            --text-muted: #8fa89e;
            --border-color: #123830; 
            --th-bg: #03100d; 
            --th-player: #0b2d27;
            --tr-even: rgba(7, 28, 25, 0.85); 
            --input-bg: #051613; 
            --actual-bg: #0e372f;
            --actual-text: #f0ede6; 
            --clasico-bg: #2a1a18; 
            --clasico-text: #ff8fa8;
            --gold-deep: #b3891a; 
            --gold-accent: #d4a32e; 
            --gold-bright: #f3c65d;
            --crest-navy: #051613; 
            --crest-blue: #164e42;
            --font-body: 'Assistant', sans-serif;
            --font-display: 'Heebo', 'Assistant', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --glow-gold: 0 0 24px rgba(212, 163, 46, 0.35);
            --shadow-card: 0 24px 60px -16px rgba(0, 0, 0, 0.7), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
            --shadow-soft: 0 6px 24px -8px rgba(0, 0, 0, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        body { 
            background-color: var(--bg-body); 
            background-image: linear-gradient(rgba(5, 22, 19, 0.75), rgba(5, 22, 19, 0.85)), url('רקע.JPG'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 14px 6px; 
            -webkit-tap-highlight-color: transparent; 
            min-height: 100vh; 
            position: relative; 
            overflow-x: hidden; 
            text-rendering: optimizeSpeed;
        }
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% -5%, rgba(22, 78, 66, 0.28), transparent 60%), radial-gradient(ellipse 50% 40% at 90% 100%, rgba(212, 163, 46, 0.08), transparent 55%); pointer-events: none; z-index: 0; }
        .main-container { 
            width: 100%; 
            max-width: 98vw; 
            margin: 0 auto; 
            background: rgba(8, 34, 30, 0.15);
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            padding: 18px; 
            border-radius: 24px; 
            box-shadow: var(--shadow-card); 
            border: 1px solid var(--border-color); 
            position: relative; 
            z-index: 1; 
        }     
        header { 
            background: transparent !important; 
            backdrop-filter: none !important; 
            -webkit-backdrop-filter: none !important;
            color: var(--text-main); 
            padding: 34px 22px 26px; 
            border-radius: 22px; 
            text-align: center; 
            margin-bottom: 20px; 
            position: relative; 
            box-shadow: none; 
            border: 1px solid var(--border-color); 
            overflow: hidden; 
        }
        header::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright), var(--gold-deep)); box-shadow: var(--glow-gold); }
        header::after { content: ""; position: absolute; top: -50%; left: -60%; width: 60%; height: 200%; background: linear-gradient(100deg, transparent, rgba(243, 198, 93, 0), transparent); transform: skewX(-18deg); animation: sweep 9s ease-in-out infinite; pointer-events: none; }
        @keyframes sweep { 0%, 100% { left: -60%; } 50% { left: 120%; } }
        .header-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .blancos-banner { max-width: 300px; width: 100%; max-height: 170px; object-fit: contain; margin-bottom: 4px; filter: drop-shadow(0 6px 16px rgba(5, 22, 19, 0.5)); animation: crestFloat 3s ease-in-out infinite; }
        .match-add-card { background: linear-gradient(145deg, var(--bg-sub-card), var(--bg-card)); border: 1px solid var(--border-color); border-right: 3px solid var(--gold-accent); border-radius: 16px; padding: 18px; margin-top: 15px; box-shadow: var(--shadow-soft); }
        .match-add-card .form-row-labeled { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: flex-end; width: 100%; }
        .match-add-card .field:first-child, .match-add-card .field-comp { grid-column: 1 / -1; }
        .match-add-card .field { display: flex; flex-direction: column; gap: 6px; }
        .match-add-card .field label { font-size: 0.78rem; font-weight: 800; color: var(--gold-bright); letter-spacing: 0.3px; }
        .match-add-card .field input, .match-add-card .field select { width: 100%; padding: 11px 14px; border: 1px solid var(--border-color); border-radius: 11px; font-size: 0.95rem; outline: none; background-color: var(--input-bg); color: var(--text-main); text-align: right; }
        .match-add-card .field input:focus, .match-add-card .field select:focus { border-color: var(--gold-accent); box-shadow: 0 0 0 3px rgba(212, 163, 46, 0.18); }
        .match-add-card .field input::placeholder { color: var(--text-muted); opacity: 0.6; }
        .match-add-card .action-submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--crest-blue), var(--crest-navy)); color: #ffffff; border: none; border-radius: 12px; font-weight: 800; font-size: 0.98rem; cursor: pointer; box-shadow: 0 6px 18px rgba(5, 22, 19, 0.4); transition: transform 0.2s, filter 0.2s; margin-top: 12px; }
        .match-add-card .action-submit-btn:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(5, 22, 19, 0.6); }
        @keyframes crestFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .motto-line { font-family: var(--font-display); font-size: 0.66rem; color: var(--gold-accent); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-top: 2px; margin-bottom: 14px; font-style: italic; }
        h1 { font-family: var(--font-display); font-size: 1.85rem; font-weight: 900; margin-bottom: 2px; letter-spacing: -0.3px; background: linear-gradient(180deg, #ffffff 0%, var(--gold-bright) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { font-family: var(--font-display); font-size: 0.76rem; color: var(--gold-accent); font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 3px; }
        .next-match-widget { background: var(--bg-card); border: 1px solid var(--border-color); border-right: 3px solid var(--gold-accent); border-radius: 14px; padding: 14px 18px; margin: 12px auto 0 auto; width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-soft); color: var(--text-main); position: relative; }
        .nm-header-label { font-family: var(--font-display); font-size: 0.7rem; color: var(--gold-accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1.6px; display: flex; align-items: center; gap: 6px; }
        .nm-teams-name { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.2px; }
        .nm-details-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 8px; font-weight: 700; gap: 8px; flex-wrap: wrap; }
        .nm-timer-val { font-size: 1.05rem; font-weight: 800; color: var(--gold-bright); direction: ltr; font-family: var(--font-mono); background: var(--bg-sub-card); border: 1px solid var(--border-color); padding: 3px 10px; border-radius: 8px; letter-spacing: 1px; }
        .nm-action-btn { background: linear-gradient(135deg, var(--crest-blue), var(--crest-navy)); color: #ffffff; border: none; padding: 7px 13px; border-radius: 9px; font-weight: 800; cursor: pointer; font-size: 0.78rem; box-shadow: 0 3px 10px rgba(5, 22, 19, 0.4); transition: transform 0.2s, filter 0.2s; white-space: nowrap; }
        .nm-action-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .live-match-widget { width: 100%; max-width: 620px; margin: 12px auto 0 auto; display: none; flex-direction: column; gap: 10px; }
        .live-match-card { background: radial-gradient(ellipse at 50% 0%, rgba(212,163,46,0.06), transparent 70%), #03100d; border: 1px solid #164e42; border-radius: 14px; padding: 16px 20px 14px; box-shadow: 0 0 0 4px #051613, 0 0 0 5px rgba(212, 163, 46, 0.2), 0 14px 40px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.8); color: var(--gold-bright); position: relative; animation: liveGlow 3s ease-in-out infinite; }
        @keyframes liveGlow { 0%, 100% { box-shadow: 0 0 0 4px #051613, 0 0 0 5px rgba(212, 163, 46, 0.2), 0 14px 40px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.8); } 50% { box-shadow: 0 0 0 4px #051613, 0 0 0 5px rgba(212, 163, 46, 0.4), 0 14px 50px rgba(212,163,46,0.15), inset 0 0 30px rgba(0,0,0,0.8); } }
        .lm-top-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; font-family: var(--font-mono); }
        .lm-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff2d3a; box-shadow: 0 0 8px 3px rgba(255, 45, 58, 0.9); animation: pulse 1.2s infinite; }
        .lm-live-label { font-size: 0.72rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #ff5b64; }
        .lm-comp-name { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; font-family: var(--font-body); }
        .lm-scoreline { display: flex; align-items: center; justify-content: center; gap: 16px; }
        .lm-team-name { font-family: var(--font-display); font-size: 1rem; font-weight: 800; flex: 1; text-align: center; color: #f3c65d; letter-spacing: 0.5px; text-shadow: 0 0 12px rgba(243, 198, 93, 0.3); }
        .lm-score-box { display: flex; align-items: center; gap: 10px; background: #000000; border: 1px solid #164e42; padding: 8px 20px; border-radius: 8px; font-size: 1.8rem; font-weight: 800; direction: ltr; font-family: var(--font-mono); min-width: 100px; justify-content: center; color: var(--gold-bright); text-shadow: 0 0 10px rgba(212, 163, 46, 0.7); box-shadow: inset 0 0 15px rgba(0,0,0,0.9); }
        .lm-score-box.score-flash { animation: scoreFlash 1.2s ease-out; }
        @keyframes scoreFlash { 0% { background: #000; transform: scale(1); } 20% { background: var(--gold-accent); color: #000; transform: scale(1.15); box-shadow: 0 0 30px rgba(212,163,46,0.9); } 100% { background: #000; color: var(--gold-bright); transform: scale(1); } }
        .lm-goal-banner { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--gold-accent), var(--gold-bright)); color: #051613; font-family: var(--font-display); font-weight: 900; font-size: 0.7rem; padding: 3px 14px; border-radius: 20px; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(212,163,46,0.6); animation: goalPop 15s ease-out; opacity: 0; pointer-events: none; }
        @keyframes goalPop { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.5); } 15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); } 30% { transform: translateX(-50%) translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(1); } }
        .lm-minute-badge { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .lm-minute-val { background: #000000; color: var(--gold-bright); font-family: var(--font-mono); font-weight: 800; font-size: 0.92rem; padding: 4px 14px; border-radius: 20px; border: 1px solid #164e42; direction: ltr; min-width: 50px; text-align: center; text-shadow: 0 0 8px rgba(243, 198, 93, 0.8); }
        .lm-bottom-row { display: flex; justify-content: center; align-items: center; margin-top: 12px; }
        .lm-goto-btn { background: rgba(212,163,46,0.12); color: var(--gold-bright); border: 1px solid rgba(212,163,46,0.4); padding: 7px 16px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body); transition: background 0.2s, box-shadow 0.2s; }
        .lm-goto-btn:hover { background: rgba(212,163,46,0.22); box-shadow: 0 0 16px rgba(212,163,46,0.3); }
        .lm-error-banner { background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(220,38,38,0.12)); border: 1px solid rgba(239,68,68,0.5); color: #ffb4b4; padding: 6px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; text-align: center; margin-bottom: 6px; animation: pulse 2s infinite; }
        .lm-source-line { font-size: 0.66rem; color: var(--text-muted); font-weight: 600; text-align: center; margin-top: 6px; font-family: var(--font-mono); direction: ltr; letter-spacing: 0.3px; }
        .controls-section { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; width: 100%; }
        .control-card { background: var(--bg-sub-card); padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; text-align: right; box-shadow: var(--shadow-soft); }
        .section-label { font-size: 0.85rem; font-weight: 800; color: var(--gold-bright); display: flex; align-items: center; gap: 6px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .controls-section input, .controls-section select { width: 100%; padding: 11px 16px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; outline: none; background-color: var(--input-bg); color: var(--text-main); text-align: right; }
        .controls-section input::placeholder { color: var(--text-muted); opacity: 0.6; }
        .controls-section input:focus, .controls-section select:focus { border-color: var(--gold-accent); box-shadow: 0 0 0 3px rgba(212, 163, 46, 0.18); }
        input.time-text-in { direction: ltr; text-align: center; }
        .date-selects { display: flex; gap: 6px; direction: rtl; width: 100%; }
        .date-selects select { flex: 1; min-width: 0; padding: 8px 4px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.82rem; font-weight: 600; background-color: var(--input-bg); color: var(--text-main); text-align: center; outline: none; cursor: pointer; }
        .date-selects select:focus { border-color: var(--gold-accent); box-shadow: 0 0 0 3px rgba(212, 163, 46, 0.18); }
        .table-wrapper .date-selects select { padding: 6px 2px; font-size: 0.75rem; border-radius: 8px; }
        .controls-section select option { background-color: var(--bg-card); color: var(--text-main); }
        .controls-section button.action-submit-btn { background: linear-gradient(135deg, var(--gold-accent), var(--gold-deep)); color: #051613; border: none; padding: 11px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; font-size: 0.95rem; box-shadow: 0 6px 16px rgba(212, 163, 46, 0.35); transition: transform 0.2s, filter 0.2s; }
        .controls-section button.action-submit-btn:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(212, 163, 46, 0.5); }
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s; }
        .filter-btn:hover { border-color: var(--gold-accent); color: var(--text-main); }
        .filter-btn.active { background: linear-gradient(135deg, var(--crest-blue), var(--crest-navy)); color: #ffffff; border-color: var(--gold-accent); box-shadow: 0 4px 12px rgba(5, 22, 19, 0.4); }
        .filter-btn.active.live-filter { background: linear-gradient(135deg, #ef4444, #dc2626); border-color: #dc2626; box-shadow: 0 0 14px rgba(239,68,68,0.4); }
        .scoreboard { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; background: linear-gradient(135deg, var(--bg-sub-card), var(--bg-card)); padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow-soft); }
        .scoreboard-title { width: 100%; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 0.8rem; color: var(--gold-accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .player-card { background: linear-gradient(135deg, var(--bg-card), var(--bg-sub-card)); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 0.88rem; box-shadow: 0 3px 10px rgba(0,0,0,0.2); transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
        .player-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,0.3); border-color: var(--gold-accent); }
        .player-card.top-rank { border-color: var(--gold-accent); box-shadow: 0 4px 14px rgba(212,163,46,0.25), var(--glow-gold); }
        .player-card .rank { font-family: var(--font-mono); font-weight: 800; font-size: 0.85rem; color: var(--text-muted); min-width: 20px; text-align: center; }
        .player-card .score { background: linear-gradient(135deg, var(--crest-blue), var(--crest-navy)); color: #ffffff; padding: 3px 10px; border-radius: 8px; font-size: 0.74rem; font-weight: 800; border-bottom: 2px solid var(--gold-accent); font-family: var(--font-mono); }
        .remove-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; line-height: 1; opacity: 0.5; transition: opacity 0.2s, transform 0.2s; }
        .remove-btn:hover { opacity: 1; transform: scale(1.2); }
        .countdown-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(212, 163, 46, 0.1); color: var(--gold-bright); border: 1px solid rgba(212, 163, 46, 0.25); padding: 3px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; direction: ltr; white-space: nowrap; font-family: var(--font-mono); }
        .countdown-badge.live { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; border-color: #dc2626; animation: pulse 1.5s infinite; box-shadow: 0 0 16px rgba(239, 68, 68, 0.5); }
        .countdown-badge.ended { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); border-color: var(--border-color); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.55; } 100% { opacity: 1; } }
        .api-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 7px; font-size: 0.68rem; font-weight: 800; white-space: nowrap; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted); letter-spacing: 0.2px; }
        .api-pill.api-live { background: linear-gradient(135deg, #16a34a, #15803d); color: #ffffff; border-color: #15803d; box-shadow: 0 0 10px rgba(22,163,74,0.45); animation: pulse 1.6s infinite; }
        .api-pill.api-waiting { background: rgba(100,116,139,0.14); color: var(--text-muted); }
        .api-pill.api-down { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; border-color: #dc2626; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
        .api-pill.api-searching { background: rgba(245,158,11,0.16); color: #fbbf24; border-color: rgba(245,158,11,0.45); }
        .api-pill.api-manual { background: rgba(22,78,66,0.2); color: var(--gold-bright); }
        .match-api-status { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .actual-source { font-size: 0.66rem; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 4px; direction: ltr; font-family: var(--font-mono); }
        .mobile-cards-container { display: flex; flex-direction: column; gap: 14px; will-change: transform; transform: translateZ(0); }
        .match-mobile-card { background: linear-gradient(160deg, var(--bg-card), var(--bg-sub-card)); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-soft); scroll-margin-top: 20px; position: relative; overflow: hidden; }

        .match-mobile-card.clasico-card { background: linear-gradient(160deg, var(--clasico-bg), var(--bg-card)); border-color: rgba(253, 164, 175, 0.5); }

    function isPredictionLocked(match) {

        if (!match.date || !timeStr) return false;

        const actual = normalizeScoreStr(actualRaw);

    function syncAutoWinners() {

            if (!m || currentData[`manualWinners_${m.id}`]) return;

        "atletico madrid": ["אתלטיקו", "אתלטיקו מדריד"], "athletic bilbao": ["בילבאו", "אתלטיק בילבאו"],

        "mallorca": ["מיורקה"], "alaves": ["אלאבס"], "espanyol": ["אספניול"],
        "levante": ["לבנטה"], "elche": ["אלצ'ה"], "real oviedo": ["אוביידו", "ריאל אוביידו"],

        "manchester city": ["מנצ'סטר סיטי", "מן סיטי"], "manchester united": ["מנצ'סטר יונייטד"],

    function normTeam(str) {

    function canonicalTeam(name) {
        const n = normTeam(name);
        if (!n) return "";
        for (const [canon, aliases] of Object.entries(TEAM_ALIASES)) {
            if (n === canon || canon.includes(n) || n.includes(canon)) return canon;

        if (consecutiveFailures > 0) return Math.min(MAX_BACKOFF_MS, 2000 * Math.pow(2, consecutiveFailures - 1));

                <button class="remove-btn" onclick="removePlayer('${player}')">×</button>
                <span>${player}</span>
                <span class="score">${scores[player]} נק'</span>
            </div>`).join("");
        const filteredMatches = getFilteredMatches();
        const mobileContainer = document.getElementById("mobileCardsContainer");
        if (!filteredMatches.length && currentMatches.length) {
            mobileContainer.innerHTML = `<div class="empty-state">אין משחקים בקטגוריה זו</div>`;
        } else {
            mobileContainer.innerHTML = filteredMatches.map(m => {
            const savedActual = currentData[`actual_${m.id}`] !== undefined ? currentData[`actual_${m.id}`] : (m.defaultActual || "");
            const savedTime = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "22:00");
            const savedDate = currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
            const savedVenueType = currentData[`venueType_${m.id}`] !== undefined ? currentData[`venueType_${m.id}`] : (m.venueType || "בית");
            const isHome = savedVenueType === 'בית';
            const savedWinners = currentData[`winners_${m.id}`] || [];
            const st = getMatchStatus(m);
            const apiStatus = getMatchApiStatus(m);
            const sourceNote = getMatchSourceNote(m);
            const unlocked = !!currentData[`unlocked_${m.id}`];
            const locked = isPredictionLocked(m);
            const disabledAttr = (!unlocked && (st.isEnded || locked)) ? 'disabled' : '';
            const winnersDisabled = (!unlocked && st.isEnded) ? 'disabled' : '';
            const isManualWinners = !!currentData[`manualWinners_${m.id}`];
            const lockBtnHTML = `<button class="delete-match-btn" title="${unlocked ? 'נעל מחדש' : 'בטל נעילה ואפשר עריכה'}" onclick="toggleManualLock('${m.id}')">${unlocked ? '🔓' : '🔒'}</button>`;
            const autoWinnersBtnHTML = isManualWinners ? `<button class="winner-btn" title="חזרה לחישוב אוטומטי" onclick="resetWinnersToAuto('${m.id}')">↺ אוטומטי</button>` : '';
            const deleteBtnHTML = m.isUserCreated ? `<button class="delete-match-btn" title="מחק משחק" onclick="deleteMatch('${m.id}')">🗑️</button>` : '';
            const winnersHTML = activePlayersList.map(player => {
                const isChecked = savedWinners.includes(player);
                return `<button class="winner-btn ${isChecked ? 'active' : ''}" ${winnersDisabled} onclick="onWinnerToggle('${m.id}', '${player}')">${player}</button>`;
            }).join("");
            const predictionsMobileHTML = activePlayersList.map(player => {
                const savedPred = currentData[`pred_${m.id}_${player}`] || "";
                return `<div class="pred-box-mini"><span>${player}</span><input type="text" class="score-in" value="${savedPred}" placeholder="-" ${disabledAttr} onchange="onInputSave('pred_${m.id}_${player}', this.value)"></div>`;
            }).join("");
            let badgeClass = "countdown-badge";
            if (st.isLive) badgeClass += " live"; else if (st.isEnded) badgeClass += " ended";
            return `
                <div class="match-mobile-card ${m.isClasico ? 'clasico-card' : ''}" id="card_mobile_${m.id}">
                    <div class="match-card-header">
                        <div class="match-card-title">${deleteBtnHTML}${lockBtnHTML}${m.isClasico ? '🔥 ' : ''}<span>${m.match}</span></div>
                        <div>${getCompBadge(m.comp)}</div>
                    </div>
                    <div class="match-card-info">
                        <span>📅 ${formatDateDisplay(savedDate)}</span>
                        <span id="cd_mobile_${m.id}" class="${badgeClass}">${st.text}</span>
                    </div>
                    <div class="match-api-status">
                        <span class="api-pill ${apiStatus.cls}" id="api_status_mobile_${m.id}">${apiStatus.label}</span>
                    </div>
                    <div class="match-card-actual" style="flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 90px;">
                            <span style="font-weight: 700; font-size: 0.8rem; display: block; color: var(--text-muted); margin-bottom: 4px;">בית/חוץ:</span>
                            <div class="venue-toggle-group" style="width: 100%;">
                                <button type="button" class="venue-btn ${isHome ? 'active-h' : ''}" style="flex:1;" onclick="setVenueType('${m.id}', 'בית')">H - בית</button>
                                <button type="button" class="venue-btn ${!isHome ? 'active-a' : ''}" style="flex:1;" onclick="setVenueType('${m.id}', 'חוץ')">A - חוץ</button>
                            </div>
                        </div>
                        <div style="flex: 1; min-width: 110px;">
                            <span style="font-weight: 700; font-size: 0.8rem; display: block; color: var(--text-muted); margin-bottom: 4px;">תאריך:</span>
                            ${dateSelectsHTML('date_' + m.id, savedDate)}
                        </div>
                        <div>
                            <span style="font-weight: 700; font-size: 0.8rem; display: block; color: var(--text-muted); margin-bottom: 4px;">שעה (24h):</span>
                            <input type="text" class="time-text-in" value="${savedTime}" placeholder="22:00" onchange="onInputSave('time_${m.id}', this.value)">
                        </div>
                        <div>
                            <span style="font-weight: 700; font-size: 0.8rem; display: block; color: var(--text-muted); margin-bottom: 4px;">תוצאה:</span>
                            <input type="text" class="score-in actual-in" value="${savedActual}" placeholder="0-0" onchange="onInputSave('actual_${m.id}', this.value)">
                            <span id="src_mobile_${m.id}">${sourceNote}</span>
                        </div>
                    </div>
                    <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted);">ניחושי שחקנים:</div>
                    <div class="match-card-predictions">${predictionsMobileHTML}</div>
                    <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted);">מי צדק? ${isManualWinners ? '(עריכה ידנית)' : '(מזוהה אוטומטית)'}</div>
                    <div class="winners-box" style="grid-template-columns: repeat(3, 1fr);">${winnersHTML}${autoWinnersBtnHTML}</div>
                </div>`;
            }).join("");
        }
        document.getElementById("tableHeaderRow").innerHTML = `
            <th style="text-align: right; padding-right: 12px; width: 19%;">משחק</th>
            <th style="width: 8%;">מסגרת</th>
            <th style="width: 11%;">בית/חוץ</th>
            <th style="width: 11%;">תאריך</th>
            <th style="width: 7%;">שעה</th>
            <th style="width: 13%;">ספירה לאחור</th>
            <th style="width: 7%;">תוצאה</th>
            <th style="width: 10%;">מי צדק?</th>
            ${activePlayersList.map(p => `<th class="player-th" style="width: ${Math.max(6, 16 / activePlayersList.length)}%;">${p}</th>`).join("")}`;
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        filteredMatches.forEach((m) => {
            const tr = document.createElement("tr");
            if (m.isClasico) tr.classList.add("clasico");
            const savedActual = currentData[`actual_${m.id}`] !== undefined ? currentData[`actual_${m.id}`] : (m.defaultActual || "");
            const savedTime = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "22:00");
            const savedDate = currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
            const savedVenueType = currentData[`venueType_${m.id}`] !== undefined ? currentData[`venueType_${m.id}`] : (m.venueType || "בית");
            const isHome = savedVenueType === 'בית';
            const savedWinners = currentData[`winners_${m.id}`] || [];
            const st = getMatchStatus(m);
            const apiStatus = getMatchApiStatus(m);
            const unlocked = !!currentData[`unlocked_${m.id}`];
            const locked = isPredictionLocked(m);
            const disabledAttr = (!unlocked && (st.isEnded || locked)) ? 'disabled' : '';
            const winnersDisabled = (!unlocked && st.isEnded) ? 'disabled' : '';
            const isManualWinners = !!currentData[`manualWinners_${m.id}`];
            const lockBtnHTML = `<button class="delete-match-btn" title="${unlocked ? 'נעל מחדש' : 'בטל נעילה ואפשר עריכה'}" onclick="toggleManualLock('${m.id}')">${unlocked ? '🔓' : '🔒'}</button>`;
            const autoWinnersBtnHTML = isManualWinners ? `<button class="winner-btn" title="חזרה לחישוב אוטומטי" onclick="resetWinnersToAuto('${m.id}')">↺ אוטומטי</button>` : '';
            const deleteBtnHTML = m.isUserCreated ? `<button class="delete-match-btn" title="מחק משחק" onclick="deleteMatch('${m.id}')">🗑️</button>` : '';
            const winnersHTML = activePlayersList.map(player => {
                const isChecked = savedWinners.includes(player);
                return `<button class="winner-btn ${isChecked ? 'active' : ''}" ${winnersDisabled} onclick="onWinnerToggle('${m.id}', '${player}')">${player}</button>`;
            }).join("");
            const predictionsHTML = activePlayersList.map(player => {
                const savedPred = currentData[`pred_${m.id}_${player}`] || "";
                return `<td><input type="text" class="score-in" value="${savedPred}" placeholder="-" ${disabledAttr} onchange="onInputSave('pred_${m.id}_${player}', this.value)"></td>`;
            }).join("");
            let badgeClass = "countdown-badge";
            if (st.isLive) badgeClass += " live"; else if (st.isEnded) badgeClass += " ended";
            tr.innerHTML = `
                <td class="match-name">${deleteBtnHTML}${lockBtnHTML}${m.isClasico ? '🔥 ' : ''}<span>${m.match}</span></td>
                <td>${getCompBadge(m.comp)}</td>
                <td>
                    <div class="venue-toggle-group">
                        <button type="button" class="venue-btn ${isHome ? 'active-h' : ''}" onclick="setVenueType('${m.id}', 'בית')">H</button>
                        <button type="button" class="venue-btn ${!isHome ? 'active-a' : ''}" onclick="setVenueType('${m.id}', 'חוץ')">A</button>
                    </div>
                </td>
                <td class="match-date-cell">${dateSelectsHTML('date_' + m.id, savedDate)}</td>
                <td><input type="text" class="time-text-in" value="${savedTime}" placeholder="22:00" onchange="onInputSave('time_${m.id}', this.value)"></td>
                <td class="countdown-cell">
                    <span id="cd_table_${m.id}" class="${badgeClass}">${st.text}</span>
                    <span class="api-pill ${apiStatus.cls}" id="api_status_table_${m.id}">${apiStatus.label}</span>
                </td>
                <td><input type="text" class="score-in actual-in" value="${savedActual}" placeholder="0-0" onchange="onInputSave('actual_${m.id}', this.value)"></td>
                <td><div class="winners-box" style="grid-template-columns: repeat(${Math.min(activePlayersList.length, 3)}, 1fr);">${winnersHTML}${autoWinnersBtnHTML}</div></td>
                ${predictionsHTML}`;
            tbody.appendChild(tr);
        });
    }
    function resetAllData() {
        if (confirm("האם אתה בטוח שברצונך לאפס את כל הנתונים והטבלה מחדש?")) db.ref('league_data').remove();
    }
</script>
</body>
</html>
