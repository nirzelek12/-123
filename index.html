<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת הניחושים - ריאל מדריד 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rm-dark-bg: #0a0e17;
            --rm-card-bg: rgba(18, 26, 41, 0.85);
            --rm-navy: #131c2e;
            --rm-dark-blue: #1c2a44;
            --rm-gold: #e5b849;
            --rm-gold-glow: rgba(229, 184, 73, 0.35);
            --rm-gold-hover: #f5cc5b;
            --rm-white: #ffffff;
            --rm-border: rgba(229, 184, 73, 0.18);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --clasico-red: #ff4d4d;
            --clasico-bg: rgba(153, 27, 27, 0.25);
            --clasico-border: rgba(239, 68, 68, 0.4);
            --success-green: #10b981;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background-color: var(--rm-dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(29, 45, 74, 0.6) 0%, transparent 75%),
                radial-gradient(circle at 80% 20%, rgba(229, 184, 73, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(180deg, rgba(19, 28, 46, 0.95) 0%, rgba(10, 14, 23, 0.8) 100%);
            backdrop-filter: blur(10px);
            color: var(--rm-white);
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid var(--rm-gold);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "HALA MADRID";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 7rem;
            font-weight: 800;
            opacity: 0.03;
            letter-spacing: 6px;
            pointer-events: none;
            white-space: nowrap;
        }

        .header-title {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--rm-white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .header-title span {
            color: var(--rm-gold);
            text-shadow: 0 0 15px var(--rm-gold-glow);
        }

        .header-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .add-player-box {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .add-player-input {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--rm-border);
            background: rgba(10, 14, 23, 0.7);
            color: var(--rm-white);
            font-size: 0.95rem;
            outline: none;
        }

        .add-player-input:focus {
            border-color: var(--rm-gold);
        }

        .btn-add-player {
            background: var(--rm-gold);
            color: var(--rm-navy);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-player:hover {
            background: var(--rm-gold-hover);
        }

        .players-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin: -22px auto 30px;
            max-width: 1100px;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }

        .player-badge {
            background: rgba(28, 42, 68, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--rm-gold);
            color: var(--rm-white);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-badge:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px var(--rm-gold-glow);
            border-color: var(--rm-gold-hover);
        }

        .player-badge .pts {
            background: linear-gradient(135deg, var(--rm-gold) 0%, #c99a19 100%);
            color: var(--rm-dark-bg);
            padding: 2px 10px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            font-family: 'Teko', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .remove-player-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1;
            transition: all 0.2s;
            margin-left: 2px;
        }

        .remove-player-btn:hover {
            background: #ef4444;
            color: #ffffff;
            transform: scale(1.1);
        }

        .container {
            max-width: 1350px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--rm-card-bg);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--rm-border);
        }

        .info-note {
            font-size: 0.95rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.15) !important;
            color: var(--success-green) !important;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 18px;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background: #ef4444;
            color: var(--rm-white);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .table-card {
            background: var(--rm-card-bg);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--rm-border);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.95rem;
        }

        thead th {
            background-color: var(--rm-navy);
            color: var(--rm-gold);
            padding: 18px 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            border-bottom: 2px solid var(--rm-gold);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        thead th.player-header {
            background-color: var(--rm-dark-blue);
            color: var(--rm-white);
            min-width: 85px;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015);
        }

        tbody tr:hover {
            background-color: rgba(229, 184, 73, 0.05);
        }

        td.match-cell {
            text-align: right;
            padding: 16px 20px;
            font-weight: 700;
            color: var(--rm-white);
            white-space: nowrap;
        }

        td.date-cell {
            color: var(--text-muted);
            font-size: 0.88rem;
            white-space: nowrap;
            padding: 16px 10px;
        }

        tr.clasico-row {
            background-color: var(--clasico-bg) !important;
            border-bottom: 1px solid var(--clasico-border);
        }

        tr.clasico-row td.match-cell {
            color: #fca5a5;
        }

        .clasico-badge {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: var(--rm-white);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 8px;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.4);
        }

        input.score-input {
            width: 58px;
            text-align: center;
            padding: 8px 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--rm-white);
            background: rgba(10, 14, 23, 0.6);
            transition: all 0.2s;
            direction: ltr;
        }

        input.score-input:focus {
            outline: none;
            border-color: var(--rm-gold);
            box-shadow: 0 0 12px var(--rm-gold-glow);
            background: rgba(10, 14, 23, 0.9);
        }

        input.actual-score {
            border-color: var(--rm-gold);
            background: rgba(229, 184, 73, 0.1);
            color: var(--rm-gold);
        }

        .winners-grid {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 4px;
            max-width: 320px;
            margin: 0 auto;
        }

        .winner-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .winner-chip:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--rm-white);
        }

        .winner-chip input {
            display: none;
        }

        .winner-chip.active {
            background: linear-gradient(135deg, var(--rm-gold) 0%, #c99a19 100%);
            color: var(--rm-dark-bg);
            border-color: var(--rm-gold);
            font-weight: 800;
            box-shadow: 0 2px 8px var(--rm-gold-glow);
        }

        .winner-chip.active::before {
            content: "✓";
            font-weight: 900;
            color: var(--rm-dark-bg);
        }

        @media (max-width: 768px) {
            .header-title { font-size: 1.6rem; }
            .actions-bar { flex-direction: column; gap: 14px; text-align: center; }
            td.match-cell { font-size: 0.88rem; padding: 12px; }
            .winners-grid { max-width: 230px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            🏆 <span>ליגת הניחושים</span> - ריאל מדריד 2026/27
        </div>
        <div class="header-subtitle">טבלת מעקב תוצאות וניחושים - שמירה אוטומטית בזמן אמת</div>
        <div class="add-player-box">
            <input type="text" id="newPlayerName" class="add-player-input" placeholder="שם שחקן חדש...">
            <button class="btn-add-player" onclick="addNewPlayer()">+ הוסף שחקן</button>
        </div>
    </header>

    <div class="players-bar" id="playersBar">
        <!-- Dynamic Player Badges -->
    </div>

    <div class="container">
        <div class="actions-bar">
            <div class="info-note">
                ⚡ <b>שמירה אוטומטית פעילה:</b> כל תוצאה, ניחור, הוספה או הסרת שחקן נשמרים ברקע בלייב!
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="status-badge" id="saveStatus">✓ נשמר</div>
                <button class="btn-clear" onclick="resetAllData()">🗑️ איפוס נתונים</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table id="predictionTable">
                    <thead>
                        <tr id="tableHeaderRow">
                            <!-- Dynamic Table Header -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data rows dynamically rendered -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PLAYERS = ["ניר", "ליאור", "אבירם", "שון", "חן", "מאור"];
        const PLAYERS_KEY = "rm_predictions_players_list";
        const STORAGE_KEY = "rm_predictions_league_data";

        function getPlayers() {
            const saved = localStorage.getItem(PLAYERS_KEY);
            return saved ? JSON.parse(saved) : [...DEFAULT_PLAYERS];
        }

        function savePlayersList(players) {
            localStorage.setItem(PLAYERS_KEY, JSON.stringify(players));
        }

        function addNewPlayer() {
            const input = document.getElementById("newPlayerName");
            const name = input.value.trim();
            if (!name) return;

            let players = getPlayers();
            if (players.includes(name)) {
                alert("שחקן בשם זה כבר קיים!");
                return;
            }

            players.push(name);
            savePlayersList(players);
            input.value = "";
            
            initUI();
            showSavedIndicator();
        }

        function removePlayer(name) {
            if (confirm(`להסיר את ${name} מהתחרות?`)) {
                let players = getPlayers();
                players = players.filter(p => p !== name);
                savePlayersList(players);

                initUI();
                showSavedIndicator();
            }
        }

        const matches = [
            { match: "אספניול - ריאל מדריד", date: "22/08/2026", defaultActual: "1-2" },
            { match: "ריאל מדריד - ריאל סוסיאדד", date: "26/08/2026" },
            { match: "ריאל מדריד - מלאגה", date: "30/08/2026" },
            { match: "ריאל בטיס - ריאל מדריד", date: "04/09/2026" },
            { match: "ריאל מדריד - ראיו ואייקאנו", date: "13/09/2026" },
            { match: "אלצ'ה - ריאל מדריד", date: "16/09/2026" },
            { match: "אתלטיקו מדריד - ריאל מדריד", date: "20/09/2026" },
            { match: "ריאל מדריד - ויאריאל", date: "11/10/2026" },
            { match: "ריאל מדריד - סביליה", date: "18/10/2026" },
            { match: "ברצלונה - ריאל מדריד", date: "25/10/2026", isClasico: true },
            { match: "ראסינג סנטנדר - ריאל מדריד", date: "01/11/2026" },
            { match: "ולנסיה - ריאל מדריד", date: "08/11/2026" },
            { match: "ריאל מדריד - סלטה ויגו", date: "22/11/2026" },
            { match: "ריאל מדריד - דפורטיבו אלאבס", date: "29/11/2026" },
            { match: "אתלטיק בילבאו - ריאל מדריד", date: "06/12/2026" },
            { match: "ריאל מדריד - אוססונה", date: "13/12/2026" },
            { match: "דפורטיבו לה קורוניה - ריאל מדריד", date: "20/12/2026" },
            { match: "ריאל מדריד - חטאפה", date: "03/01/2027" },
            { match: "ריאל מדריד - לבאנטה", date: "10/01/2027" },
            { match: "מלאגה - ריאל מדריד", date: "17/01/2027" },
            { match: "ריאל מדריד - ריאל בטיס", date: "24/01/2027" },
            { match: "ראיו ואייקאנו - ריאל מדריד", date: "31/01/2027" },
            { match: "ריאל סוסיאדד - ריאל מדריד", date: "07/02/2027" },
            { match: "ריאל מדריד - אתלטיק בילבאו", date: "14/02/2027" },
            { match: "סביליה - ריאל מדריד", date: "21/02/2027" },
            { match: "ריאל מדריד - ולנסיה", date: "28/02/2027" },
            { match: "ויאריאל - ריאל מדריד", date: "06/03/2027" },
            { match: "ריאל מדריד - אספניול", date: "13/03/2027" },
            { match: "סלטה ויגו - ריאל מדריד", date: "20/03/2027" },
            { match: "ריאל מדריד - אתלטיקו מדריד", date: "03/04/2027" },
            { match: "אוססונה - ריאל מדריד", date: "10/04/2027" },
            { match: "חטאפה - ריאל מדריד", date: "17/04/2027" },
            { match: "ריאל מדריד - אלצ'ה", date: "20/04/2027" },
            { match: "לבאנטה - ריאל מדריד", date: "01/05/2027" },
            { match: "ריאל מדריד - ברצלונה", date: "08/05/2027", isClasico: true },
            { match: "ריאל מדריד - ראסינג סנטנדר", date: "15/05/2027" },
            { match: "דפורטיבו אלאבס - ריאל מדריד", date: "22/05/2027" },
            { match: "ריאל מדריד - דפורטיבו לה קורוניה", date: "29/05/2027" }
        ];

        function getSavedData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            showSavedIndicator();
            updateScores();
        }

        function showSavedIndicator() {
            const status = document.getElementById("saveStatus");
            status.style.opacity = "1";
            status.innerHTML = "✓ נשמר";
            status.style.background = "#d1fae5";
            status.style.color = "#065f46";
            
            setTimeout(() => {
                status.style.opacity = "0.7";
            }, 1000);
        }

        function updateScores() {
            const players = getPlayers();
            const data = getSavedData();
            const scores = {};
            players.forEach(p => scores[p] = 0);

            matches.forEach((_, idx) => {
                const winners = data[`winners_${idx}`] || [];
                winners.forEach(player => {
                    if (scores[player] !== undefined) {
                        scores[player]++;
                    }
                });
            });

            players.forEach(player => {
                const el = document.getElementById(`score_${player}`);
                if (el) el.innerText = `${scores[player]} נק'`;
            });
        }

        function renderPlayersBar() {
            const players = getPlayers();
            const bar = document.getElementById("playersBar");
            bar.innerHTML = players.map((player, index) => `
                <div class="player-badge">
                    <button class="remove-player-btn" onclick="removePlayer('${player}')" title="הסר שחקן">×</button>
                    ${index === 0 ? '👑' : '⭐'} ${player}
                    <span class="pts" id="score_${player}">0 נק'</span>
                </div>
            `).join("");
        }

        function renderTableHeader() {
            const players = getPlayers();
            const headerRow = document.getElementById("tableHeaderRow");
            const playerHeaders = players.map(p => `<th class="player-header">${p}</th>`).join("");
            
            headerRow.innerHTML = `
                <th style="text-align: right; padding-right: 20px;">משחק</th>
                <th>תאריך</th>
                <th>תוצאה בפועל</th>
                <th style="min-width: 260px;">מי צדק? (בחירה מרובה)</th>
                ${playerHeaders}
            `;
        }

        function renderTable() {
            const players = getPlayers();
            const tbody = document.getElementById("tableBody");
            const savedData = getSavedData();
            tbody.innerHTML = "";

            matches.forEach((m, idx) => {
                const tr = document.createElement("tr");
                if (m.isClasico) tr.classList.add("clasico-row");

                const savedActual = savedData[`actual_${idx}`] !== undefined ? savedData[`actual_${idx}`] : (m.defaultActual || "");
                const savedWinners = savedData[`winners_${idx}`] || [];

                const winnersHTML = players.map(player => {
                    const isChecked = savedWinners.includes(player);
                    return `
                        <label class="winner-chip ${isChecked ? 'active' : ''}" id="chip_${idx}_${player}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="onWinnerToggle('${idx}', '${player}', this.checked)">
                            ${player}
                        </label>
                    `;
                }).join("");

                const predictionsHTML = players.map(player => {
                    const savedPred = savedData[`pred_${idx}_${player}`] || "";
                    return `
                        <td>
                            <input type="text" class="score-input" placeholder="-" value="${savedPred}" id="pred_${idx}_${player}" oninput="onInputSave('pred_${idx}_${player}', this.value)">
                        </td>
                    `;
                }).join("");

                tr.innerHTML = `
                    <td class="match-cell">
                        ${m.isClasico ? '<span class="clasico-badge">אל קלאסיקו</span>' : ''}
                        ${m.match}
                    </td>
                    <td class="date-cell">${m.date}</td>
                    <td>
                        <input type="text" class="score-input actual-score" value="${savedActual}" placeholder="0-0" id="actual_${idx}" oninput="onInputSave('actual_${idx}', this.value)">
                    </td>
                    <td>
                        <div class="winners-grid">
                            ${winnersHTML}
                        </div>
                    </td>
                    ${predictionsHTML}
                `;
                tbody.appendChild(tr);
            });

            updateScores();
        }

        function onInputSave(key, value) {
            const data = getSavedData();
            data[key] = value;
            saveData(data);
        }

        function onWinnerToggle(idx, player, isChecked) {
            const data = getSavedData();
            const key = `winners_${idx}`;
            let winners = data[key] || [];

            if (isChecked) {
                if (!winners.includes(player)) winners.push(player);
            } else {
                winners = winners.filter(p => p !== player);
            }

            data[key] = winners;

            const label = document.getElementById(`chip_${idx}_${player}`);
            if (label) {
                if (isChecked) label.classList.add("active");
                else label.classList.remove("active");
            }

            saveData(data);
        }

        function resetAllData() {
            if (confirm("האם אתה בטוח שברצונך לאפס את כל הנתונים, הניקוד והשחקנים?")) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(PLAYERS_KEY);
                initUI();
            }
        }

        function initUI() {
            renderPlayersBar();
            renderTableHeader();
            renderTable();
        }

        // Initialize table on page load
        initUI();
    </script>
</body>
</html>
