            if (feeds.every(result => result.status === "rejected")) throw new Error("שני מקורות התוצאות לא זמינים");
            feeds.forEach((result,i) => { if (result.status === "fulfilled") tsdbCache.set(urls[i],result.value); });

        try {
            if (!goalAudioCtx) goalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = goalAudioCtx;
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'triangle';
                const t = now + i * 0.14;
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.35, t + 0.02);

    /* ---- Remove duplicate matches (same teams + same date, any order) ---- */
    function matchTeamPair(m) {

    function dedupeDuplicateMatches() {

        });

        currentMatches = currentMatches.filter(m => !toRemove.includes(m.id));
        toRemove.forEach(id => Object.keys(currentData).forEach(k => { if (k.includes(id)) delete currentData[k]; }));
        saveToCloud();
        return true;
    }
    /* ---- Apply API scores automatically ----
       Writes the result only for the match that is actually being played right now,
       or for a finished match that has no result yet (always Real Madrid - opponent).
       A result that is already stored for a match that is no longer playing is never
       rewritten, so past results can't change while another match is being played. */
    function applyAutoScores() {
        if (!autoScoreEnabled) return;
        // התאריך והשעה תמיד מגיעים מהפיד — גם למשחק שהסתיים, כדי שהתאריך בטבלה יהיה הנכון
        let changed = syncAutoDateTimes();
        const now = Date.now();
        currentMatches.forEach(m => {
            if (!m) return;
            const info = apiScoreForMatch(m);
            if (!info) return;
            const evLive = isEventLive(info.event);
            const evFinished = isEventFinished(info.event);
            const st = getMatchStatus(m);
            const ko = matchKickoff(m);
            const playingNow = ko ? (now >= ko - 5 * 60000 && now <= ko + 240 * 60000) : st.isLive;
            if (!evLive && !evFinished) return;
            // the fixture feed owns the score of a match being played — a second
            // feed must never overwrite a live score (e.g. with a stale 0-0)
            const fx = findFotmobFixture(m);
            if (fx?.started && fx.realGoals != null && (evLive || fx.finished)) return;
            const stored = normalizeScoreStr(currentData[`actual_${m.id}`]);
            const flipped = stored !== "" && stored === reverseScore(info.score);
            if (evLive) notifyScoreChange(m, info.score);
            if (currentData[`manualActual_${m.id}`] && playingNow && evLive) clearManualActual(m.id); // בזמן משחק הפיד קובע
            if (currentData[`manualActual_${m.id}`]) return; // manual override — don't overwrite
            const hasStored = stored !== "";
            if (hasStored && !playingNow && !flipped) return; // settled and correct — leave it alone
            if (currentData[`actual_${m.id}`] !== info.score) {
                currentData[`actual_${m.id}`] = info.score;
                db.ref(`league_data/predictions/actual_${m.id}`).set(info.score);
                changed = true;
            }
        });
        if (changed) { sortMatches(); syncAutoWinners(); renderUI(); }
        if (dedupeDuplicateMatches()) { sortMatches(); syncAutoWinners(); renderUI(); }
        checkMatchEndedNotifications();
    }

    /* ============================================================

    function isPredictionLocked(match) {
        if (currentData[`unlocked_${match.id}`]) return false;

        const dateStr = currentData[`date_${match.id}`] !== undefined ? currentData[`date_${match.id}`] : match.date;
        if (!dateStr || !timeStr) return false;
        const matchTime = new Date(`${dateStr}T${timeStr}`).getTime();
        return (matchTime - new Date().getTime()) <= -900000;

    function toggleManualLock(matchId) {

    /* ---- עמודת התוצאה הסופית חסומה בסיסמה ---- */
    const RESULT_PASSWORD = "9086";

    function normalizeScoreStr(val) {
        if (val === undefined || val === null) return "";

        return m ? `${m[1]}-${m[2]}` : "";

    function computeAutoWinners(match) {
        const actualRaw = currentData[`actual_${match.id}`] !== undefined ? currentData[`actual_${match.id}`] : (match.defaultActual || "");

    }
    function sameList(a, b) { return [...(a||[])].sort().join("|") === [...(b||[])].sort().join("|"); }

    /* ============================================================
       MATCH STATUS / COUNTDOWN
       ============================================================ */
    function getMatchStatus(match) {
        const fx = findFotmobFixture(match), ev = findApiEvent(match);
        const detailsStatus = pitchUpdates.get(match.id)?.status;
        if (detailsStatus?.cancelled) return {text:"המשחק בוטל", isLive:false, isEnded:false};
        if (detailsStatus?.finished || fx?.finished || (ev && isEventFinished(ev))) return {text:"✓ הסתיים", isLive:false, isEnded:true};
        if (detailsStatus?.started || fx?.started || (ev && isEventLive(ev))) return {text:"⚽ המשחק משוחק כעת!", isLive:true, isEnded:false};
        const timeStr = currentData[`time_${match.id}`] !== undefined ? currentData[`time_${match.id}`] : (match.time || "22:00");
        const dateStr = currentData[`date_${match.id}`] !== undefined ? currentData[`date_${match.id}`] : match.date;
        if (!dateStr || !timeStr) return { text: "שעה לא קיימת", isLive: false, isEnded: false };
        const matchTime = new Date(`${dateStr}T${timeStr}`).getTime();
        const now = new Date().getTime();
        const diff = matchTime - now;
        if (diff <= 0 && diff > -7200000 && (fx || ev)) return {text:"בהמתנה לשריקת הפתיחה", isLive:false, isEnded:false};
        if (diff <= 0 && diff > -7200000) return { text: "⚽ המשחק משוחק כעת!", isLive: true, isEnded: false };
        if (diff <= -7200000) return { text: "✓ הסתיים", isLive: false, isEnded: true };
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        if (days > 0) return { text: `⏳ עוד ${days} ימים , ${hours} שעות`, isLive: false, isEnded: false };
        return { text: `⏳ ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`, isLive: false, isEnded: false };
    }

        });
    }

        if (!autoScoreEnabled && !currentData[`manualActual_${match.id}`]) return {key:"paused", label:"עדכון אוטומטי מושהה", cls:"api-waiting"};
        if (currentData[`manualActual_${match.id}`]) return { key: "manual", label: "✍️ תוצאה ידנית", cls: "api-manual" };
        // the fixture feed delivers the live score too — it decides the pill when

    function updateLiveMatchWidget() {

    /* ============================================================

    function updateHeaderCountdownWidget() {

            if (!dateStr) continue;
            const matchTime = new Date(`${dateStr}T${timeStr}`).getTime();
            const running = matchTime <= now && now - matchTime < 3 * 3600000 && !getMatchStatus(m).isEnded;
            if (matchTime > now || running) { nextMatch = { ...m, calculatedTime: matchTime, timeStr }; break; }
        }
        const containerEl = document.getElementById("hnmTeamsContainer");
        const infoEl = document.getElementById("hnmInfo");
        const timerEl = document.getElementById("hnmTimer");
        if (!nextMatch) {

    /* ============================================================
       SAVE / ADD / DELETE
       ============================================================ */
    /* Writes only the two lists it owns. Predictions/results are written key by key,
       so one tab (or the second site) can never overwrite another's newer results. */
    function saveToCloud() {
        db.ref('league_data/activePlayers').set(activePlayersList);
        db.ref('league_data/matches').set(currentMatches);
    }
    const MONTH_NAMES = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
    const PICKER_YEARS = [2025, 2026, 2027, 2028];
    function fillStaticDateSelects() {
        const dSel = document.getElementById("dsd_new"), mSel = document.getElementById("dsm_new"), ySel = document.getElementById("dsy_new");
        if (!dSel || dSel.options.length > 1) return;
        for (let i = 1; i <= 31; i++) dSel.innerHTML += `<option value="${String(i).padStart(2, '0')}">${i}</option>`;
        MONTH_NAMES.forEach((n, i) => mSel.innerHTML += `<option value="${String(i + 1).padStart(2, '0')}">${n}</option>`);
        PICKER_YEARS.forEach(y => ySel.innerHTML += `<option value="${y}">${y}</option>`);
    }
    fillStaticDateSelects();
    function dateSelectsHTML(prefix, value) {
        const parts = String(value || "").split("-");
        const y = parts[0] || "", m = parts[1] || "", d = parts[2] || "";
        let days = `<option value="" disabled ${d ? "" : "selected"} hidden>יום</option>`;
        for (let i = 1; i <= 31; i++) { const v = String(i).padStart(2, '0'); days += `<option value="${v}" ${d === v ? "selected" : ""}>${i}</option>`; }
        let months = `<option value="" disabled ${m ? "" : "selected"} hidden>חודש</option>`;
        MONTH_NAMES.forEach((n, i) => { const v = String(i + 1).padStart(2, '0'); months += `<option value="${v}" ${m === v ? "selected" : ""}>${n}</option>`; });
        let years = `<option value="" disabled ${y ? "" : "selected"} hidden>שנה</option>`;
        PICKER_YEARS.forEach(v => years += `<option value="${v}" ${y === String(v) ? "selected" : ""}>${v}</option>`);
        return `<div class="date-selects">
            <select id="dsd_${prefix}" onchange="onDatePartChange('${prefix}')">${days}</select>
            <select id="dsm_${prefix}" onchange="onDatePartChange('${prefix}')">${months}</select>
            <select id="dsy_${prefix}" onchange="onDatePartChange('${prefix}')">${years}</select>
        </div>`;
    }
    function onDatePartChange(prefix) {
        const d = document.getElementById("dsd_" + prefix).value;
        const m = document.getElementById("dsm_" + prefix).value;
        const y = document.getElementById("dsy_" + prefix).value;
        if (!d || !m || !y) return;
        if (prefix !== "date_new") markManualDate(prefix);
        onInputSave(prefix, `${y}-${m}-${d}`);
    }
    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }
    function getCompBadge(compName) {
        switch(compName) {
            case "ליגת האלופות": return `<span class="comp-badge comp-ucl">צ'מפיונס</span>`;
            case "גביע המלך": return `<span class="comp-badge comp-copa">גביע המלך</span>`;
            case "סופר קופה ספרדי": return `<span class="comp-badge comp-supercopa">סופר קופה</span>`;
            case "סופר קופה אירופי": return `<span class="comp-badge comp-supercup_eu">סופר קופה אירופי</span>`;
            default: return `<span class="comp-badge comp-la_liga">לה ליגה</span>`;
        }
    }
    /* ניקוד מדורג: 3 נק׳ על תוצאה מדויקת (או סימון ידני ב״מי צדק״), 1 נק׳ על כיוון נכון (ניצחון/תיקו/הפסד) */
    function scoreSign(s) { const p = s.split("-").map(Number); return Math.sign(p[0] - p[1]); }
    function predictionPoints(actual, guess) { return actual === guess ? 3 : scoreSign(actual) === scoreSign(guess) ? 1 : 0; }
    function pointsFor(m, player) {
        const actual = normalizeScoreStr(currentData[`actual_${m.id}`]);
        if (!getMatchStatus(m).isLive && (currentData[`winners_${m.id}`] || []).includes(player)) return 3;
        if (!actual) return 0;
        const g = normalizeScoreStr(currentData[`pred_${m.id}_${player}`]);
        if (!g) return 0;
        if (g === actual) return 3;
        return scoreSign(g) === scoreSign(actual) ? 1 : 0;
    }
    function ptsClass(m, p) {
        const status = getMatchStatus(m);
        const liveActual = status.isLive ? liveActualFor(m) : normalizeScoreStr(currentData[`actual_${m.id}`]);
        const done = liveActual && (status.isEnded || status.isLive);
        if (!done || !normalizeScoreStr(currentData[`pred_${m.id}_${p}`])) return ["", ""];
        const v = status.isLive ? predictionPoints(liveActual, normalizeScoreStr(currentData[`pred_${m.id}_${p}`])) : pointsFor(m,p);
        return [v === 3 ? "pts-3" : v === 1 ? "pts-1" : "pts-0", v ? `<b class="pts-chip">+${v}</b>` : ""];
    }
    function mcWeekday(d) { try { const x = new Date(`${d}T12:00`); return isNaN(x) ? "" : x.toLocaleDateString("he-IL", { weekday: "long" }); } catch (e) { return ""; } }
    function computeScores() {
        const scores = {};
        activePlayersList.forEach(p => scores[p] = 0);
        currentMatches.forEach(m => {
            if (!m || !normalizeScoreStr(currentData[`actual_${m.id}`]) && !(currentData[`winners_${m.id}`] || []).length) return;
            activePlayersList.forEach(p => scores[p] += pointsFor(m, p));
        });
        return scores;
    }
    /* ---- סטטיסטיקות עונה + תגים ---- */
    function seasonStats() {
        const done = currentMatches.filter(m => m && normalizeScoreStr(currentData[`actual_${m.id}`]) && getMatchStatus(m).isEnded);
        return activePlayersList.map(p => {
            let exact = 0, dir = 0, played = 0, streak = 0, best = 0, dirRun = 0, bestDir = 0, clasico = false;
            const form = [];
            done.forEach(m => {
                const pts = pointsFor(m, p), g = normalizeScoreStr(currentData[`pred_${m.id}_${p}`]);
                if (g) played++;
                if (pts === 3) { exact++; streak++; if (m.isClasico) clasico = true; } else streak = 0;
                if (pts >= 1) { if (pts === 1) dir++; dirRun++; } else dirRun = 0;
                best = Math.max(best, streak); bestDir = Math.max(bestDir, dirRun);
                form.push(pts);
            });
            const badges = [];
            if (best >= 2) badges.push(["🎯", "צלף — " + best + " מדויקים ברצף"]);
            if (bestDir >= 5) badges.push(["📈", "עקבי — " + bestDir + " משחקים ברצף עם נקודות"]);
            if (clasico) badges.push(["🔥", "מלך הקלאסיקו — צדק בקלאסיקו"]);
            if (played && played === done.length && done.length >= 3) badges.push(["🧱", "לא מפספס — ניחש בכל המשחקים"]);
            if (exact >= 5) badges.push(["💎", "נביא — " + exact + " תוצאות מדויקות"]);
            const total = exact * 3 + dir;
            return { p, exact, dir, played, total, acc: done.length ? Math.round(((exact + dir) / done.length) * 100) : 0, games: done.length, streak, form: form.slice(-5), badges };
        }).sort((a, b) => b.total - a.total || b.exact - a.exact);
    }
    let statsOpen = false;
    function toggleStats() { statsOpen = !statsOpen; renderUI(); }
    function statsHTML() {
        const rows = seasonStats();
        if (!rows.length) return "";
        const leader = rows[0] && rows[0].total > 0 ? rows[0].p : "";
        const formDots = f => f.map(v => `<i class="st-dot ${v === 3 ? 'st-3' : v === 1 ? 'st-1' : 'st-0'}" title="${v} נק׳"></i>`).join("");
        return `<div class="stats-card">
            <button class="stats-toggle" onclick="toggleStats()">📊 טבלת עונה וסטטיסטיקות ${statsOpen ? "▲" : "▼"}</button>
            ${statsOpen ? `<div class="stats-scroll"><table class="stats-table"><thead><tr><th>#</th><th>מנחש</th><th>נק׳</th><th>🎯 מדויק</th><th>↗ כיוון</th><th>% הצלחה</th><th>כושר</th></tr></thead><tbody>
            ${rows.map((r, i) => `<tr><td class="st-rank">${i + 1}</td><td class="st-name">${r.p}${r.p === leader ? " 👑" : ""}<div class="st-badges">${r.badges.map(b => `<span title="${b[1]}">${b[0]}</span>`).join("")}</div></td><td class="st-pts">${r.total}</td><td>${r.exact}</td><td>${r.dir}</td><td><div class="st-bar"><span style="width:${r.acc}%"></span></div>${r.acc}%<div class="st-sub">${r.exact + r.dir}/${r.games} · ניחש ${r.played}</div></td><td class="st-form">${formDots(r.form)}</td></tr>`).join("")}
            </tbody></table></div>
            <div class="stats-legend">ניקוד: 3 נק׳ על תוצאה מדויקת · 1 נק׳ על כיוון נכון (ניצחון / תיקו / הפסד). % הצלחה = משחקים שבהם קיבל נקודות מתוך כל המשחקים שהסתיימו (משחק בלי ניחוש נחשב פספוס). כושר = 5 המשחקים האחרונים. תגים: 🎯 צלף · 📈 עקבי · 🔥 מלך הקלאסיקו · 🧱 לא מפספס · 💎 נביא</div>` : ""}
        </div>`;
    }
    function addNewPlayer() {

    })();
    function savePhotoCache() {

    function photoKey(name) {
        return String(name || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }
    /* התאמת תמונה לפי שם גם כשהכתיב שונה בין המקורות (Vinícius Júnior / Vinicius Jr, שם מלא מול שם משפחה) —
       מחזירה תמונה רק כשיש התאמה אחת חד-משמעית, כדי לא להציג פנים של שחקן אחר */
    function photoTokens(n) { return photoKey(n).replace(/[.'’`]/g, "").split(/[\s\-]+/).filter(Boolean).map(t => t === "jr" ? "junior" : t === "sr" ? "senior" : t); }
    function photoLookup(name, pool) {
        pool = pool || playerPhotos;
        const key = photoKey(name);
        if (!key) return "";
        if (pool[key]) return pool[key];
        const tk = photoTokens(name);
        if (!tk.length) return "";
        const hits = new Set();
        for (const k in pool) {
            const kt = photoTokens(k);
            if (!kt.length) continue;
            const [sh, lg] = tk.length <= kt.length ? [tk, kt] : [kt, tk];
            const subset = sh.every(t => lg.includes(t)) && (sh.length > 1 || sh[0].length >= 4);
            const sameLast = tk.length > 1 && kt.length > 1 && tk[tk.length - 1] === kt[kt.length - 1] && tk[0][0] === kt[0][0];
            if (subset || sameLast) hits.add(pool[k]);
        }
        return hits.size === 1 ? [...hits][0] : "";
    }
    function photoInitials(name) {

    function photoFail(img) {
        const wrap = img.parentNode, nm = img.dataset.nm || "";
        if (!img.dataset.retry) {
            img.dataset.retry = "1";

            if (alt && alt !== img.getAttribute("src")) { img.src = alt; return; }

    /* ---- גיבוי למקורות תמונות: אם ההרכב/‏FotMob לא נותנים תמונה לשחקן, מחפשים ב-TheSportsDB ואז בוויקיפדיה.

    const PHOTO_MISS_KEY = "playerPhotoMiss_v1";

    function tsdbGate() { const p = tsdbChain.then(() => new Promise(r => setTimeout(r, 650))); tsdbChain = p; return p; }
    function imgOk(url) {

            const im = new Image();

            setTimeout(() => fin(false), 7000);
            im.src = url;

    async function tsdbSearch(q) {
        await tsdbGate();
        const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${TSDB_KEY}/searchplayers.php?p=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error("http " + res.status);
        const j = await res.json();
        return ((j && j.player) || []).filter(x => x && (!x.strSport || x.strSport === "Soccer"));
    }
    async function tsdbPhoto(name, team) {
        const tt = photoTokens(team || "");
        const teamOk = x => { const xt = photoTokens(x.strTeam || ""); return tt.length && xt.length && (tt.some(t => t.length > 3 && xt.includes(t)) || xt.some(t => t.length > 3 && tt.includes(t))); };
        let list = await tsdbSearch(String(name).trim());
        let pick = list.find(teamOk) || (list.length === 1 ? list[0] : null);
        if (!pick) {
            const toks = photoTokens(name).filter(t => t.length > 3).sort((a, b) => b.length - a.length);
            if (toks.length && photoTokens(name).length > 1) {
                list = await tsdbSearch(toks[0]);
                pick = list.find(teamOk) || null;
            }
        }
        if (!pick) return "";
        for (const raw of [pick.strCutout, pick.strThumb, pick.strRender]) {

    async function wikiPhoto(name) {

        if (!res.ok) throw new Error("http " + res.status);

        const key = photoTokens(name).filter(t => t.length > 2).sort((a, b) => b.length - a.length)[0];
        if (!key) return "";

            if (!pg.thumbnail || !pg.thumbnail.source) continue;

    function deepPhotoFor(name, team) {

            if (!url) { try { url = await wikiPhoto(name); } catch (e) { failed = true; } }

    /* משלים תמונות שלא הגיעו מהשרת — לפי שם השחקן, נשמר פעם אחת במטמון המקומי */

    const MATCH_DETAILS_URL = "/api/match-details";

                const json = await res.json();

    function archiveMatchFor(m, knownId) {
        const wantedDay = matchDateStr(m);
        return MatchArchive.matches.find(entry => {
            const [home, away] = entry.header?.teams || [];
            if (!entry.header?.status?.finished || !matchesLineupTeams(m, home, away)) return false;
            if (!wantedDay && String(entry.id) !== String(knownId)) return false;
            const date = new Date(entry.header.status.utcTime);
            const day = Number.isFinite(date.getTime()) ? date.toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }) : "";
            return !wantedDay || [wantedDay, shiftDay(wantedDay, -1), shiftDay(wantedDay, 1)].includes(day);
        });
    }
    async function fetchMatchDetails(m) {
        const knownId = pitchUpdates.get(m.id)?.matchId || findFotmobFixture(m)?.id || lineupCache[m.id]?.data?.matchId;
        const archived = archiveMatchFor(m, knownId);
        if (archived) return { id: archived.id, data: archiveDetails(archived) };
        const fetchById = async id => {
            if (!id || !/^\d{1,10}$/.test(id)) return null;
            const res = await fetch(FOTMOB_MATCH_URL + id, { signal: AbortSignal.timeout(10000) });
            if (!res.ok) return null;
            const data = await res.json();
            const [home, away] = data.header?.teams || [];
            const fixtureDay = new Date(data.header?.status?.utcTime);
            const wantedDay = matchDateStr(m);
            const day = Number.isFinite(fixtureDay.getTime()) ? fixtureDay.toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }) : "";
            const allowedDay = !wantedDay || [wantedDay, shiftDay(wantedDay, -1), shiftDay(wantedDay, 1)].includes(day);
            return allowedDay && matchesLineupTeams(m, home, away) ? { id, data } : null;
        };
        if (knownId) {
            const result = await fetchById(knownId);
            if (result) return result;
        }
        const id = await fotmobMatchId(null, matchDateStr(m), m);
        return String(id) !== String(knownId) ? fetchById(id) : null;
    }
    async function fotmobPhotoMap(matchId) {
        if (!matchId) return {};
        try {
            const res = await fetch(FOTMOB_MATCH_URL + matchId, { cache: "no-store" });
            if (!res.ok) return {};
            const json = await res.json();
            const lineup = json && json.content && json.content.lineup;
            if (!lineup) return {};
            const map = {};
            const collect = list => (list || []).forEach(p => {
                if (p && p.name && p.id) {
                    map[photoKey(p.name)] = `https://images.fotmob.com/image_resources/playerimages/${p.id}.png`;
                }
            });
            [lineup.homeTeam, lineup.awayTeam].forEach(t => {

    async function fillMissingPhotos(m) {
        const data = lineupCache[m.id] && lineupCache[m.id].data;
        if (!data || !data.available || photoFillBusy.has(m.id)) return;
        const pending = [];
        [data.home, data.away].forEach(t => {
            if (!t) return;
            (t.lines || []).forEach(l => (l.players || []).forEach(p => p && pending.push(p)));
            (t.startXI || []).forEach(p => p && pending.push(p));
            (t.subs || []).forEach(p => p && pending.push(p));
        });
        [data.home, data.away].forEach(t => {
            if (!t) return;
            [].concat(...(t.lines || []).map(l => l.players || []), t.startXI || [], t.subs || []).forEach(p => { if (p && !p.__team) p.__team = t.name || ""; });
        });
        photoFillBusy.add(m.id);
        try {
            const missing = () => pending.filter(p => !p.photo && !photoLookup(p.name));
            const resolve = pool => pending.forEach(p => {
                if (p.photo) return;
                const url = photoLookup(p.name, pool) || photoLookup(p.name);
                if (url) { p.photo = url; playerPhotos[photoKey(p.name)] = url; }
            });
            if (missing().length) {
                const kickoffMs = data.kickoff ? Date.parse(data.kickoff) : matchKickoff(m);
                const kickoffDay = Number.isFinite(kickoffMs) ? new Date(kickoffMs).toISOString().slice(0, 10) : "";
                /* מנסים כל מזהה משחק אפשרי עד שכל השחקנים (משתי הקבוצות) מקבלים תמונה:
                   המזהה של לוח המשחקים, המזהה מהשרת, ולבסוף חיפוש לפי תאריך */
                const ids = [];
                const addId = x => { x = x ? String(x) : ""; if (x && !ids.includes(x)) ids.push(x); };
                addId((findFotmobFixture(m) || {}).id);
                addId(data.matchId);
                const absorb = map => {
                    if (!map || !Object.keys(map).length) return;
                    playerPhotos = { ...playerPhotos, ...map };
                    resolve(map);
                };
                for (const id of ids) {
                    absorb(await fotmobPhotoMap(id));
                    if (!missing().length) break;
                }
                if (missing().length) {
                    const byDate = await fotmobMatchId(null, kickoffDay, m);
                    if (byDate && !ids.includes(String(byDate))) absorb(await fotmobPhotoMap(byDate));
                }
                savePhotoCache();
            }
            pending.forEach(p => {
                if (!p.photo) { const u = photoLookup(p.name); if (u) p.photo = u; }
                if (p.photo) patchPlayerPhoto(p.name);
            });
            const still = pending.filter(p => !p.photo && !photoLookup(p.name));
            if (still.length) deepFillPlayers(still).catch(() => {});
        } finally { photoFillBusy.delete(m.id); }
    }

    function matchKickoff(m) {

        for (const f of fotmobFixtures) {
            if (!f?.started || f.finished || linkedFixtures.has(String(f.id)) || !f.home?.name || !f.away?.name) continue;
            const kickoff = new Date(f.kickoff);
            const date = f.date || (Number.isFinite(kickoff.getTime()) ? kickoff.toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }) : "");
            matches.push({ id: `provider-fx-${f.id}`, providerFixture: f, match: `${f.home.name} - ${f.away.name}`, date });

    /* התשובה עשויה להגיע בשני מבנים: lines (השרת הנוכחי) או startXI (גרסה קודמת) —
       כך ההרכב מוצג תמיד, גם לפני פרסום מחדש של השרת. */
    function normalizeLineupTeam(t, m) {
        if (!t) return null;
        let lines = (t.lines || []).filter(l => l && (l.players || []).length);
        if (!lines.length && Array.isArray(t.startXI) && t.startXI.length) {
            const players = t.startXI;
            const sizes = String(t.formation || "").split("-").map(Number).filter(n => n > 0);
            if (sizes.length && sizes.reduce((a, b) => a + b, 0) === players.length - 1) {
                lines = [{ role: "GK", players: [players[0]] }];
                let idx = 1;
                sizes.forEach(n => { lines.push({ role: "MID", players: players.slice(idx, idx + n) }); idx += n; });
            } else {
                lines = [{ role: "XI", players }];
            }
        }

        const isLive = getMatchStatus(m).isLive;
        const isSub = id => updates?.swaps.some(([on]) => on === id);
        const exited = new Map();
        function currentPlayer(starter) {
            if (!isLive || !updates) return starter;
            let player = starter;
            for (const [on, off] of updates.swaps) {
                if (off !== String(player.id) || !updates.players.has(on)) continue;
                exited.set(off, { ...player, exited: true });
                player = { ...updates.players.get(on), incoming: true };
            }
            return player;
        }
        const activeLines = lines.map(l => ({ ...l, players: l.players.map(currentPlayer) }));
        const active = new Set(activeLines.flatMap(l => l.players.map(p => String(p.id))));
        const subs = (t.subs || []).filter(p => !p.id || !active.has(String(p.id)))
            .map(p => exited.get(String(p.id)) || { ...p, entered: !!isSub(String(p.id)) });
        const subIds = new Set(subs.map(p => String(p.id)));

        return { name: t.name, logo: t.logo, formation: t.formation, lines: activeLines, subs };

            <summary class="ratings-heading"><span class="ratings-heading-icon">★</span><span>ציוני שחקנים</span><small>עונת 26/27</small></summary>
            <div class="ratings-content">
                <div class="ratings-select"><label for="ratingMatchSelect">בחירת משחק</label>
                    <div class="ratings-match-name" dir="auto">${lineupEsc(selectedNames.join(" – "))}</div>
                    <div class="ratings-match-date">${lineupEsc(selectedDate)}</div>
                    <select id="ratingMatchSelect" onchange="changeRatedMatch(this.value)">${options}</select>
                </div>
                <div class="ratings-team-tabs" role="group" aria-label="בחירת קבוצה">${switches}</div>
                ${teamCards ? `<div class="ratings-teams">${teamCards}</div>` : matchDetailsStates.get(m.id) === "error"
                    ? '<p class="ratings-empty">לא הצלחנו לטעון את ציוני השחקנים. <button type="button" class="player-stats-retry" data-ratings-retry>נסו שוב</button></p>'
                    : '<p class="ratings-empty">טוען ציוני שחקנים…</p>'}
            </div>
        </details>`);
    }
    function changeRatedMatch(id) {
        if (!ratingChoices().some(match => match.key === String(id))) return;
        ratingsMatchId = String(id);
        ratingsTeamIndex = 0;
        renderPlayerRatings();
    }
    document.getElementById("playerRatingsSection").addEventListener("toggle", event => {
        if (event.target.classList.contains("ratings-panel")) ratingsPanelOpen = event.target.open;
    }, true);
    document.getElementById("playerRatingsSection").addEventListener("click", event => {
        if (event.target.closest("[data-ratings-retry]")) {
            const choice = ratingChoices().find(c => c.key === String(ratingsMatchId));
            if (choice) window.xaLoadEvents?.(choice.m, true);
            return;
        }
        const teamButton = event.target.closest("[data-ratings-team]");
        if (teamButton) {
            ratingsTeamIndex = Number(teamButton.dataset.ratingsTeam);
            const container = teamButton.closest(".ratings-content");
            container.querySelectorAll("[data-ratings-team]").forEach((tab,i) => {
                tab.classList.toggle("is-selected",i===ratingsTeamIndex);
                tab.setAttribute("aria-pressed",String(i===ratingsTeamIndex));
            });
            container.querySelectorAll(".ratings-team").forEach((team,i) => team.classList.toggle("is-selected",i===ratingsTeamIndex));
            return;
        }
        const button = event.target.closest("[data-rating-id]");
        if (!button) return;
        const choice = ratingChoices().find(c => c.key === button.dataset.ratingMatch);
        if (!choice) return;
        const m = choice.m;
        const updates = choice.entry ? ratingUpdates(choice.entry).updates : pitchUpdates.get(m.id);
        const player = updates?.players.get(button.dataset.ratingId);
        if (!player) return;
        selectedMatchPlayer = { m, initial: player, team: player.team };
        updatePlayerMatchDialog();
        if (!playerMatchDialog.open) { playerMatchDialog.showModal(); playerMatchDialog.scrollTop = 0; }
    });
    const playerMatchDialog = document.getElementById("playerMatchDialog");
    let selectedMatchPlayer = null;
    function updatePlayerMatchDialog() {
        if (!selectedMatchPlayer) return;
        const { m, initial, team } = selectedMatchPlayer;
        const candidates = orderedLineupTeams(m).find(t => canonicalTeam(t.name) === canonicalTeam(team));
        const roster = candidates ? [...candidates.lines.flatMap(l => l.players), ...candidates.subs] : [];
        const byId = initial.id && roster.find(p => String(p.id) === String(initial.id));
        const byName = roster.filter(p => photoKey(p.name) === photoKey(initial.name));
        const p = byId || (byName.length === 1 ? byName[0] : initial);
        document.getElementById("playerMatchName").textContent = p.name;
        const quick = playerMetaHTML(p);
        const stats = (p.stats || []).map(group => `<section class="player-match-stat"><h3>${lineupEsc(group.title)}</h3><dl>${group.rows.map(row => `<div><dt>${lineupEsc(row.label)}</dt><dd>${lineupEsc(row.text)}</dd></div>`).join("")}</dl></section>`).join("");
        const state = matchDetailsStates.get(m.id);
        let empty = '<p>אין עדיין נתונים מפורטים לשחקן במשחק הזה.</p>';
        if (state === "loading") empty = '<p role="status">טוען נתוני שחקן…</p>';
        else if (state === "error") empty = '<p role="status">לא הצלחנו לטעון את נתוני המשחק.</p><button type="button" class="player-stats-retry" data-player-retry>נסו שוב</button>';
        setHTML(document.getElementById("playerMatchBody"), `<p>${lineupEsc(team)} ${quick}</p>` + (stats || empty));
    }
    document.addEventListener("click", event => {
        const button = event.target.closest("[data-player-match]");
        if (!button) return;
        const m = currentMatches.find(m => String(m.id) === button.dataset.playerMatch) ||
            liveLineupMatches().find(m => m.id === button.dataset.playerMatch);
        if (!m) return;
        const t = orderedLineupTeams(m)[Number(button.dataset.playerTeam)];
        const p = t && [...t.lines.flatMap(l => l.players), ...t.subs][Number(button.dataset.playerIndex)];
        if (!p) return;
        selectedMatchPlayer = { m, initial: p, team: t.name };
        if (getMatchStatus(m).isLive || getMatchStatus(m).isEnded) window.xaLoadEvents?.(m);
        updatePlayerMatchDialog();
        if (!playerMatchDialog.open) {
            playerMatchDialog.showModal();
            playerMatchDialog.scrollTop = 0;
        }
    });
    playerMatchDialog.addEventListener("click", event => {
        if (event.target.closest("[data-player-retry]") && selectedMatchPlayer) window.xaLoadEvents?.(selectedMatchPlayer.m, true);
    });
    playerMatchDialog.addEventListener("close", () => { selectedMatchPlayer = null; });
    function renderLineupBody(m) {
        const body = document.getElementById("lineupBody");
        if (!body) return;
        const ko = matchKickoff(m);
        const cache = lineupCache[m.id];
        const hasData = cache?.data?.available || pitchUpdates.get(m.id)?.teams.length;
        if (!hasData && ko && (ko - LINEUP_WINDOW_MS) > Date.now()) {
            setHTML(body, `<div class="lineup-status">🔒 ההרכבים ייחשפו 90 דקות לפני השריקה<br><span class="lineup-lock-timer" id="lineupLockText">${lineupLockText(m)}</span></div>`);
            return;
        }
        const status = getMatchStatus(m);
        const scoreboard = status.isEnded || status.isLive ? resultBoardHTML(m, status, []) : "";
        if (!hasData && (!cache || cache.loading)) {
            setHTML(body, scoreboard + '<div class="lineup-status">⏳ טוען הרכבים…</div>');
            return;
        }
        if (!hasData && cache.error) {
            setHTML(body, scoreboard + `<div class="lineup-status">⚠️ לא הצלחתי לטעון הרכבים<br><span style="font-size:0.72rem;opacity:0.85;">${lineupEsc(cache.error)}</span></div>`);
            return;
        }
        const d = cache?.data || {};
        if (!hasData) {
            const msg = d.reason === "no_fixture"
                ? "לא נמצא משחק תואם לתאריך הזה"
                : "ההרכבים טרם פורסמו — העמוד מתעדכן אוטומטית";
            setHTML(body, scoreboard + `<div class="lineup-status">⏳ ${msg}</div>`);
            return;
        }
        const teams = orderedLineupTeams(m);
        const st = status;
        const expanded = [...body.querySelectorAll("details")].map(el => el.open);
        setHTML(body, resultBoardHTML(m, st, teams) + pitchesHTML(m, teams, "overlay") + (st.isLive && window.matchLivePanel ? window.matchLivePanel(m) : ""));
        body.querySelectorAll("details").forEach((el,i) => el.open = !!expanded[i]);
    }
    function openLineup(matchId) {
        const m = currentMatches.find(x => x.id === matchId);
        if (!m) return;
        if (playerMatchDialog.open) playerMatchDialog.close();
        lineupOpenMatchId = matchId;
        document.getElementById("lineupOverlay").classList.add("show");
        document.getElementById("lineupTitle").innerText = m.match;
        renderLineupBody(m);
        if (lineupPollTimer) clearInterval(lineupPollTimer);
        const ko = matchKickoff(m);
        const needsFetch = !(lineupCache[m.id] && lineupCache[m.id].data && lineupCache[m.id].data.available);
        // every match that already kicked off — even seasons ago — has lineups to load
        if (!ko || (ko - LINEUP_WINDOW_MS) <= Date.now()) {
            if (needsFetch && !pitchUpdates.get(m.id)?.teams.length) loadLineups(m);
            window.xaLoadEvents?.(m);
        }
        lineupPollTimer = setInterval(() => {
            const cur = currentMatches.find(x => x.id === lineupOpenMatchId);
            if (!cur) return;
            const c = lineupCache[cur.id];
            if (c?.data?.available || pitchUpdates.get(cur.id)?.teams.length) return;
            const k = matchKickoff(cur);
            if (k && (k - LINEUP_WINDOW_MS) > Date.now()) return;
            if (k && Date.now() - k > 4 * 3600000) return; // משחק שהסתיים מזמן — אין על מה להמתין
            loadLineups(cur);
        }, 90000);
    }
    function closeLineup() {
        if (playerMatchDialog.open) playerMatchDialog.close();
        lineupOpenMatchId = "";
        document.getElementById("lineupOverlay").classList.remove("show");
        if (lineupPollTimer) { clearInterval(lineupPollTimer); lineupPollTimer = null; }
    }
    function tickLineupOverlay() {
        if (!lineupOpenMatchId) return;
        const m = currentMatches.find(x => x.id === lineupOpenMatchId);
        const el = document.getElementById("lineupLockText");
        if (m && el) el.innerText = lineupLockText(m);
    }
    /* טעינה מקדימה של ההרכב הקרוב — כדי שפתיחת ההרכב תהיה מיידית עם כל התמונות */
    async function prefetchNextLineup() {
        const now = Date.now();
        const next = currentMatches
            .map(m => ({ m, ko: matchKickoff(m) }))
            .filter(x => x.ko && x.ko > now - 4 * 3600000)
            .sort((a, b) => Math.abs(a.ko - now) - Math.abs(b.ko - now))[0];
        if (!next) return;
        const flag = `lineupPrefetch_${next.m.id}`;
        try {
            if (sessionStorage.getItem(flag)) return;
            sessionStorage.setItem(flag, "1");
        } catch (e) {}
        if (lineupCache[next.m.id] && lineupCache[next.m.id].data) return;
        try { await loadLineups(next.m); } catch (e) {}
    }
    function autoCheckLineups() {
        const now = Date.now();
        if (!currentMatches.length || now - lastLineupAutoCheck < 30000) return;
        lastLineupAutoCheck = now;
        currentMatches.forEach(m => {
            const ko = matchKickoff(m);
            if (!ko || getMatchStatus(m).isEnded) return;
            const delta = ko - now;
            if (delta > LINEUP_WINDOW_MS || delta < -3 * 3600000) return;
            const c = lineupCache[m.id];
            if (c?.loading || c?.data?.available || pitchUpdates.get(m.id)?.teams.length) return;
            loadLineups(m);
        });
    }

    /* ============================================================
       INIT + TEST
       ============================================================ */
    fetchLiveScores();
    scheduleNextFetch();
    loadFixtureBadges();
    /* רענון תאריכים ושעות מהפיד כל 20 דקות ובכל חזרה לאתר */

    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadFixtureBadges(); });
    (function refreshFixtures() {
        const near = currentMatches.some(m => Math.abs(matchKickoff(m) - Date.now()) < 4 * 3600000);
        setTimeout(async () => { if (!document.hidden) await loadFixtureBadges(); refreshFixtures(); }, near ? 15000 : 180000);
    })();
    setTimeout(prefetchNextLineup, 2500);
    // expose test helper
    window.testApi = async function() {
        console.log("=== TEST: TheSportsDB eventsnext for Real Madrid ===");
        try {
            const res = await fetch(TSDB_NEXT_URL, { cache: "no-store" });
            console.log("HTTP", res.status);
            const json = await res.json();
            const events = (json && json.events) || [];
            console.log(`✅ ${events.length} events returned`);
            events.forEach(e => {
                const live = isEventLive(e);
                console.log(`${live ? '🔴 LIVE' : '📅'} ${e.strHomeTeam} ${e.intHomeScore ?? 0}-${e.intAwayScore ?? 0} ${e.strAwayTeam} | ${e.strStatus} | ${e.dateEvent} ${e.strTime}`);
            });
            console.log("Live matches:", events.filter(isEventLive).length);
            console.log("Upcoming matches:", events.filter(e => !isEventLive(e)).length);
        } catch (err) {
            console.error("❌ TEST FAILED:", err);
        }
    };
    window.testApi();
</script>

<script>
/* ===== תוספות: סרגל סגירת ניחושים · התראת "ההרכב יצא" · פס משחק חי עם ניחושי כולם וציר זמן ===== */
(function () {
  "use strict";
  var LOCK_AFTER_MS = 15 * 60000;              /* הניחושים נסגרים 15 דק׳ אחרי השריקה (כמו isPredictionLocked) */
  var CSS = ".xa-bar{margin:10px 12px;padding:10px 14px;border-radius:14px;border:1px solid var(--gold-accent,#d4a32e);background:rgba(11,45,39,.92);color:var(--text-main,#f0ede6);cursor:pointer;direction:rtl;text-align:right;font-family:var(--font-body,'Assistant',sans-serif);}" +
    ".xa-bar.xa-urgent{border-color:#e2464a;background:rgba(60,18,20,.92);}" +
    ".xa-bar b{color:#f4d47c;} .xa-bar .xa-t{font-family:'JetBrains Mono',monospace;font-weight:800;color:#f4d47c;}" +
    ".xa-bar .xa-sub{font-size:.82rem;color:var(--text-muted,#8fa89e);margin-top:4px;line-height:1.5;}" +
    ".xa-live{margin:10px 12px;direction:rtl;font-family:var(--font-body,'Assistant',sans-serif);}" +
    ".xa-card{border:1px solid var(--border-color,#123830);background:rgba(11,45,39,.92);border-radius:16px;padding:12px;margin-bottom:10px;color:var(--text-main,#f0ede6);}" +
    ".xa-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:8px;}" +
    ".xa-score{font-family:'JetBrains Mono',monospace;color:#f4d47c;font-size:1.1rem;}" +
    ".xa-chips{display:flex;flex-wrap:wrap;gap:6px;}" +
    ".xa-chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;background:rgba(5,22,19,.9);border:1px solid var(--border-color,#123830);font-size:.85rem;}" +
    ".xa-chip i,.xa-score{white-space:nowrap;direction:ltr;unicode-bidi:isolate}.xa-chip.xa-direction{background:#80450e}.xa-chip.xa-miss{background:#70292d}.xa-chip i{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text-muted,#8fa89e);}" +
    ".xa-chip.xa-ok{border-color:#2fb36b;background:rgba(20,70,45,.85);} .xa-chip.xa-ok i{color:#7dffb0;}" +
    ".xa-note{font-size:.78rem;color:var(--text-muted,#8fa89e);margin-top:8px;}" +
    ".xa-btn{margin-top:10px;width:100%;border:1px solid var(--gold-accent,#d4a32e);background:none;color:#f4d47c;border-radius:10px;padding:8px;font-weight:700;cursor:pointer;font-family:inherit;}" +
    ".xa-ev{margin-top:10px;border-top:1px solid var(--border-color,#123830);padding-top:8px;}" +
    ".xa-ev div{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:.88rem;}" +
    ".xa-ev .xa-min{flex:0 0 42px;font-family:'JetBrains Mono',monospace;color:#f4d47c;font-weight:700;}";
  var timelineFailures = new Set();
  var openEvents = {}, evCache = {}, evBusy = {}, lastLive = "", lastBar = "";
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function ready() { return typeof currentMatches !== "undefined" && typeof currentData !== "undefined" && typeof activePlayersList !== "undefined" && Array.isArray(currentMatches) && currentMatches.length; }
  function pad(n) { return String(n).padStart(2, "0"); }
  function clock(ms) { var t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor((t % 86400) / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return (d ? d + " ימים " : "") + pad(h) + ":" + pad(m) + ":" + pad(s); }
  function guess(m, p) { return normalizeScoreStr(currentData["pred_" + m.id + "_" + p]); }
  function ensureStyle() { if (document.getElementById("xaStyle")) return; var st = document.createElement("style"); st.id = "xaStyle"; st.textContent = CSS; document.head.appendChild(st); }
  function slot(id, afterEl, beforeEl) {
    var el = document.getElementById(id); if (el) return el;
    el = document.createElement("div"); el.id = id;
    if (afterEl && afterEl.parentNode) afterEl.parentNode.insertBefore(el, afterEl.nextSibling);
    else if (beforeEl && beforeEl.parentNode) beforeEl.parentNode.insertBefore(el, beforeEl);
    else return null;
    return el;
  }

  /* ---- 1. סרגל "הניחושים נסגרים בעוד…" ---- */
  function nextDeadline() {
    var now = Date.now(), best = null;
    currentMatches.forEach(function (m) {
      if (!m) return;
      var ko = matchKickoff(m); if (!ko) return;
      var lock = ko + LOCK_AFTER_MS;
      if (lock <= now || lock - now > 72 * 3600000) return;
      if (isPredictionLocked(m) || getMatchStatus(m).isEnded) return;
      if (!best || lock < best.lock) best = { m: m, lock: lock };
    });
    return best;
  }
  function missingFor(m) { return activePlayersList.filter(function (p) { return !guess(m, p); }); }
  function renderBar() {
    var el = slot("xaBar", null, document.getElementById("filterBar")); if (!el) return;
    var d = nextDeadline();
    if (!d) { if (lastBar !== "") { el.innerHTML = ""; lastBar = ""; } return; }
    var left = d.lock - Date.now(), miss = missingFor(d.m);
    var html = "<div class='xa-bar " + (left < 3600000 ? "xa-urgent" : "") + "' data-id='" + esc(d.m.id) + "'>⏳ הניחושים ל<b>" + esc(d.m.match) + "</b> נסגרים בעוד <span class='xa-t'>" + clock(left) + "</span>" +
      "<div class='xa-sub'>" + (miss.length ? "עוד לא ניחשו: " + miss.map(esc).join(", ") : "✅ כולם כבר ניחשו") + "</div></div>";
    if (html !== lastBar) {
      el.innerHTML = html; lastBar = html;
      var bar = el.firstChild;
      bar.addEventListener("click", function () { try { scrollToMatch(bar.getAttribute("data-id")); } catch (e) {} });
    }
  }
  function notifyDeadline() {
    if (typeof BlancosNotify === "undefined" || typeof notifiedPhases === "undefined") return;
    var d = nextDeadline(); if (!d) return;
    var left = d.lock - Date.now(), key = "deadline_" + d.m.id;
    if (left > 30 * 60000 || notifiedPhases.has(key)) return;
    var miss = missingFor(d.m); if (!miss.length) return;
    notifiedPhases.add(key); saveNotifiedPhases();
    BlancosNotify.show({ kind: "deadline", tag: key, title: "⏳ הניחושים נסגרים בקרוב", body: d.m.match + " — עוד לא ניחשו: " + miss.join(", ") });
  }

  /* ---- 2. התראה "ההרכב יצא" ---- */
  function notifyLineups() {
    if (typeof BlancosNotify === "undefined" || typeof notifiedPhases === "undefined" || typeof lineupCache === "undefined") return;
    var now = Date.now();
    currentMatches.forEach(function (m) {
      if (!m) return;
      var ko = matchKickoff(m); if (!ko) return;
      if (ko - now > LINEUP_WINDOW_MS || now - ko > 3 * 3600000) return;
      var c = lineupCache[m.id], key = "lineup_" + m.id;
      if (!(c && c.data && c.data.available) || notifiedPhases.has(key)) return;
      notifiedPhases.add(key); saveNotifiedPhases();
      BlancosNotify.show({ kind: "lineup", tag: key, title: "📋 ההרכב יצא!", body: realFirstLabel(m) + " — לחץ על ״הרכבים״ כדי לראות מי פותח" });
    });
  }

  /* ---- 3. פס משחק חי: ניחושי כולם (ירוק = צודק כרגע) + ציר זמן ---- */
  function liveMatches() { return liveLineupMatches(); }
  function eventIcon(e) {
    var t = String(e.type || "").toLowerCase(), c = String(e.card || e.cardType || "").toLowerCase();
    if (t.indexOf("goal") >= 0) return "⚽";
    if (t.indexOf("card") >= 0) return c.indexOf("red") >= 0 ? "🟥" : "🟨";
    if (t.indexOf("sub") >= 0) return "🔄";
    if (t.indexOf("var") >= 0) return "📺";
    return "";
  }
  function chipsHTML(m,actual) {
    return "<div class='xa-chips'>" + activePlayersList.map(p => {
      const g = guess(m,p), pts = g && actual ? predictionPoints(actual,g) : null;
      const cls = pts === 3 ? "xa-ok" : pts === 1 ? "xa-direction" : pts === 0 ? "xa-miss" : "";
      return "<span class='xa-chip "+cls+"'>"+esc(p)+" <i>"+esc(g || "—")+"</i>"+(pts === null ? "" : " · "+pts)+"</span>";
    }).join("") + "</div>";
  }
  window.matchLivePanel = m => chipsHTML(m,liveActualFor(m)) + eventsHTML(m.id);
  function eventsHTML(id) {
    var list = evCache[id];
    if (!list && timelineFailures.has(id)) return "ציר הזמן אינו זמין — מנסה שוב";
    if (list === undefined) return "<div class='xa-ev'><div>⏳ טוען ציר זמן…</div></div>";
    if (!list.length) return "<div class='xa-ev'><div>עדיין אין אירועים (גולים, כרטיסים, חילופים) — מתעדכן אוטומטית</div></div>";
    return "<div class='xa-ev'>" + list.map(function (e) { return "<div><span class='xa-min'>" + esc(e.min) + "</span><span>" + e.icon + " " + esc(e.text) + "</span></div>"; }).join("") + "</div>";
  }
  const eventFetchTimes = new Map();
  function loadEvents(m, force = false) {
    const old = pitchUpdates.get(m.id);
    if (evBusy[m.id]) return evBusy[m.id];
    if (!force && (old?.status?.finished || Date.now() - (eventFetchTimes.get(m.id) || 0) < 12000)) return Promise.resolve();
    eventFetchTimes.set(m.id, Date.now());
    matchDetailsStates.set(m.id, "loading");
    updatePlayerMatchDialog();
    const request = fetchMatchDetails(m).then(function (result) {
      if (!result) throw new Error("no matching fixture");
      const updates = MatchLineups.build(result.data);
      updates.matchId = result.id;
      pitchUpdates.set(m.id, updates);
      matchDetailsStates.set(m.id, "ready");
      timelineFailures.delete(m.id);
      const ev = updates.events;
      evCache[m.id] = (Array.isArray(ev) ? ev : []).map(function (e) {
        var icon = eventIcon(e); if (!icon) return null;
        var name = e.nameStr || (e.player && e.player.name) || e.fullName || "";
        var min = (e.timeStr != null ? e.timeStr : e.time);
        if (e.overloadTime) min = min + "+" + e.overloadTime;
        var text = name;
        if (icon === "🔄" && e.swap && e.swap[0] && e.swap[1]) text = (e.swap[0].name || "") + " ⟵ " + (e.swap[1].name || "");
        if (icon === "⚽" && e.homeScore != null && e.awayScore != null) {
          var [_a, _b] = e.newScore || [e.homeScore, e.awayScore];
          if (Number(updates.scoreTeams?.[0]?.id) !== 8633) { var _t = _a; _a = _b; _b = _t; }
          text += " (" + _a + "-" + _b + ")";
        }
        return { min: min + "′", icon: icon, text: text };
      }).filter(Boolean).reverse();
    }).catch(function () { matchDetailsStates.set(m.id, "error"); timelineFailures.add(m.id); }).finally(function () {
      delete evBusy[m.id];
      renderLive(false);
      if (lineupOpenMatchId === m.id) renderLineupBody(m);
      if (ratingsMatchId === "local:" + m.id) renderPlayerRatings();
      updatePlayerMatchDialog();
    });
    evBusy[m.id] = request;
    return request;
  }
  /* תצוגה מקדימה של הפס שמתחת לכרטיס הלייב (ניחושי כולם) — באותו מבנה כמו במשחק אמיתי, עם ניחושים לדוגמה */
  function demoStripHTML() {
    var sample = ["2-1", "1-0", "3-1", "2-1", "2-0", "1-1", "0-0", "3-0"], actual = "2-1";
    var chips = activePlayersList.map(function (p, i) {
      var g = sample[i % sample.length], ok = g === actual;
      return "<span class='xa-chip " + (ok ? "xa-ok" : "") + "'>" + (ok ? "✅ " : "") + esc(p) + " <i>" + g + "</i></span>";
    }).join("");
    var right = activePlayersList.filter(function (p, i) { return sample[i % sample.length] === actual; });
    var note = right.length ? "צודקים כרגע: " + right.map(esc).join(", ") : "אף אחד לא צודק כרגע";
    return "<div class='xa-card'><div class='xa-h'><span>📊 מה כולם ניחשו — ריאל מדריד - ברצלונה</span><span class='xa-score'>" + actual + "</span></div>" +
      "<div class='xa-chips'>" + chips + "</div><div class='xa-note'>" + note + " · ריאל משמאל, יריבה מימין</div>" +
      "<button class='xa-btn' type='button' style='cursor:default'>📜 ציר זמן של המשחק</button></div>";
  }
  function renderLive(force) {
    var el = slot("xaLive", document.getElementById("liveMatchWidget"), document.getElementById("playersBar")); if (!el) return;
    el.className = "xa-live";
    var ms = liveMatches();
    var html = ((typeof liveDemoOn !== "undefined" && liveDemoOn) ? demoStripHTML() : "") + ms.map(function (m) {
      if (evCache[m.id] === undefined && !timelineFailures.has(m.id)) loadEvents(m);
      var actual = liveActualFor(m);
      var chips = chipsHTML(m,actual);
      var right = actual ? activePlayersList.filter(function (p) { return guess(m, p) === actual; }) : [];
      var note = actual ? (right.length ? "צודקים כרגע: " + right.map(esc).join(", ") : "אף אחד לא צודק כרגע") : "";
      var open = !!openEvents[m.id];
      return livePitchHTML(m) + "<div class='xa-card'><div class='xa-h'><span>📊 מה כולם ניחשו — " + esc(m.match) + "</span><span class='xa-score'>" + (actual || "") + "</span></div>" +
        chips + "<div class='xa-note'>" + note + " · ריאל משמאל, יריבה מימין</div>" +
        "<button class='xa-btn' data-ev='" + esc(m.id) + "'>" + (open ? "🔽 הסתר ציר זמן" : "📜 ציר זמן של המשחק") + "</button>" + (open ? eventsHTML(m.id) : "") + "</div>";
    }).join("");
    if (!force && html === lastLive) return;
    const expanded = [...el.querySelectorAll(".live-pitch details")].map(d => d.open);
    lastLive = html; el.innerHTML = html;
    el.querySelectorAll(".live-pitch details").forEach((d, i) => { d.open = !!expanded[i]; });
    Array.prototype.forEach.call(el.querySelectorAll("[data-ev]"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-ev"); openEvents[id] = !openEvents[id];
        if (openEvents[id]) { var m = liveLineupMatches().find(x => String(x.id) === id); if (m) loadEvents(m); }
        renderLive(true);
      });
    });
  }
  window.xaLoadEvents = function (m, force = false) { return loadEvents(m, force); };
  function refreshOpenEvents() {
    if (document.hidden) return; var seen = {};
    liveMatches().forEach(function (m) { seen[m.id] = 1; loadEvents(m); });
    if (typeof lineupOpenMatchId !== "undefined" && lineupOpenMatchId && !seen[lineupOpenMatchId]) {
      var mm = currentMatches.filter(function (x) { return x && x.id === lineupOpenMatchId; })[0];
      if (mm && (!matchKickoff(mm) || matchKickoff(mm) - LINEUP_WINDOW_MS <= Date.now())) loadEvents(mm);
    }
  }

  function tick() { try { if (!ready()) return; ensureStyle(); renderBar(); renderLive(false); } catch (e) { /* לא מפילים את האתר */ } }
  function slow() { try { if (!ready()) return; notifyLineups(); notifyDeadline(); } catch (e) {} }
  setInterval(tick, 1000);
  window.xaRefresh = function () { tick(); };
  setInterval(slow, 30000);
  setInterval(function () { try { if (ready()) refreshOpenEvents(); } catch (e) {} }, 15000);
  setTimeout(slow, 4000);
})();
</script>
<script>
/* זרימת המשחק: הרכבים פורסמו -> הפופאפ נפתח במצב "המתנה לשריקה" -> מעבר אוטומטי לעדכונים חיים */
(function () {
  function k(m, ph) { return "flow_" + ph + "_" + m.id; }
  function seen(key) { try { return localStorage.getItem(key) === "1"; } catch (e) { return false; } }
  function mark(key) { try { localStorage.setItem(key, "1"); } catch (e) {} }
  var evLoadedFor = "";
  function activeMatch() {
    var now = Date.now(), best = null;
    currentMatches.forEach(function (m) {
      if (!m) return; var ko = matchKickoff(m); if (!ko) return;
      if (now < ko - LINEUP_WINDOW_MS || now > ko + 3 * 3600000 || getMatchStatus(m).isEnded) return;
      if (!best || ko < best.ko) best = { m: m, ko: ko };
    });
    return best && best.m;
  }
  function tick() {
    try {
      if (typeof currentMatches === "undefined" || !currentMatches.length || typeof lineupCache === "undefined") return;
      var btn = document.getElementById("hnmLineupBtn"), m = activeMatch();
      if (!m) { if (btn) btn.style.display = "none"; return; }
      var c = lineupCache[m.id], has = !!(c && c.data && c.data.available);
      if (btn) btn.style.display = has ? "" : "none";
      if (!has || document.hidden) return;
      var st = getMatchStatus(m), key = k(m, st.isLive ? "live" : "lineup");
      if (!seen(key)) { mark(key); if (lineupOpenMatchId !== m.id) openLineup(m.id); }
      if (lineupOpenMatchId === m.id) {
        renderLineupBody(m);
        if ((st.isLive || st.isEnded) && evLoadedFor !== m.id && window.xaLoadEvents) { evLoadedFor = m.id; window.xaLoadEvents(m); }
      } else evLoadedFor = "";
    } catch (e) {}
  }
  setInterval(tick, 3000);
})();
</script>
