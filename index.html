<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת הניחושים - ריאל מדריד 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --rm-dark-bg: #0b132b;
            --rm-card-bg: #1c2541;
            --rm-navy: #001c58;
            --rm-blue: #00529f;
            --rm-light-blue: #3a86ff;
            --rm-white: #ffffff;
            --rm-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --clasico-red: #ef4444;
            --clasico-bg: rgba(239, 68, 68, 0.15);
            --clasico-border: rgba(239, 68, 68, 0.4);
            --success-green: #10b981;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }

        body {
            background-color: var(--rm-dark-bg);
            background-image: 
                radial-gradient(circle at 50% -10%, #1c2541 0%, transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(58, 134, 255, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(180deg, var(--rm-navy) 0%, #0b132b 100%);
            color: var(--rm-white);
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-bottom: 3px solid var(--rm-blue);
            position: relative;
            overflow: hidden;
        }

        /* סמל ריאל מדריד ברקע ה-Header */
        header::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background-image: url('https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.06;
            pointer-events: none;
        }

        .header-title {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--rm-white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }
        
        .header-subtitle {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .add-player-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }
        
        .add-player-input {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--rm-border);
            background: rgba(11, 19, 43, 0.8);
            color: var(--rm-white);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        
        .add-player-input:focus {
            border-color: var(--rm-light-blue);
            box-shadow: 0 0 8px rgba(58, 134, 255, 0.3);
        }
        
        .btn-add-player {
            background: var(--rm-blue);
            color: var(--rm-white);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-add-player:hover {
            background: var(--rm-light-blue);
            transform: translateY(-1px);
        }

        .players-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: -20px auto 30px;
            max-width: 1200px;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }
        
        .player-badge {
            background: #1c2541;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--rm-border);
            color: var(--rm-white);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        
        .player-badge:hover {
            border-color: var(--rm-light-blue);
            transform: translateY(-2px);
        }
        
        .player-badge .pts {
            background: var(--rm-blue);
            color: var(--rm-white);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Teko', sans-serif;
        }
        
        .remove-player-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .remove-player-btn:hover {
            background: var(--clasico-red);
            color: var(--rm-white);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--rm-card-bg);
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--rm-border);
        }
        
        .info-note { font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        
        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        
        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 14px;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-clear:hover { background: var(--clasico-red); color: var(--rm-white); }

        .table-card { 
            background: var(--rm-card-bg); 
            border-radius: 14px; 
            box-shadow: var(--shadow-md); 
            overflow: hidden; 
            border: 1px solid var(--rm-border); 
        }
        
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.95rem; }
        
        thead th { 
            background-color: var(--rm-navy); 
            color: var(--rm-white); 
            padding: 16px 12px; 
            font-weight: 700; 
            border-bottom: 2px solid var(--rm-blue); 
        }
        
        thead th.player-header { background-color: #151d35; min-width: 85px; }
        tbody tr { border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.2s; }
        tbody tr:hover { background-color: rgba(58, 134, 255, 0.05); }
        
        td.match-cell { text-align: right; padding: 16px 18px; font-weight: 700; color: var(--rm-white); white-space: nowrap; }
        td.date-cell { color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; padding: 16px 10px; }
        
        tr.clasico-row { background-color: var(--clasico-bg) !important; border-bottom: 1px solid var(--clasico-border); }
        tr.clasico-row td.match-cell { color: #fca5a5; }
        
        .clasico-badge { 
            background: var(--clasico-red); 
            color: var(--rm-white);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px; 
            margin-right: 8px;
            font-weight: 700;
            display: inline-block;
        }

        input.score-input {
            width: 55px;
            text-align: center;
            padding: 6px 4px;
            border: 1px solid var(--rm-border);
            border-radius: 6px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--rm-white);
            background: rgba(11, 19, 43, 0.6);
            direction: ltr;
            font-family: 'Teko', sans-serif;
            transition: all 0.2s;
        }
        
        input.score-input:focus {
            outline: none;
            border-color: var(--rm-light-blue);
            background: rgba(11, 19, 43, 0.9);
        }
        
        input.actual-score {
            border-color: var(--rm-blue);
            background: rgba(0, 82, 159, 0.2);
            color: var(--rm-white);
        }

        .winners-grid { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 4px; max-width: 320px; margin: 0 auto; }
        
        .winner-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--rm-border);
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        
        .winner-chip:hover { border-color: var(--rm-light-blue); color: var(--rm-white); }
        .winner-chip input { display: none; }
        
        .winner-chip.active { 
            background: var(--rm-blue); 
            color: var(--rm-white);
            font-weight: 700;
            border-color: var(--rm-light-blue);
        }
        .winner-chip.active::before { content: "✓"; font-weight: 900; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            ⚽ <span>ליגת הניחושים</span> - ריאל מדריד 2026/27
        </div>

        <div class="add-player-box">
            <input type="text" id="newPlayerName" class="add-player-input" placeholder="שם שחקן חדש...">
            <button class="btn-add-player" onclick="addNewPlayer()">+ הוסף שחקן</button>
        </div>
    </header>

    <div class="players-bar" id="playersBar"></div>

    <div class="container">
        <div class="actions-bar">
            <div class="info-note">
                🌐 <b>סנכרון ענן פעיל:</b> כל שינוי שתעשה יתעדכן מיד אצל כל החברים!
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="status-badge" id="saveStatus">☁️ מחובר לשרת</div>
                <button class="btn-clear" onclick="resetAllData()">🗑️ איפוס נתונים</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead><tr id="tableHeaderRow"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // === FIREBASE CONFIGURATION ===
        const firebaseConfig = {
            apiKey: "AIzaSyCNkYBoD6fBQ-uxmn8tj78yS96a9ipc-5w",
            authDomain: "hablnacos.firebaseapp.com",
            databaseURL: "https://hablnacos-default-rtdb.firebaseio.com",
            projectId: "hablnacos",
            storageBucket: "hablnacos.appspot.com",
            messagingSenderId: "1098555243394",
            appId: "1:1098555243394:web:e00bf2adcf538bd1b97087"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const DEFAULT_PLAYERS = ["ניר", "ליאור", "אבירם", "שון", "חן", "מאור"];
        let currentPlayers = [];
        let currentData = {};

        const matches = [
            { match: "אספניול - ריאל מדריד", date: "22/08/2026", defaultActual: "1-2" },
            { match: "ריאל מדריד - ריאל סוסיאדד", date: "26/08/2026" },
            { match: "ריאל מדריד - מלאגה", date: "30/08/2026" },
            { match: "ריאל בטיס - ריאל מדריד", date: "04/09/2026" },
            { match: "ריאל מדריד - ראיו ואייקאנו", date: "13/09/2026" },
            { match: "אלצ'ה - ריאל מדריד", date: "16/09/2026" },
            { match: "אתלטיקו מדריד - ריאל מדריד", date: "20/09/2026" },
            { match: "ריאל מדריד - ויאריאל", date: "11/10/2026" },
            { match: "ריאל מדריד - סביליה", date: "18/10/2026" },
            { match: "ברצלונה - ריאל מדריד", date: "25/10/2026", isClasico: true },
            { match: "ראסינג סנטנדר - ריאל מדריד", date: "01/11/2026" },
            { match: "ולנסיה - ריאל מדריד", date: "08/11/2026" },
            { match: "ריאל מדריד - סלטה ויגו", date: "22/11/2026" },
            { match: "ריאל מדריד - דפורטיבו אלאבס", date: "29/11/2026" },
            { match: "אתלטיק בילבאו - ריאל מדריד", date: "06/12/2026" },
            { match: "ריאל מדריד - אוססונה", date: "13/12/2026" },
            { match: "דפורטיבו לה קורוניה - ריאל מדריד", date: "20/12/2026" },
            { match: "ריאל מדריד - חטאפה", date: "03/01/2027" },
            { match: "ריאל מדריד - לבאנטה", date: "10/01/2027" },
            { match: "מלאגה - ריאל מדריד", date: "17/01/2027" },
            { match: "ריאל מדריד - ריאל בטיס", date: "24/01/2027" },
            { match: "ראיו ואייקאנו - ריאל מדריד", date: "31/01/2027" },
            { match: "ריאל סוסיאדד - ריאל מדריד", date: "07/02/2027" },
            { match: "ריאל מדריד - אתלטיק בילבאו", date: "14/02/2027" },
            { match: "סביליה - ריאל מדריד", date: "21/02/2027" },
            { match: "ריאל מדריד - ולנסיה", date: "28/02/2027" },
            { match: "ויאריאל - ריאל מדריד", date: "06/03/2027" },
            { match: "ריאל מדריד - אספניול", date: "13/03/2027" },
            { match: "סלטה ויגו - ריאל מדריד", date: "20/03/2027" },
            { match: "ריאל מדריד - אתלטיקו מדריד", date: "03/04/2027" },
            { match: "אוססונה - ריאל מדריד", date: "10/04/2027" },
            { match: "חטאפה - ריאל מדריד", date: "17/04/2027" },
            { match: "ריאל מדריד - אלצ'ה", date: "20/04/2027" },
            { match: "לבאנטה - ריאל מדריד", date: "01/05/2027" },
            { match: "ריאל מדריד - ברצלונה", date: "08/05/2027", isClasico: true },
            { match: "ריאל מדריד - ראסינג סנטנדר", date: "15/05/2027" },
            { match: "דפורטיבו אלאבס - ריאל מדריד", date: "22/05/2027" },
            { match: "ריאל מדריד - דפורטיבו לה קורוניה", date: "29/05/2027" }
        ];

        db.ref('league_data').on('value', snapshot => {
            const data = snapshot.val() || {};
            currentPlayers = data.players || DEFAULT_PLAYERS;
            currentData = data.predictions || {};

            renderUI();
        });

        function saveToCloud() {
            db.ref('league_data').set({
                players: currentPlayers,
                predictions: currentData
            });
        }

        function addNewPlayer() {
            const input = document.getElementById("newPlayerName");
            const name = input.value.trim();
            if (!name) return;
            if (currentPlayers.includes(name)) { alert("שחקן קיים!"); return; }

            currentPlayers.push(name);
            input.value = "";
            saveToCloud();
        }

        function removePlayer(name) {
            if (confirm(`להסיר את ${name}?`)) {
                currentPlayers = currentPlayers.filter(p => p !== name);
                saveToCloud();
            }
        }

        function onInputSave(key, value) {
            currentData[key] = value;
            db.ref(`league_data/predictions/${key}`).set(value);
        }

        function onWinnerToggle(idx, player, isChecked) {
            const key = `winners_${idx}`;
            let winners = currentData[key] || [];

            if (isChecked) {
                if (!winners.includes(player)) winners.push(player);
            } else {
                winners = winners.filter(p => p !== player);
            }

            currentData[key] = winners;
            db.ref(`league_data/predictions/${key}`).set(winners);
        }

        function updateScores() {
            const scores = {};
            currentPlayers.forEach(p => scores[p] = 0);

            matches.forEach((_, idx) => {
                const winners = currentData[`winners_${idx}`] || [];
                winners.forEach(player => {
                    if (scores[player] !== undefined) scores[player]++;
                });
            });

            currentPlayers.forEach(player => {
                const el = document.getElementById(`score_${player}`);
                if (el) el.innerText = `${scores[player]} נק'`;
            });
        }

        function renderUI() {
            document.getElementById("playersBar").innerHTML = currentPlayers.map((player, index) => `
                <div class="player-badge">
                    <button class="remove-player-btn" onclick="removePlayer('${player}')">×</button>
                    ${index === 0 ? '👑' : '⭐'} ${player}
                    <span class="pts" id="score_${player}">0 נק'</span>
                </div>
            `).join("");

            document.getElementById("tableHeaderRow").innerHTML = `
                <th style="text-align: right; padding-right: 20px;">משחק</th>
                <th>תאריך</th>
                <th>תוצאה בפועל</th>
                <th style="min-width: 260px;">מי צדק?</th>
                ${currentPlayers.map(p => `<th class="player-header">${p}</th>`).join("")}
            `;

            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            matches.forEach((m, idx) => {
                const tr = document.createElement("tr");
                if (m.isClasico) tr.classList.add("clasico-row");

                const savedActual = currentData[`actual_${idx}`] !== undefined ? currentData[`actual_${idx}`] : (m.defaultActual || "");
                const savedWinners = currentData[`winners_${idx}`] || [];

                const winnersHTML = currentPlayers.map(player => {
                    const isChecked = savedWinners.includes(player);
                    return `
                        <label class="winner-chip ${isChecked ? 'active' : ''}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="onWinnerToggle('${idx}', '${player}', this.checked)">
                            ${player}
                        </label>
                    `;
                }).join("");

                const predictionsHTML = currentPlayers.map(player => {
                    const savedPred = currentData[`pred_${idx}_${player}`] || "";
                    return `
                        <td>
                            <input type="text" class="score-input" value="${savedPred}" placeholder="-" onchange="onInputSave('pred_${idx}_${player}', this.value)">
                        </td>
                    `;
                }).join("");

                tr.innerHTML = `
                    <td class="match-cell">${m.isClasico ? '<span class="clasico-badge">אל קלאסיקו</span>' : ''}${m.match}</td>
                    <td class="date-cell">${m.date}</td>
                    <td><input type="text" class="score-input actual-score" value="${savedActual}" placeholder="0-0" onchange="onInputSave('actual_${idx}', this.value)"></td>
                    <td><div class="winners-grid">${winnersHTML}</div></td>
                    ${predictionsHTML}
                `;
                tbody.appendChild(tr);
            });

            updateScores();
        }

        function resetAllData() {
            if (confirm("איפוס מוחלט של כל הנתונים בענן?")) {
                db.ref('league_data').remove();
            }
        }
    </script>
</body>
</html>
