            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'triangle';

    function matchTeamPair(m) {

        return [parts[0], parts[1]].sort().join("|");

        const toRemove = [];

            if (arr.length < 2) return;

    function applyAutoScores() {

    function updateHeaderCountdownWidget() {
        const now = new Date().getTime();
        let nextMatch = null;
        for (let m of currentMatches) {
            if (!m) continue;
            const dateStr = currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
            const timeStr = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "22:00");
            if (!dateStr) continue;
            const matchTime = new Date(`${dateStr}T${timeStr}`).getTime();
            if (matchTime > now) { nextMatch = { ...m, calculatedTime: matchTime, timeStr }; break; }
        }
        const containerEl = document.getElementById("hnmTeamsContainer");
        const infoEl = document.getElementById("hnmInfo");
        const timerEl = document.getElementById("hnmTimer");
        if (!nextMatch) {
            if (containerEl) containerEl.innerHTML = "<span>אין משחקים קרובים כרגע</span>";
            if (infoEl) infoEl.innerText = "--/-- | --:--";
            if (timerEl) timerEl.innerHTML = "";
            targetNextMatchId = ""; return;
        }
        targetNextMatchId = nextMatch.id;
        const nb = predBadgesHTML(nextMatch), parts = String(nextMatch.match).split(" - ");
        if (containerEl) containerEl.innerHTML = `<div class="nmx-team">${nb.real}<b>${parts[0] || ""}</b></div><span class="nmx-vs">VS</span><div class="nmx-team">${nb.opp}<b>${parts[1] || ""}</b></div>`;

        let wd = ""; try { wd = new Date(`${dStr}T12:00`).toLocaleDateString("he-IL", { weekday: "long" }); } catch (e) {}
        if (infoEl) infoEl.innerText = `${wd} · ${formatDateDisplay(dStr)} · ${nextMatch.timeStr}`;
        const diff = nextMatch.calculatedTime - now;

        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);

    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }
    function getCompBadge(compName) {
        switch(compName) {
            case "ליגת האלופות": return `<span class="comp-badge comp-ucl">צ'מפיונס</span>`;
            case "גביע המלך": return `<span class="comp-badge comp-copa">גביע המלך</span>`;
            case "סופר קופה ספרדי": return `<span class="comp-badge comp-supercopa">סופר קופה</span>`;
            case "סופר קופה אירופי": return `<span class="comp-badge comp-supercup_eu">סופר קופה אירופי</span>`;
            default: return `<span class="comp-badge comp-la_liga">לה ליגה</span>`;

    /* ניקוד מדורג: 3 נק׳ על תוצאה מדויקת (או סימון ידני ב״מי צדק״), 1 נק׳ על כיוון נכון (ניצחון/תיקו/הפסד) */
    function scoreSign(s) { const p = s.split("-").map(Number); return Math.sign(p[0] - p[1]); }
    function pointsFor(m, player) {
        const actual = normalizeScoreStr(currentData[`actual_${m.id}`]);
        if ((currentData[`winners_${m.id}`] || []).includes(player)) return 3;
        if (!actual) return 0;
        const g = normalizeScoreStr(currentData[`pred_${m.id}_${player}`]);
        if (!g) return 0;
        if (g === actual) return 3;
        return scoreSign(g) === scoreSign(actual) ? 1 : 0;
    }
    function ptsClass(m, p) {
        const done = normalizeScoreStr(currentData[`actual_${m.id}`]) && getMatchStatus(m).isEnded;
        if (!done || !normalizeScoreStr(currentData[`pred_${m.id}_${p}`])) return ["", ""];
        const v = pointsFor(m, p);
        return [v === 3 ? "pts-3" : v === 1 ? "pts-1" : "pts-0", v ? `<b class="pts-chip">+${v}</b>` : ""];
    }
    function mcWeekday(d) { try { const x = new Date(`${d}T12:00`); return isNaN(x) ? "" : x.toLocaleDateString("he-IL", { weekday: "long" }); } catch (e) { return ""; } }
    function computeScores() {
        const scores = {};
        activePlayersList.forEach(p => scores[p] = 0);
        currentMatches.forEach(m => {
            if (!m || !normalizeScoreStr(currentData[`actual_${m.id}`]) && !(currentData[`winners_${m.id}`] || []).length) return;
            activePlayersList.forEach(p => scores[p] += pointsFor(m, p));
        });
        return scores;
    }
    /* ---- סטטיסטיקות עונה + תגים ---- */
    function seasonStats() {
        const done = currentMatches.filter(m => m && normalizeScoreStr(currentData[`actual_${m.id}`]) && getMatchStatus(m).isEnded);
        return activePlayersList.map(p => {
            let exact = 0, dir = 0, played = 0, streak = 0, best = 0, dirRun = 0, bestDir = 0, clasico = false;
            const form = [];
            done.forEach(m => {
                const pts = pointsFor(m, p), g = normalizeScoreStr(currentData[`pred_${m.id}_${p}`]);
                if (g) played++;
                if (pts === 3) { exact++; streak++; if (m.isClasico) clasico = true; } else streak = 0;
                if (pts >= 1) { if (pts === 1) dir++; dirRun++; } else dirRun = 0;
                best = Math.max(best, streak); bestDir = Math.max(bestDir, dirRun);
                form.push(pts);
            });
            const badges = [];
            if (best >= 2) badges.push(["🎯", "צלף — " + best + " מדויקים ברצף"]);
            if (bestDir >= 5) badges.push(["📈", "עקבי — " + bestDir + " משחקים ברצף עם נקודות"]);
            if (clasico) badges.push(["🔥", "מלך הקלאסיקו — צדק בקלאסיקו"]);
            if (played && played === done.length && done.length >= 3) badges.push(["🧱", "לא מפספס — ניחש בכל המשחקים"]);
            if (exact >= 5) badges.push(["💎", "נביא — " + exact + " תוצאות מדויקות"]);
            const total = exact * 3 + dir;
            return { p, exact, dir, played, total, acc: done.length ? Math.round(((exact + dir) / done.length) * 100) : 0, games: done.length, streak, form: form.slice(-5), badges };
        }).sort((a, b) => b.total - a.total || b.exact - a.exact);
    }

    function statsHTML() {

            </tbody></table></div>

    }
    /* מעבר בין מחשב לנייד (שינוי גודל חלון) — בונים מחדש רק את התצוגה הגלויה */
    try { window.matchMedia("(min-width: 1024px)").addEventListener("change", () => { try { renderUI(); } catch (e) {} }); } catch (e) {}
    function resetAllData() {
        if (confirm("איפוס כל הנתונים?")) db.ref('league_data').remove();
    }

    /* ============================================================
       LINEUPS — server function (API key stays server-side)
       ============================================================ */
    const LINEUP_WINDOW_MS = 90 * 60 * 1000;
    const lineupCache = {};
    let lineupOpenMatchId = "";
    let lineupPollTimer = null;
    let lastLineupAutoCheck = 0;

    /* ---- תמונות שחקנים ---- */
    const PHOTO_CACHE_KEY = "playerPhotos_v2";
    let playerPhotos = (() => {
        try { return JSON.parse(localStorage.getItem(PHOTO_CACHE_KEY) || "{}") || {}; } catch (e) { return {}; }
    })();
    function savePhotoCache() {
        try { localStorage.setItem(PHOTO_CACHE_KEY, JSON.stringify(playerPhotos)); } catch (e) {}
    }
    function photoKey(name) {
        return String(name || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }
    /* התאמת תמונה לפי שם גם כשהכתיב שונה בין המקורות (Vinícius Júnior / Vinicius Jr, שם מלא מול שם משפחה) —
       מחזירה תמונה רק כשיש התאמה אחת חד-משמעית, כדי לא להציג פנים של שחקן אחר */
    function photoTokens(n) { return photoKey(n).replace(/[.'’`]/g, "").split(/[\s\-]+/).filter(Boolean).map(t => t === "jr" ? "junior" : t === "sr" ? "senior" : t); }
    function photoLookup(name, pool) {
        pool = pool || playerPhotos;
        const key = photoKey(name);
        if (!key) return "";
        if (pool[key]) return pool[key];
        const tk = photoTokens(name);
        if (!tk.length) return "";
        const hits = new Set();
        for (const k in pool) {
            const kt = photoTokens(k);
            if (!kt.length) continue;
            const [sh, lg] = tk.length <= kt.length ? [tk, kt] : [kt, tk];
            const subset = sh.every(t => lg.includes(t)) && (sh.length > 1 || sh[0].length >= 4);
            const sameLast = tk.length > 1 && kt.length > 1 && tk[tk.length - 1] === kt[kt.length - 1] && tk[0][0] === kt[0][0];
            if (subset || sameLast) hits.add(pool[k]);
        }
        return hits.size === 1 ? [...hits][0] : "";
    }
    function photoInitials(name) {
        const t = String(name || "").trim().split(/\s+/).filter(Boolean);
        if (!t.length) return "";
        return (t.length > 1 ? t[0][0] + t[t.length - 1][0] : t[0].slice(0, 2)).toUpperCase();
    }
    /* תמונה שנכשלה בטעינה: ניסיון אחד לתמונה חלופית, ואם אין — עיגול עם ראשי תיבות במקום עיגול ריק */
    function photoFail(img) {
        const wrap = img.parentNode, nm = img.dataset.nm || "";
        if (!img.dataset.retry) {
            img.dataset.retry = "1";
            const alt = photoLookup(nm);
            if (alt && alt !== img.getAttribute("src")) { img.src = alt; return; }
        }
        img.style.opacity = 0;
        if (wrap && wrap.classList) wrap.classList.add("p-nophoto");
        if (!img.dataset.deep) {
            img.dataset.deep = "1";
            deepPhotoFor(nm, img.dataset.team || "").then(u => {
                if (!u) return;
                playerPhotos[photoKey(nm)] = u; savePhotoCache(); patchPlayerPhoto(nm);
            }).catch(() => {});
        }
    }
    /* ---- גיבוי למקורות תמונות: אם ההרכב/‏FotMob לא נותנים תמונה לשחקן, מחפשים ב-TheSportsDB ואז בוויקיפדיה.
       כל תוצאה נבדקת שהיא באמת נטענת, נשמרת במטמון, ובסוף — אם אין בשום מקום — ראשי תיבות במקום עיגול ריק. ---- */
    const PHOTO_MISS_KEY = "playerPhotoMiss_v1";
    const deepMiss = (() => { try { return JSON.parse(localStorage.getItem(PHOTO_MISS_KEY) || "{}") || {}; } catch (e) { return {}; } })();
    const deepBusy = {};
    let tsdbChain = Promise.resolve();
    function tsdbGate() { const p = tsdbChain.then(() => new Promise(r => setTimeout(r, 650))); tsdbChain = p; return p; }
    function imgOk(url) {
        return new Promise(res => {
            let done = false; const fin = v => { if (!done) { done = true; res(v); } };
            const im = new Image();
            im.onload = () => fin(true); im.onerror = () => fin(false);
            setTimeout(() => fin(false), 7000);
            im.src = url;
        });
    }
    async function tsdbSearch(q) {
        await tsdbGate();
        const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${TSDB_KEY}/searchplayers.php?p=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error("http " + res.status);
        const j = await res.json();
        return ((j && j.player) || []).filter(x => x && (!x.strSport || x.strSport === "Soccer"));
    }
    async function tsdbPhoto(name, team) {
        const tt = photoTokens(team || "");
        const teamOk = x => { const xt = photoTokens(x.strTeam || ""); return tt.length && xt.length && (tt.some(t => t.length > 3 && xt.includes(t)) || xt.some(t => t.length > 3 && tt.includes(t))); };
        let list = await tsdbSearch(String(name).trim());
        let pick = list.find(teamOk) || (list.length === 1 ? list[0] : null);
        if (!pick) {
            const toks = photoTokens(name).filter(t => t.length > 3).sort((a, b) => b.length - a.length);
            if (toks.length && photoTokens(name).length > 1) {
                list = await tsdbSearch(toks[0]);
                pick = list.find(teamOk) || null;
            }
        }
        if (!pick) return "";
        for (const raw of [pick.strCutout, pick.strThumb, pick.strRender]) {
            if (!raw) continue;
            for (const u of [raw + "/small", raw]) { if (await imgOk(u)) return u; }
        }
        return "";
    }
    async function wikiPhoto(name) {
        const q = encodeURIComponent(String(name).trim() + " footballer");
        const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${q}&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=200`);
        if (!res.ok) throw new Error("http " + res.status);
        const j = await res.json();
        const pages = Object.values((j && j.query && j.query.pages) || {}).sort((a, b) => (a.index || 99) - (b.index || 99));
        const key = photoTokens(name).filter(t => t.length > 2).sort((a, b) => b.length - a.length)[0];
        if (!key) return "";
        for (const pg of pages) {
            if (!pg.thumbnail || !pg.thumbnail.source) continue;
            if (!photoTokens(pg.title).includes(key)) continue;
            if (await imgOk(pg.thumbnail.source)) return pg.thumbnail.source;
        }
        return "";
    }
    function deepPhotoFor(name, team) {
        const key = photoKey(name);
        if (!key) return Promise.resolve("");
        if (deepMiss[key] && Date.now() - deepMiss[key] < 6 * 3600000) return Promise.resolve("");
        if (deepBusy[key]) return deepBusy[key];
        deepBusy[key] = (async () => {
            let url = "", failed = false;
            try { url = await tsdbPhoto(name, team); } catch (e) { failed = true; }
            if (!url) { try { url = await wikiPhoto(name); } catch (e) { failed = true; } }
            if (!url && !failed) { deepMiss[key] = Date.now(); try { localStorage.setItem(PHOTO_MISS_KEY, JSON.stringify(deepMiss)); } catch (e) {} }
            return url;
        })();
        const done = () => { delete deepBusy[key]; };
        deepBusy[key].then(done, done);
        return deepBusy[key];
    }
    async function deepFillPlayers(list) {
        const queue = list.slice();
        const worker = async () => {
            while (queue.length) {
                const p = queue.shift();
                if (!p || p.photo) continue;
                const url = await deepPhotoFor(p.name, p.__team);
                if (!url) continue;
                p.photo = url;
                playerPhotos[photoKey(p.name)] = url;
                savePhotoCache();
                patchPlayerPhoto(p.name);
            }
        };
        await Promise.all([worker(), worker(), worker()]);
    }
    function patchPlayerPhoto(name) {
        const key = photoKey(name);
        const url = photoLookup(name);
        if (!url) return;
        document.querySelectorAll("[data-wr]").forEach(wrap => {
            if (wrap.dataset.wr !== key) return;
            const img = wrap.querySelector("img.p-photo");
            wrap.classList.remove("p-nophoto");
            if (img) { img.dataset.nm = name; img.dataset.retry = ""; img.src = url; img.style.opacity = 1; return; }
            const el = document.createElement("img");
            el.className = "p-photo";
            el.dataset.ph = key;
            el.alt = "";
            el.src = url;
            el.dataset.nm = name;
            el.onerror = () => photoFail(el);
            wrap.insertBefore(el, wrap.firstChild);
        });
    }
    /* משלים תמונות שלא הגיעו מהשרת — לפי שם השחקן, נשמר פעם אחת במטמון המקומי */
    const photoFillBusy = new Set();
    /* תמונות השחקנים מגיעות ישירות ממקור ההרכבים (בקשה אחת לכל משחק),
       כדי שגם הרכב שמגיע מהשרת בלי שדה תמונה יקבל פנים בעיגול. */
    const FOTMOB_MATCH_URL = "https://www.fotmob.com/api/data/matchDetails?matchId=";
    const FOTMOB_DAY_URL = "https://www.fotmob.com/api/data/matches?date=";
    const shiftDay = (day, diff) => {
        const t = Date.parse(`${day}T00:00:00Z`);
        return isNaN(t) ? "" : new Date(t + diff * 86400000).toISOString().slice(0, 10);
    };
    // מזהה המשחק אצל ספק ההרכבים — לפי המזהה הידוע, ואם אין כזה, לפי התאריך
    async function fotmobMatchId(matchId, dateStr) {
        if (matchId) return matchId;
        const day = String(dateStr || "").slice(0, 10);
        if (day.length !== 10) return null;
        for (const d of [day, shiftDay(day, -1), shiftDay(day, 1)]) {
            if (!d) continue;
            try {
                const res = await fetch(FOTMOB_DAY_URL + d.replace(/-/g, ""), { cache: "no-store" });
                if (!res.ok) continue;
                const json = await res.json();
                for (const league of json.leagues || []) {
                    for (const mm of league.matches || []) {
                        if (mm?.home?.id === 8633 || mm?.away?.id === 8633) return mm.id;
                    }
                }
            } catch (e) { /* ממשיכים ליום הבא */ }
        }
        return null;
    }
    async function fotmobPhotoMap(matchId) {
        if (!matchId) return {};
        try {
            const res = await fetch(FOTMOB_MATCH_URL + matchId, { cache: "no-store" });
            if (!res.ok) return {};
            const json = await res.json();
            const lineup = json && json.content && json.content.lineup;
            if (!lineup) return {};
            const map = {};
            const collect = list => (list || []).forEach(p => {
                if (p && p.name && p.id) {
                    map[photoKey(p.name)] = `https://images.fotmob.com/image_resources/playerimages/${p.id}.png`;
                }
            });
            [lineup.homeTeam, lineup.awayTeam].forEach(t => {
                if (!t) return;
                collect(t.starters);
                collect(t.subs);
            });
            return map;
        } catch (e) { return {}; }
    }
    async function fillMissingPhotos(m) {
        const data = lineupCache[m.id] && lineupCache[m.id].data;
        if (!data || !data.available || photoFillBusy.has(m.id)) return;
        const pending = [];
        [data.home, data.away].forEach(t => {
            if (!t) return;
            (t.lines || []).forEach(l => (l.players || []).forEach(p => p && pending.push(p)));
            (t.startXI || []).forEach(p => p && pending.push(p));
            (t.subs || []).forEach(p => p && pending.push(p));
        });
        [data.home, data.away].forEach(t => {
            if (!t) return;
            [].concat(...(t.lines || []).map(l => l.players || []), t.startXI || [], t.subs || []).forEach(p => { if (p && !p.__team) p.__team = t.name || ""; });
        });
        photoFillBusy.add(m.id);
        try {
            const missing = () => pending.filter(p => !p.photo && !photoLookup(p.name));
            const resolve = pool => pending.forEach(p => {
                if (p.photo) return;
                const url = photoLookup(p.name, pool) || photoLookup(p.name);
                if (url) { p.photo = url; playerPhotos[photoKey(p.name)] = url; }
            });
            if (missing().length) {
                const kickoffMs = data.kickoff ? Date.parse(data.kickoff) : matchKickoff(m);
                const kickoffDay = Number.isFinite(kickoffMs) ? new Date(kickoffMs).toISOString().slice(0, 10) : "";
                /* מנסים כל מזהה משחק אפשרי עד שכל השחקנים (משתי הקבוצות) מקבלים תמונה:
                   המזהה של לוח המשחקים, המזהה מהשרת, ולבסוף חיפוש לפי תאריך */
                const ids = [];
                const addId = x => { x = x ? String(x) : ""; if (x && !ids.includes(x)) ids.push(x); };
                addId((findFotmobFixture(m) || {}).id);
                addId(data.matchId);
                const absorb = map => {
                    if (!map || !Object.keys(map).length) return;
                    playerPhotos = { ...playerPhotos, ...map };
                    resolve(map);
                };
                for (const id of ids) {
                    absorb(await fotmobPhotoMap(id));
                    if (!missing().length) break;
                }
                if (missing().length) {
                    const byDate = await fotmobMatchId(null, kickoffDay);
                    if (byDate && !ids.includes(String(byDate))) absorb(await fotmobPhotoMap(byDate));
                }
                savePhotoCache();
            }
            pending.forEach(p => {
                if (!p.photo) { const u = photoLookup(p.name); if (u) p.photo = u; }
                if (p.photo) patchPlayerPhoto(p.name);
            });
            const still = pending.filter(p => !p.photo && !photoLookup(p.name));
            if (still.length) deepFillPlayers(still).catch(() => {});
        } finally { photoFillBusy.delete(m.id); }
    }

    function matchKickoff(m) {
        const dateStr = currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
        const timeStr = currentData[`time_${m.id}`] !== undefined ? currentData[`time_${m.id}`] : (m.time || "22:00");
        if (!dateStr) return null;
        const t = new Date(`${dateStr}T${timeStr}`).getTime();
        return isNaN(t) ? null : t;
    }
    function matchDateStr(m) {
        return currentData[`date_${m.id}`] !== undefined ? currentData[`date_${m.id}`] : m.date;
    }
    function lineupLockText(m) {
        const ko = matchKickoff(m);
        if (!ko) return "";
        const mins = Math.max(1, Math.ceil((ko - LINEUP_WINDOW_MS - Date.now()) / 60000));
        if (mins >= 60) return `עוד ${Math.floor(mins / 60)} ש׳ ${mins % 60} דק׳`;
        return `עוד ${mins} דק׳`;
    }
    async function loadLineups(m) {
        if (!matchKickoff(m)) return;
        lineupCache[m.id] = { ...(lineupCache[m.id] || {}), loading: true };
        if (lineupOpenMatchId === m.id) renderLineupBody(m);
        try {
            // the fixture id is already known on this side — the server doesn't have
            // to guess the game from a date, which is what kept it too slow
            const f = findFotmobFixture(m);
            const data = await callFootballAPI({ date: matchDateStr(m), matchId: f && f.id ? f.id : null });
            lineupCache[m.id] = { fetchedAt: Date.now(), data, loading: false };
            await fillMissingPhotos(m);          // תמונות מצורפות לפני הציור — בלי עיגולים ריקים
        } catch (e) {
            lineupCache[m.id] = { error: (e && e.message) || "שגיאה", loading: false };
        }
        if (lineupOpenMatchId === m.id) renderLineupBody(m);
    }
    function shortName(name) {
        const str = String(name || "").trim();

    function playerChipHTML(p) {

            <div class="p-photo-wrap ${src ? "" : "p-nophoto"}" data-wr="${key}" data-ini="${photoInitials(p.name)}">

                ${p.number ? `<span class="p-badge">${p.number}</span>` : ""}
            </div>
            <span class="p-name">${shortName(p.name)}</span>
        </div>`;
    }
    function lineupTeamHTML(t) {
        if (!t) return "";
        const lines = (t.lines || []).map(l => `<div class="pitch-line">${(l.players || []).map(playerChipHTML).join("")}</div>`).join("");
        const subs = (t.subs || []).map(p => `<div class="lineup-player"><span class="lineup-num">${p.number || "-"}</span><span>${p.name}</span></div>`).join("");
        return `<div class="lineup-team-card">
            <div class="lineup-team-head">
                ${t.logo ? `<img class="lineup-team-logo" src="${t.logo}" alt="" onerror="this.style.display='none'">` : ""}
                <span class="lineup-team-name">${t.name}</span>
                ${t.formation ? `<span class="lineup-formation">${t.formation}</span>` : ""}
            </div>
            <div class="pitch">${lines}</div>
            <div class="lineup-label">מחליפים</div>
            ${subs || '<div class="lineup-player">—</div>'}
        </div>`;
    }
    /* התשובה עשויה להגיע בשני מבנים: lines (השרת הנוכחי) או startXI (גרסה קודמת) —
       כך ההרכב מוצג תמיד, גם לפני פרסום מחדש של השרת. */
    function normalizeLineupTeam(t) {
        if (!t) return null;
        let lines = (t.lines || []).filter(l => l && (l.players || []).length);
        if (!lines.length && Array.isArray(t.startXI) && t.startXI.length) {
            const players = t.startXI;
            const sizes = String(t.formation || "").split("-").map(Number).filter(n => n > 0);
            if (sizes.length && sizes.reduce((a, b) => a + b, 0) === players.length - 1) {
                lines = [{ role: "GK", players: [players[0]] }];
                let idx = 1;
                sizes.forEach(n => { lines.push({ role: "MID", players: players.slice(idx, idx + n) }); idx += n; });
            } else {
                lines = [{ role: "XI", players }];
            }
        }
        return { name: t.name, logo: t.logo, formation: t.formation, lines, subs: t.subs || [] };
    }
    function renderLineupBody(m) {
        const body = document.getElementById("lineupBody");
        if (!body) return;
        const ko = matchKickoff(m);
        const cache = lineupCache[m.id];
        const hasData = cache && cache.data && cache.data.available;
        if (!hasData && ko && (ko - LINEUP_WINDOW_MS) > Date.now()) {
            body.innerHTML = `<div class="lineup-status">🔒 ההרכבים ייחשפו 90 דקות לפני השריקה<br><span class="lineup-lock-timer" id="lineupLockText">${lineupLockText(m)}</span></div>`;
            return;
        }
        if (!cache || cache.loading) {
            body.innerHTML = `<div class="lineup-status">⏳ טוען הרכבים…</div>`;
            return;
        }
        if (cache.error) {
            body.innerHTML = `<div class="lineup-status">⚠️ לא הצלחתי לטעון הרכבים<br><span style="font-size:0.72rem;opacity:0.85;">${cache.error}</span></div>`;
            return;
        }
        const d = cache.data || {};
        if (!d.available) {
            const msg = d.reason === "no_fixture"
                ? "לא נמצא משחק תואם לתאריך הזה"
                : "ההרכבים טרם פורסמו — העמוד מתעדכן אוטומטית";
            body.innerHTML = `<div class="lineup-status">⏳ ${msg}</div>`;
            return;
        }
        /* Real Madrid always on the left, exactly like everywhere else in the app */
        const orderedTeams = [normalizeLineupTeam(d.home), normalizeLineupTeam(d.away)].filter(Boolean)
            .sort((a, b) => (canonicalTeam(a.name) === "real madrid" ? -1 : canonicalTeam(b.name) === "real madrid" ? 1 : 0));
        const scoreLine = (d.realGoals !== null && d.realGoals !== undefined && d.oppGoals !== null && d.oppGoals !== undefined)
            ? `<div class="lineup-score">${d.realGoals} - ${d.oppGoals} <span>תוצאה סופית</span></div>` : "";
        body.innerHTML = `${scoreLine}<div class="lineup-teams">${orderedTeams.map(lineupTeamHTML).join("")}</div>
            <div class="lmv-source">📡 עדכון אוטומטי • ${new Date(cache.fetchedAt).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" })}</div>`;
        fillMissingPhotos(m);
    }
    function openLineup(matchId) {
        const m = currentMatches.find(x => x.id === matchId);
        if (!m) return;
        lineupOpenMatchId = matchId;
        document.getElementById("lineupOverlay").classList.add("show");
        document.getElementById("lineupTitle").innerText = m.match;
        renderLineupBody(m);
        if (lineupPollTimer) clearInterval(lineupPollTimer);
        const ko = matchKickoff(m);
        const needsFetch = !(lineupCache[m.id] && lineupCache[m.id].data && lineupCache[m.id].data.available);
        // every match that already kicked off — even seasons ago — has lineups to load
        if (needsFetch && (!ko || (ko - LINEUP_WINDOW_MS) <= Date.now())) loadLineups(m);
        lineupPollTimer = setInterval(() => {
            const cur = currentMatches.find(x => x.id === lineupOpenMatchId);
            if (!cur) return;
            const c = lineupCache[cur.id];
            if (c && c.data && c.data.available) return;
            const k = matchKickoff(cur);
            if (k && (k - LINEUP_WINDOW_MS) > Date.now()) return;
            if (k && Date.now() - k > 4 * 3600000) return; // משחק שהסתיים מזמן — אין על מה להמתין
            loadLineups(cur);
        }, 90000);
    }
    function closeLineup() {
        lineupOpenMatchId = "";
        document.getElementById("lineupOverlay").classList.remove("show");
        if (lineupPollTimer) { clearInterval(lineupPollTimer); lineupPollTimer = null; }
    }
    function tickLineupOverlay() {
        if (!lineupOpenMatchId) return;
        const m = currentMatches.find(x => x.id === lineupOpenMatchId);
        const el = document.getElementById("lineupLockText");
        if (m && el) el.innerText = lineupLockText(m);
    }
    /* טעינה מקדימה של ההרכב הקרוב — כדי שפתיחת ההרכב תהיה מיידית עם כל התמונות */
    async function prefetchNextLineup() {
        const now = Date.now();
        const next = currentMatches
            .map(m => ({ m, ko: matchKickoff(m) }))
            .filter(x => x.ko && x.ko > now - 4 * 3600000)
            .sort((a, b) => Math.abs(a.ko - now) - Math.abs(b.ko - now))[0];
        if (!next) return;
        const flag = `lineupPrefetch_${next.m.id}`;
        try {
            if (sessionStorage.getItem(flag)) return;
            sessionStorage.setItem(flag, "1");
        } catch (e) {}
        if (lineupCache[next.m.id] && lineupCache[next.m.id].data) return;
        try { await loadLineups(next.m); } catch (e) {}
    }
    function autoCheckLineups() {
        const now = Date.now();
        if (now - lastLineupAutoCheck < 300000) return;
        lastLineupAutoCheck = now;
        currentMatches.forEach(m => {
            const ko = matchKickoff(m);
            if (!ko) return;
            const delta = ko - now;
            if (delta > LINEUP_WINDOW_MS || delta < -3 * 3600000) return;
            const c = lineupCache[m.id];
            if (c && (c.loading || (c.data && c.data.available))) return;
            loadLineups(m);
        });
    }

    /* ============================================================
       INIT + TEST
       ============================================================ */
    fetchLiveScores();
    scheduleNextFetch();
    loadFixtureBadges();
    /* רענון תאריכים ושעות מהפיד כל 20 דקות ובכל חזרה לאתר */
    setInterval(() => { loadFixtureBadges(); }, 20 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadFixtureBadges(); });
    setInterval(loadFixtureBadges, 3 * 60 * 1000);
    setTimeout(prefetchNextLineup, 2500);
    // expose test helper
    window.testApi = async function() {
        console.log("=== TEST: TheSportsDB eventsnext for Real Madrid ===");
        try {
            const res = await fetch(TSDB_NEXT_URL, { cache: "no-store" });
            console.log("HTTP", res.status);
            const json = await res.json();
            const events = (json && json.events) || [];
            console.log(`✅ ${events.length} events returned`);
            events.forEach(e => {
                const live = isEventLive(e);
                console.log(`${live ? '🔴 LIVE' : '📅'} ${e.strHomeTeam} ${e.intHomeScore ?? 0}-${e.intAwayScore ?? 0} ${e.strAwayTeam} | ${e.strStatus} | ${e.dateEvent} ${e.strTime}`);
            });
            console.log("Live matches:", events.filter(isEventLive).length);
            console.log("Upcoming matches:", events.filter(e => !isEventLive(e)).length);
        } catch (err) {
            console.error("❌ TEST FAILED:", err);
        }
    };
    window.testApi();
</script>

<script>
/* ===== תוספות: סרגל סגירת ניחושים · התראת "ההרכב יצא" · פס משחק חי עם ניחושי כולם וציר זמן ===== */
(function () {

  var CSS = ".xa-bar{margin:10px 12px;padding:10px 14px;border-radius:14px;border:1px solid var(--gold-accent,#d4a32e);background:rgba(11,45,39,.92);color:var(--text-main,#f0ede6);cursor:pointer;direction:rtl;text-align:right;font-family:var(--font-body,'Assistant',sans-serif);}" +
    ".xa-bar.xa-urgent{border-color:#e2464a;background:rgba(60,18,20,.92);}" +
    ".xa-bar b{color:#f4d47c;} .xa-bar .xa-t{font-family:'JetBrains Mono',monospace;font-weight:800;color:#f4d47c;}" +
    ".xa-bar .xa-sub{font-size:.82rem;color:var(--text-muted,#8fa89e);margin-top:4px;line-height:1.5;}" +
    ".xa-live{margin:10px 12px;direction:rtl;font-family:var(--font-body,'Assistant',sans-serif);}" +
    ".xa-card{border:1px solid var(--border-color,#123830);background:rgba(11,45,39,.92);border-radius:16px;padding:12px;margin-bottom:10px;color:var(--text-main,#f0ede6);}" +
    ".xa-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:8px;}" +
    ".xa-score{font-family:'JetBrains Mono',monospace;color:#f4d47c;font-size:1.1rem;}" +
    ".xa-chips{display:flex;flex-wrap:wrap;gap:6px;}" +
    ".xa-chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;background:rgba(5,22,19,.9);border:1px solid var(--border-color,#123830);font-size:.85rem;}" +
    ".xa-chip i{font-style:normal;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text-muted,#8fa89e);}" +
    ".xa-chip.xa-ok{border-color:#2fb36b;background:rgba(20,70,45,.85);} .xa-chip.xa-ok i{color:#7dffb0;}" +
    ".xa-note{font-size:.78rem;color:var(--text-muted,#8fa89e);margin-top:8px;}" +
    ".xa-btn{margin-top:10px;width:100%;border:1px solid var(--gold-accent,#d4a32e);background:none;color:#f4d47c;border-radius:10px;padding:8px;font-weight:700;cursor:pointer;font-family:inherit;}" +
    ".xa-ev{margin-top:10px;border-top:1px solid var(--border-color,#123830);padding-top:8px;}" +
    ".xa-ev div{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:.88rem;}" +
    ".xa-ev .xa-min{flex:0 0 42px;font-family:'JetBrains Mono',monospace;color:#f4d47c;font-weight:700;}";
  var openEvents = {}, evCache = {}, evBusy = {}, lastLive = "", lastBar = "";
  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function ready() { return typeof currentMatches !== "undefined" && typeof currentData !== "undefined" && typeof activePlayersList !== "undefined" && Array.isArray(currentMatches) && currentMatches.length; }
  function pad(n) { return String(n).padStart(2, "0"); }
  function clock(ms) { var t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor((t % 86400) / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return (d ? d + " ימים " : "") + pad(h) + ":" + pad(m) + ":" + pad(s); }
  function guess(m, p) { return normalizeScoreStr(currentData["pred_" + m.id + "_" + p]); }
  function ensureStyle() { if (document.getElementById("xaStyle")) return; var st = document.createElement("style"); st.id = "xaStyle"; st.textContent = CSS; document.head.appendChild(st); }
  function slot(id, afterEl, beforeEl) {
    var el = document.getElementById(id); if (el) return el;
    el = document.createElement("div"); el.id = id;
    if (afterEl && afterEl.parentNode) afterEl.parentNode.insertBefore(el, afterEl.nextSibling);
    else if (beforeEl && beforeEl.parentNode) beforeEl.parentNode.insertBefore(el, beforeEl);
    else return null;
    return el;
  }

  /* ---- 1. סרגל "הניחושים נסגרים בעוד…" ---- */
  function nextDeadline() {
    var now = Date.now(), best = null;
    currentMatches.forEach(function (m) {
      if (!m) return;
      var ko = matchKickoff(m); if (!ko) return;
      var lock = ko + LOCK_AFTER_MS;
      if (lock <= now || lock - now > 72 * 3600000) return;
      if (isPredictionLocked(m) || getMatchStatus(m).isEnded) return;
      if (!best || lock < best.lock) best = { m: m, lock: lock };
    });
    return best;
  }
  function missingFor(m) { return activePlayersList.filter(function (p) { return !guess(m, p); }); }
  function renderBar() {
    var el = slot("xaBar", null, document.getElementById("filterBar")); if (!el) return;
    var d = nextDeadline();
    if (!d) { if (lastBar !== "") { el.innerHTML = ""; lastBar = ""; } return; }
    var left = d.lock - Date.now(), miss = missingFor(d.m);
    var html = "<div class='xa-bar " + (left < 3600000 ? "xa-urgent" : "") + "' data-id='" + esc(d.m.id) + "'>⏳ הניחושים ל<b>" + esc(d.m.match) + "</b> נסגרים בעוד <span class='xa-t'>" + clock(left) + "</span>" +
      "<div class='xa-sub'>" + (miss.length ? "עוד לא ניחשו: " + miss.map(esc).join(", ") : "✅ כולם כבר ניחשו") + "</div></div>";
    if (html !== lastBar) {
      el.innerHTML = html; lastBar = html;
      var bar = el.firstChild;
      bar.addEventListener("click", function () { try { scrollToMatch(bar.getAttribute("data-id")); } catch (e) {} });
    }
  }
  function notifyDeadline() {
    if (typeof BlancosNotify === "undefined" || typeof notifiedPhases === "undefined") return;
    var d = nextDeadline(); if (!d) return;
    var left = d.lock - Date.now(), key = "deadline_" + d.m.id;
    if (left > 30 * 60000 || notifiedPhases.has(key)) return;
    var miss = missingFor(d.m); if (!miss.length) return;
    notifiedPhases.add(key); saveNotifiedPhases();
    BlancosNotify.show({ kind: "deadline", tag: key, title: "⏳ הניחושים נסגרים בקרוב", body: d.m.match + " — עוד לא ניחשו: " + miss.join(", ") });
  }

  /* ---- 2. התראה "ההרכב יצא" ---- */
  function notifyLineups() {
    if (typeof BlancosNotify === "undefined" || typeof notifiedPhases === "undefined" || typeof lineupCache === "undefined") return;
    var now = Date.now();
    currentMatches.forEach(function (m) {
      if (!m) return;
      var ko = matchKickoff(m); if (!ko) return;
      if (ko - now > LINEUP_WINDOW_MS || now - ko > 3 * 3600000) return;
      var c = lineupCache[m.id], key = "lineup_" + m.id;
      if (!(c && c.data && c.data.available) || notifiedPhases.has(key)) return;
      notifiedPhases.add(key); saveNotifiedPhases();
      BlancosNotify.show({ kind: "lineup", tag: key, title: "📋 ההרכב יצא!", body: realFirstLabel(m) + " — לחץ על ״הרכבים״ כדי לראות מי פותח" });
    });
  }

  /* ---- 3. פס משחק חי: ניחושי כולם (ירוק = צודק כרגע) + ציר זמן ---- */
  function liveMatches() { return currentMatches.filter(function (m) { return m && getMatchStatus(m).isLive; }); }
  function eventIcon(e) {
    var t = String(e.type || "").toLowerCase(), c = String(e.card || e.cardType || "").toLowerCase();
    if (t.indexOf("goal") >= 0) return "⚽";
    if (t.indexOf("card") >= 0) return c.indexOf("red") >= 0 ? "🟥" : "🟨";
    if (t.indexOf("sub") >= 0) return "🔄";
    if (t.indexOf("var") >= 0) return "📺";
    return "";
  }
  function eventsHTML(id) {
    var list = evCache[id];
    if (list === undefined) return "<div class='xa-ev'><div>⏳ טוען ציר זמן…</div></div>";
    if (!list.length) return "<div class='xa-ev'><div>עדיין אין אירועים (גולים, כרטיסים, חילופים) — מתעדכן אוטומטית</div></div>";
    return "<div class='xa-ev'>" + list.map(function (e) { return "<div><span class='xa-min'>" + esc(e.min) + "</span><span>" + e.icon + " " + esc(e.text) + "</span></div>"; }).join("") + "</div>";
  }
  function loadEvents(m) {
    if (evBusy[m.id]) return; evBusy[m.id] = true;
    var f = null; try { f = findFotmobFixture(m); } catch (e) {}
    Promise.resolve(fotmobMatchId(f && f.id ? f.id : null, matchDateStr(m))).then(function (fid) {
      if (!fid) throw new Error("no id");
      return fetch(FOTMOB_MATCH_URL + fid, { cache: "no-store" });
    }).then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); }).then(function (j) {
