<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ליגת הניחושים - ריאל מדריד 2026/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --rm-dark-bg: #070a10;
            --rm-card-bg: rgba(15, 23, 42, 0.75);
            --rm-navy: #0f172a;
            --rm-dark-blue: #1e293b;
            --rm-gold: #fbbf24;
            --rm-gold-glow: rgba(251, 191, 36, 0.4);
            --rm-gold-hover: #fcd34d;
            --rm-white: #ffffff;
            --rm-border: rgba(251, 191, 36, 0.22);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --clasico-red: #ef4444;
            --clasico-bg: rgba(185, 28, 28, 0.2);
            --clasico-border: rgba(239, 68, 68, 0.5);
            --success-green: #10b981;
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.6);
            --glass-blur: blur(16px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }

        body {
            background-color: var(--rm-dark-bg);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(30, 58, 138, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(251, 191, 36, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 15% 70%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(7, 10, 16, 0.85) 100%);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--rm-white);
            padding: 45px 20px 35px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid var(--rm-gold);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "HALA MADRID";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8.5rem; font-weight: 800;
            color: var(--rm-gold);
            opacity: 0.025; letter-spacing: 10px;
            pointer-events: none; white-space: nowrap;
        }

        .header-title {
            font-size: 2.6rem; font-weight: 800; margin-bottom: 6px;
            color: var(--rm-white); display: flex; align-items: center; justify-content: center; gap: 14px;
            letter-spacing: -0.5px;
        }
        .header-title span { 
            color: var(--rm-gold); 
            text-shadow: 0 0 20px var(--rm-gold-glow); 
            font-family: 'Assistant', sans-serif;
        }
        .header-subtitle { font-size: 1.05rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.3px; }

        .add-player-box { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .add-player-input {
            padding: 10px 16px; border-radius: 10px; border: 1px solid var(--rm-border);
            background: rgba(7, 10, 16, 0.8); color: var(--rm-white); font-size: 0.95rem; outline: none;
            transition: all 0.25s ease;
        }
        .add-player-input:focus { border-color: var(--rm-gold); box-shadow: 0 0 12px var(--rm-gold-glow); }
        .btn-add-player {
            background: linear-gradient(135deg, var(--rm-gold) 0%, #d97706 100%);
            color: var(--rm-navy); border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer;
            transition: all 0.25s ease; box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
        }
        .btn-add-player:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--rm-gold-glow); }

        .players-bar {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 12px;
            margin: -24px auto 35px; max-width: 1200px; padding: 0 15px; position: relative; z-index: 10;
        }
        .player-badge {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 8px 16px; border-radius: 40px; font-weight: 700; font-size: 1rem;
            box-shadow: var(--shadow-sm); border: 1px solid var(--rm-border); color: var(--rm-white);
            display: flex; align-items: center; gap: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .player-badge:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 24px var(--rm-gold-glow); border-color: var(--rm-gold); }
        .player-badge .pts {
            background: linear-gradient(135deg, var(--rm-gold) 0%, #b45309 100%);
            color: #000000; padding: 2px 10px; border-radius: 20px;
            font-size: 1.1rem; font-weight: 700; font-family: 'Teko', sans-serif; letter-spacing: 0.5px;
        }
        .remove-player-btn {
            background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s;
        }
        .remove-player-btn:hover { background: #ef4444; color: #ffffff; border-color: #ef4444; }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .actions-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
            background: var(--rm-card-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            padding: 16px 24px; border-radius: 16px; box-shadow: var(--shadow-sm); border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .info-note { font-size: 0.95rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .status-badge {
            background: rgba(16, 185, 129, 0.1); color: var(--success-green);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 16px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 700;
        }
        .btn-clear {
            background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 8px 18px; font-weight: 700; font-size: 0.85rem; border-radius: 10px; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear:hover { background: #ef4444; color: var(--rm-white); }

        .table-card { 
            background: var(--rm-card-bg); 
            backdrop-filter: var(--glass-blur); 
            -webkit-backdrop-filter: var(--glass-blur); 
            border-radius: 20px; 
            box-shadow: var(--shadow-md); 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.95rem; }
        thead th { 
            background-color: var(--rm-navy); 
            color: var(--rm-gold); 
            padding: 20px 14px; 
            font-weight: 700; 
            border-bottom: 2px solid var(--rm-gold); 
            letter-spacing: 0.5px;
        }
        thead th.player-header { background-color: var(--rm-dark-blue); color: var(--rm-white); min-width: 90px; }
        tbody tr { border-bottom: 1px solid rgba(255, 255, 255, 0.04); transition: background 0.2s; }
        tbody tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.01); }
        tbody tr:hover { background-color: rgba(251, 191, 36, 0.04); }
        td.match-cell { text-align: right; padding: 18px 20px; font-weight: 700; color: var(--rm-white); white-space: nowrap; }
        td.date-cell { color: var(--text-muted); font-size: 0.88rem; white-space: nowrap; padding: 18px 12px; }
        
        tr.clasico-row { background-color: var(--clasico-bg) !important; border-bottom: 1px solid var(--clasico-border); }
        tr.clasico-row td.match-cell { color: #fca5a5; }
        .clasico-badge { 
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); 
            color: var(--rm-white); font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; 
            margin-right: 8px; font-weight: 800; display: inline-block; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
        }

        input.score-input {
            width: 60px; text-align: center; padding: 8px 4px; border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px; font-weight: 700; font-size: 1.1rem; color: var(--rm-white);
            background: rgba(7, 10, 16, 0.6); direction: ltr; font-family: 'Teko', sans-serif; letter-spacing: 1px;
            transition: all 0.2s;
        }
        input.score-input:focus { outline: none; border-color: var(--rm-gold); box-shadow: 0 0 14px var(--rm-gold-glow); background: rgba(7, 10, 16, 0.9); }
        input.actual-score { border-color: var(--rm-gold); background: rgba(251, 191, 36, 0.1); color: var(--rm-gold); font-size: 1.2rem; }

        .winners-grid { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 4px; max-width: 340px; margin: 0 auto; }
        .winner-chip {
            display: inline-flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, 0.04);
            padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08); color: var(--text-muted); transition: all 0.2s ease;
        }
        .winner-chip:hover { border-color: rgba(251, 191, 36, 0.4); color: var(--rm-white); }
        .winner-chip input { display: none; }
        .winner-chip.active { 
            background: linear-gradient(135deg, var(--rm-gold) 0%, #d97706 100%); 
            color: #000000; font-weight: 800; border-color: var(--rm-gold);
            box-shadow: 0 2px 10px var(--rm-gold-glow);
        }
        .winner-chip.active::before { content: "✓"; font-weight: 900; color: #000000; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            🏆 <span>ליגת הניחושים</span> - ריאל מדריד 2026/27
        </div>
       
        <div class="add-player-box">
            <input type="text" id="newPlayerName" class="add-player-input" placeholder="שם שחקן חדש...">
            <button class="btn-add-player" onclick="addNewPlayer()">+ הוסף שחקן</button>
        </div>
    </header>

    <div class="players-bar" id="playersBar"></div>

    <div class="container">
        <div class="actions-bar">
            <div class="info-note">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="status-badge" id="saveStatus">☁️ מחובר לשרת</div>
                <button class="btn-clear" onclick="resetAllData()">🗑️ איפוס נתונים</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead><tr id="tableHeaderRow"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // === FIREBASE CONFIGURATION ===
        const firebaseConfig = {
            apiKey: "AIzaSyCNkYBoD6fBQ-uxmn8tj78yS96a9ipc-5w",
            authDomain: "hablnacos.firebaseapp.com",
            databaseURL: "https://hablnacos-default-rtdb.firebaseio.com",
            projectId: "hablnacos",
            storageBucket: "hablnacos.appspot.com",
            messagingSenderId: "1098555243394",
            appId: "1:1098555243394:web:e00bf2adcf538bd1b97087"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const DEFAULT_PLAYERS = ["ניר", "ליאור", "אבירם", "שון", "חן", "מאור"];
        let currentPlayers = [];
        let currentData = {};

        const matches = [
            { match: "אספניול - ריאל מדריד", date: "22/08/2026", defaultActual: "1-2" },
            { match: "ריאל מדריד - ריאל סוסיאדד", date: "26/08/2026" },
            { match: "ריאל מדריד - מלאגה", date: "30/08/2026" },
            { match: "ריאל בטיס - ריאל מדריד", date: "04/09/2026" },
            { match: "ריאל מדריד - ראיו ואייקאנו", date: "13/09/2026" },
            { match: "אלצ'ה - ריאל מדריד", date: "16/09/2026" },
            { match: "אתלטיקו מדריד - ריאל מדריד", date: "20/09/2026" },
            { match: "ריאל מדריד - ויאריאל", date: "11/10/2026" },
            { match: "ריאל מדריד - סביליה", date: "18/10/2026" },
            { match: "ברצלונה - ריאל מדריד", date: "25/10/2026", isClasico: true },
            { match: "ראסינג סנטנדר - ריאל מדריד", date: "01/11/2026" },
            { match: "ולנסיה - ריאל מדריד", date: "08/11/2026" },
            { match: "ריאל מדריד - סלטה ויגו", date: "22/11/2026" },
            { match: "ריאל מדריד - דפורטיבו אלאבס", date: "29/11/2026" },
            { match: "אתלטיק בילבאו - ריאל מדריד", date: "06/12/2026" },
            { match: "ריאל מדריד - אוססונה", date: "13/12/2026" },
            { match: "דפורטיבו לה קורוניה - ריאל מדריד", date: "20/12/2026" },
            { match: "ריאל מדריד - חטאפה", date: "03/01/2027" },
            { match: "ריאל מדריד - לבאנטה", date: "10/01/2027" },
            { match: "מלאגה - ריאל מדריד", date: "17/01/2027" },
            { match: "ריאל מדריד - ריאל בטיס", date: "24/01/2027" },
            { match: "ראיו ואייקאנו - ריאל מדריד", date: "31/01/2027" },
            { match: "ריאל סוסיאדד - ריאל מדריד", date: "07/02/2027" },
            { match: "ריאל מדריד - אתלטיק בילבאו", date: "14/02/2027" },
            { match: "סביליה - ריאל מדריד", date: "21/02/2027" },
            { match: "ריאל מדריד - ולנסיה", date: "28/02/2027" },
            { match: "ויאריאל - ריאל מדריד", date: "06/03/2027" },
            { match: "ריאל מדריד - אספניול", date: "13/03/2027" },
            { match: "סלטה ויגו - ריאל מדריד", date: "20/03/2027" },
            { match: "ריאל מדריד - אתלטיקו מדריד", date: "03/04/2027" },
            { match: "אוססונה - ריאל מדריד", date: "10/04/2027" },
            { match: "חטאפה - ריאל מדריד", date: "17/04/2027" },
            { match: "ריאל מדריד - אלצ'ה", date: "20/04/2027" },
            { match: "לבאנטה - ריאל מדריד", date: "01/05/2027" },
            { match: "ריאל מדריד - ברצלונה", date: "08/05/2027", isClasico: true },
            { match: "ריאל מדריד - ראסינג סנטנדר", date: "15/05/2027" },
            { match: "דפורטיבו אלאבס - ריאל מדריד", date: "22/05/2027" },
            { match: "ריאל מדריד - דפורטיבו לה קורוניה", date: "29/05/2027" }
        ];

        // === LISTEN TO LIVE FIREBASE UPDATES ===
        db.ref('league_data').on('value', snapshot => {
            const data = snapshot.val() || {};
            currentPlayers = data.players || DEFAULT_PLAYERS;
            currentData = data.predictions || {};

            renderUI();
        });

        function saveToCloud() {
            db.ref('league_data').set({
                players: currentPlayers,
                predictions: currentData
            });
        }

        function addNewPlayer() {
            const input = document.getElementById("newPlayerName");
            const name = input.value.trim();
            if (!name) return;
            if (currentPlayers.includes(name)) { alert("שחקן קיים!"); return; }

            currentPlayers.push(name);
            input.value = "";
            saveToCloud();
        }

        function removePlayer(name) {
            if (confirm(`להסיר את ${name}?`)) {
                currentPlayers = currentPlayers.filter(p => p !== name);
                saveToCloud();
            }
        }

        function onInputSave(key, value) {
            currentData[key] = value;
            db.ref(`league_data/predictions/${key}`).set(value);
        }

        function onWinnerToggle(idx, player, isChecked) {
            const key = `winners_${idx}`;
            let winners = currentData[key] || [];

            if (isChecked) {
                if (!winners.includes(player)) winners.push(player);
            } else {
                winners = winners.filter(p => p !== player);
            }

            currentData[key] = winners;
            db.ref(`league_data/predictions/${key}`).set(winners);
        }

        function updateScores() {
            const scores = {};
            currentPlayers.forEach(p => scores[p] = 0);

            matches.forEach((_, idx) => {
                const winners = currentData[`winners_${idx}`] || [];
                winners.forEach(player => {
                    if (scores[player] !== undefined) scores[player]++;
                });
            });

            currentPlayers.forEach(player => {
                const el = document.getElementById(`score_${player}`);
                if (el) el.innerText = `${scores[player]} נק'`;
            });
        }

        function renderUI() {
            // Render Badges
            document.getElementById("playersBar").innerHTML = currentPlayers.map((player, index) => `
                <div class="player-badge">
                    <button class="remove-player-btn" onclick="removePlayer('${player}')">×</button>
                    ${index === 0 ? '👑' : '⭐'} ${player}
                    <span class="pts" id="score_${player}">0 נק'</span>
                </div>
            `).join("");

            // Render Header
            document.getElementById("tableHeaderRow").innerHTML = `
                <th style="text-align: right; padding-right: 20px;">משחק</th>
                <th>תאריך</th>
                <th>תוצאה בפועל</th>
                <th style="min-width: 260px;">מי צדק?</th>
                ${currentPlayers.map(p => `<th class="player-header">${p}</th>`).join("")}
            `;

            // Render Table Rows
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            matches.forEach((m, idx) => {
                const tr = document.createElement("tr");
                if (m.isClasico) tr.classList.add("clasico-row");

                const savedActual = currentData[`actual_${idx}`] !== undefined ? currentData[`actual_${idx}`] : (m.defaultActual || "");
                const savedWinners = currentData[`winners_${idx}`] || [];

                const winnersHTML = currentPlayers.map(player => {
                    const isChecked = savedWinners.includes(player);
                    return `
                        <label class="winner-chip ${isChecked ? 'active' : ''}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="onWinnerToggle('${idx}', '${player}', this.checked)">
                            ${player}
                        </label>
                    `;
                }).join("");

                const predictionsHTML = currentPlayers.map(player => {
                    const savedPred = currentData[`pred_${idx}_${player}`] || "";
                    return `
                        <td>
                            <input type="text" class="score-input" value="${savedPred}" placeholder="-" onchange="onInputSave('pred_${idx}_${player}', this.value)">
                        </td>
                    `;
                }).join("");

                tr.innerHTML = `
                    <td class="match-cell">${m.isClasico ? '<span class="clasico-badge">אל קלאסיקו</span>' : ''}${m.match}</td>
                    <td class="date-cell">${m.date}</td>
                    <td><input type="text" class="score-input actual-score" value="${savedActual}" placeholder="0-0" onchange="onInputSave('actual_${idx}', this.value)"></td>
                    <td><div class="winners-grid">${winnersHTML}</div></td>
                    ${predictionsHTML}
                `;
                tbody.appendChild(tr);
            });

            updateScores();
        }

        function resetAllData() {
            if (confirm("איפוס מוחלט של כל הנתונים בענן?")) {
                db.ref('league_data').remove();
            }
        }
    </script>
</body>
</html>
